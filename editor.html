<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Editor — Clip Magic</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── Layout ── */
        body {
            overflow: hidden;
        }

        .editor-shell {
            display: grid;
            grid-template-rows: 52px 1fr;
            grid-template-columns: 56px 1fr 280px;
            height: 100vh;
            padding-top: 0;
        }

        /* ── Top Bar ── */
        .editor-topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .topbar-logo-icon {
            width: 30px;
            height: 30px;
            background: var(--gradient-main);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .topbar-logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        .file-name-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            min-width: 160px;
            border-bottom: 1px solid transparent;
            padding: 2px 4px;
            transition: var(--transition);
        }

        .file-name-input:focus {
            border-color: var(--purple);
        }

        .topbar-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.12);
            color: var(--purple);
            border-color: var(--border-hover);
        }

        .icon-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .topbar-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 8px;
        }

        /* ── Left Toolbar ── */
        .editor-tools {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 4px;
            overflow-y: auto;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .tool-btn:hover,
        .tool-btn.active {
            background: rgba(139, 92, 246, 0.14);
            color: var(--purple);
        }

        .tool-btn .tool-label {
            font-size: 0.48rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
            line-height: 1;
        }

        .tool-separator {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── Center: preview + timeline ── */
        .editor-center {
            display: grid;
            display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); height: 100%;
        }

        /* Preview */
        .preview-area { flex: 1; min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .preview-screen {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a0a3a, #0a1a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
        }

        /* ── Sunset Vaporwave Special Effects ── */
        [data-theme="vaporwave"] .editor-center {
            background: linear-gradient(to bottom, #1a0633 0%, #2d0b5a 50%, #4b0d6b 100%) !important;
            position: relative;
            z-index: 1;
        }

        [data-theme="vaporwave"] .preview-area {
            background: transparent !important;
        }

        [data-theme="vaporwave"] .editor-center::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background:
                linear-gradient(rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridMove 3s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 50px;
            }
        }

        [data-theme="vaporwave"] .editor-center::after {
            content: '';
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: linear-gradient(#ff00ff, #ffbb00);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 0, 255, 0.6);
            z-index: -2;
            opacity: 0.55;
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 0% 70%, 0% 72%, 100% 72%, 100% 76%, 0% 76%, 0% 80%, 100% 80%, 100% 84%, 0% 84%, 0% 90%, 100% 90%, 100% 100%, 0% 100%);
        }

        [data-theme="vaporwave"] .bg-orbs {
            display: none;
        }

        [data-theme="vaporwave"] .preview-screen {
            border: 2px solid var(--purple);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(12px);
        }

        .preview-idle {
            text-align: center;
        }

        .preview-idle p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .preview-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px 16px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .scrubber-wrap {
            flex: 1;
            position: relative;
        }

        .scrubber {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        .scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--purple);
            border-radius: 50%;
        }

        .time-display {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.72rem;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Timeline */
        .timeline-area { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; max-height: 45vh; min-height: 180px; }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .timeline-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .track {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .track-label {
            width: 64px;
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-shrink: 0;
            text-align: right;
        }

        .track-lane {
            flex: 1;
            height: 26px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
        }

        .track-lane:hover {
            border-color: var(--border-hover);
        }

        .track-clip {
            position: absolute;
            top: 3px;
            bottom: 3px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            font-size: 0.65rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .clip-video {
            background: rgba(139, 92, 246, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
            left: 0;
            width: 55%;
        }

        .clip-caption {
            background: rgba(6, 182, 212, 0.3);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #67e8f9;
            left: 8%;
            width: 35%;
        }

        .clip-music {
            background: rgba(236, 72, 153, 0.3);
            border: 1px solid rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
            left: 0;
            width: 80%;
        }

        .track-clip:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        /* Trim Handles */
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: rgba(255, 255, 255, 0.7);
            cursor: ew-resize;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .trim-handle::before {
            content: '';
            position: absolute;
            inset: 0 -8px;
            z-index: 1;
        }

        .trim-handle::after {
            content: '';
            width: 2px;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1px;
        }

        .trim-handle-left {
            left: 0;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .trim-handle-right {
            right: 0;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .trim-handle:hover {
            background: #fff;
        }

        .clip-trimming {
            border: 2px solid #fff !important;
        }

        .clip-dragging {
            opacity: 0.5;
            transform: scale(0.95);
            z-index: 100;
        }

        .clip-delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .track-clip:hover .clip-delete-btn {
            display: flex;
        }

        /* ── Right Properties Panel ── */
        .editor-props {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .props-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .props-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        .prop-section {
            margin-bottom: 20px;
        }

        .prop-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .prop-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            width: 80px;
            flex-shrink: 0;
        }

        .prop-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            transition: var(--transition);
        }

        .prop-input:focus {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.06);
        }

        .prop-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .prop-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--gradient-main);
            border-radius: 50%;
        }

        .prop-color {
            flex: 1;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            cursor: pointer;
            background: none;
        }

        .prop-select {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            cursor: pointer;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .chip-option {
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 8px;
            text-align: center;
            font-size: 0.73rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .chip-option:hover,
        .chip-option.active {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.1);
            color: var(--text-primary);
        }

        .waveform-canvas {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            display: block;
            margin-bottom: 10px;
        }

        .bpm-display {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .bpm-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
        }

        .bpm-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .music-btn {
            width: 100%;
            padding: 9px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        /* ── Template Gallery Styles ── */
        .template-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .template-card:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.06);
            transform: translateY(-2px);
        }

        .template-thumb {
            transition: var(--transition);
        }

        .template-card:hover .template-thumb {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .music-btn:hover {
            border-color: var(--border-hover);
            background: rgba(139, 92, 246, 0.08);
            color: var(--text-primary);
        }

        .light-theme-note {
            display: none;
        }

        [data-theme="light"] .preview-screen {
            background: linear-gradient(135deg, #3d2b7a, #1a3a5a);
        }

        /* ── Edit Mode Toggle ── */
        .mode-toggle {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 3px;
            gap: 0;
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .mode-btn:hover {
            color: var(--text-secondary);
        }

        .mode-btn.active {
            background: var(--gradient-main);
            color: white;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        /* ── AI Tools Panel ── */
        .ai-tools-panel {
            display: none;
        }

        .ai-tools-panel.visible {
            display: block;
        }

        .ai-tool-card {
            background: rgba(139, 92, 246, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .ai-tool-card:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.12);
        }

        .ai-tool-card.active {
            border-color: var(--purple);
            box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.3);
        }

        .ai-tool-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .ai-tool-icon {
            font-size: 1.2rem;
        }

        .ai-tool-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .ai-tool-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .ai-run-btn {
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: var(--gradient-main);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ai-run-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-purple);
        }

        .manual-tools-section {
            display: block;
        }

        .manual-tools-section.hidden {
            display: none;
        }

        /* ── Export Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .export-modal {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal-overlay.active .export-modal {
            transform: scale(1);
        }

        .export-progress-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            position: relative;
        }

        .export-progress-circle svg {
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .circle-fill {
            fill: none;
            stroke: var(--purple);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 314;
            stroke-dashoffset: 314;
            transition: stroke-dashoffset 0.1s linear;
        }

        .export-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .editor-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 52px auto 1fr auto;
                height: auto;
                min-height: 100vh;
            }

            .editor-topbar {
                flex-wrap: wrap;
                padding: 8px 12px;
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .editor-tools {
                grid-column: 1;
                grid-row: 2;
                flex-direction: row;
                justify-content: flex-start;
                padding: 8px 10px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
            }

            .tool-btn {
                width: 44px;
                height: 44px;
                flex-shrink: 0;
            }

            .editor-center {
                grid-column: 1;
                grid-row: 3;
            }

            .preview-area {
                min-height: 260px;
            }

            .editor-props {
                grid-column: 1;
                grid-row: 4;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 260px;
            }
        }
    </style>
</head>
<body>
    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal">
        <div class="export-modal">
            <h2 style="font-family:'Outfit'; margin-bottom:12px;">Exporting Project</h2>
            <p style="color:var(--text-secondary); margin-bottom:32px; font-size:0.9rem;" id="exportStatus">Preparing assets...</p>
            <div class="export-progress-circle">
                <svg width="120" height="120">
                    <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                    <circle class="circle-fill" id="exportCircle" cx="60" cy="60" r="50"></circle>
                </svg>
                <div class="export-pct" id="exportPct">0%</div>
            </div>
            <button class="btn btn-ghost" onclick="cancelExport()" id="cancelExportBtn">Cancel Export</button>
            <button class="btn btn-primary" id="downloadBtn" style="display:none; width:100%; justify-content:center;">Download Video</button>
        </div>
    </div>

    <div class="page-wrapper">
        <div class="editor-shell">
            <!-- TOP BAR -->
            <div class="editor-topbar">
                <a href="index.html" class="topbar-logo">
                    <div class="topbar-logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg></div>
                    <span class="topbar-logo-text">Clip Magic</span>
                </a>
                <div class="topbar-divider"></div>
                <input class="file-name-input" id="fileName" value="Untitled Project" title="Click to rename" />
                <div class="topbar-divider"></div>
                <div class="mode-toggle" id="modeToggle">
                    <button class="mode-btn active" id="modeManual" onclick="setEditMode('manual')">Manual</button>
                    <button class="mode-btn" id="modeAI" onclick="setEditMode('ai')">AI</button>
                </div>
                <div class="topbar-actions">
                    <div class="topbar-status" id="statusBar">Ready</div>
                    <button class="icon-btn" onclick="saveProject()" title="Save Project"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v13a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
                    <button class="btn btn-primary" onclick="exportProject()">Export</button>
                </div>
            </div>

            <!-- SIDEBAR -->
            <div class="editor-tools">
                <button class="tool-btn active" id="tool-select" onclick="setTool('select')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z"/></svg>
                    <span class="tool-label">Select</span>
                </button>
                <button class="tool-btn" id="tool-trim" onclick="setTool('trim')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>
                    <span class="tool-label">Trim</span>
                </button>
                <button class="tool-btn" id="tool-split" onclick="setTool('split')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8V5c0-1 1-2 2-2h10c1 0 2 1 2 2v3"/><path d="M19 16v3c0 1-1 2-2 2H7c-1 0-2-1-2-2v-3"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
                    <span class="tool-label">Split</span>
                </button>
                <div class="tool-separator"></div>
                <button class="tool-btn" id="tool-music" onclick="setTool('music')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <span class="tool-label">Music</span>
                </button>
                <button class="tool-btn" id="tool-text" onclick="setTool('text')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                    <span class="tool-label">Text</span>
                </button>
            </div>

            <!-- CENTER WORKSPACE -->
            <div class="editor-center">
                <div class="preview-area">
                    <div class="preview-screen" id="previewScreen">
                        <video id="previewVideo" style="display:none; max-width:100%; max-height:100%;"></video>
                        <div class="preview-idle" id="previewIdle">
                            <div style="font-size:3rem; opacity:0.2; margin-bottom:10px;"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/><polygon points="23 7 16 12 23 17 23 7"/></svg></div>
                            <p>No media loaded</p>
                            <button class="btn btn-ghost" style="margin-top:15px;" onclick="document.getElementById('fileInput').click()">Import Video or Image</button>
                            <input type="file" id="fileInput" hidden accept="video/*,image/*" onchange="loadVideo(event)" />
                        </div>
                    </div>
                    <div class="preview-controls" id="previewControls" style="display:none;">
                        <button class="ctrl-btn" onclick="stepBack()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 19 2 12 11 5 11 19"/><polygon points="22 19 13 12 22 5 22 19"/></svg></button>
                        <button class="ctrl-btn" id="playBtn" onclick="togglePlay()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
                        <button class="ctrl-btn" onclick="stepForward()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 19 22 12 13 5 13 19"/><polygon points="2 19 11 12 2 5 2 19"/></svg></button>
                        <div class="scrubber-wrap">
                            <input type="range" class="scrubber" id="scrubber" value="0" min="0" max="100" oninput="seekVideo(this.value)" />
                        </div>
                        <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
                        <button class="ctrl-btn" id="muteBtn" onclick="toggleMute()"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/></svg></button>
                    </div>
                </div>

                <div class="timeline-area">
                    <div class="timeline-header">
                        <div class="timeline-title">Timeline</div>
                        <div style="display:flex; gap:8px;">
                            <button class="icon-btn" onclick="addTrack('video')" title="Add Video Track"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
                            <button class="icon-btn" onclick="addTrack('audio')" title="Add Audio Track"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
                        </div>
                    </div>
                    <div style="position:relative; flex:1; overflow-y:auto; overflow-x:hidden;">
                        <div id="tracksContainer"></div>
                        <div id="timelinePlayhead" style="position:absolute; top:0; left:100px; height:100%; width:2px; background:var(--purple); z-index:10; pointer-events:none; box-shadow:0 0 15px var(--purple);">
                            <div style="position:absolute; top:-6px; left:-5px; width:12px; height:12px; background:var(--purple); border-radius:50%; box-shadow:0 0 10px var(--purple);"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT PANEL -->
            <div class="editor-props">
                <div class="props-header">
                    <div id="propsIcon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z"/></svg></div>
                    <span id="propsTitle">Properties</span>
                </div>
                <div class="props-body">
                    <div id="manualPropsBody">
                        <div class="preview-idle" style="padding-top:40px;">
                            <p style="font-size:0.8rem;">Select a clip or tool to see properties</p>
                        </div>
                    </div>
                    <div id="aiToolsPanel" class="ai-tools-panel">
                        <div class="ai-tool-card" onclick="toggleAITool(this, 'reframe')">
                            <div class="ai-tool-header">
                                <span class="ai-tool-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12" y2="18"/></svg></span>
                                <span class="ai-tool-name">AI Reframe</span>
                            </div>
                            <div class="ai-tool-desc">Automatically track subjects and crop for vertical formats.</div>
                        </div>
                        <button class="ai-run-btn" onclick="runAIProcessing()"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg> Run AI Processing</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let projectState = {
            id: 'p-' + Date.now(),
            name: 'Untitled Project',
            tracks: [
                { id: 'track-v1', type: 'video', name: 'Video 1', clips: [] },
                { id: 'track-a1', type: 'audio', name: 'Audio 1', clips: [] }
            ],
            bassGain: 0
        };

        function renderTimeline() {
            const container = document.getElementById('tracksContainer');
            if (!container) return;
            container.innerHTML = '';
            const maxDuration = 120;
            projectState.tracks.forEach(track => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.onmousedown = (e) => seekFromTimeline(e);
                const label = document.createElement('span');
                label.className = 'track-label';
                label.innerText = track.name;
                const lane = document.createElement('div');
                lane.className = 'track-lane';
                lane.id = `${track.id}Track`;
                lane.setAttribute('ondragover', 'allowDrop(event)');
                lane.setAttribute('ondrop', `dropClip(event, this)`);
                track.clips.forEach(c => {
                    const clipEl = document.createElement('div');
                    clipEl.className = `track-clip clip-${c.type}`;
                    clipEl.id = `clip-${c.id}`;
                    clipEl.draggable = true;
                    clipEl.ondragstart = (e) => handleDragStart(e, c, track.id);
                    const duration = c.trimEnd - c.trimStart;
                    clipEl.style.left = (c.start / maxDuration * 100) + '%';
                    clipEl.style.width = (duration / maxDuration * 100) + '%';
                    clipEl.style.background = c.color;
                    clipEl.style.border = `1px solid ${c.borderColor}`;
                    clipEl.onclick = (e) => { e.stopPropagation(); selectClip(c); };
                    lane.appendChild(clipEl);
                });
                trackEl.appendChild(label);
                trackEl.appendChild(lane);
                container.appendChild(trackEl);
            });
        }

        const toolConfigs = {
            select: {
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 4 7.07 17 2.51-7.39L21 11.07z"/></svg>',
                title: 'Select Tool',
                html: `<div class="prop-section"><div class="prop-section-title">Clip Info</div><div class="prop-row"><span class="prop-label">Name</span><input class="prop-input" value="Main Clip"/></div></div>`
            },
            text: {
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>',
                title: 'Text & Captions',
                html: `<div class="prop-section"><div class="prop-section-title">Add Caption</div><div class="prop-row"><span class="prop-label">Text</span><input class="prop-input" id="capText" value="Hello!" /></div><button class="music-btn" onclick="addCaption()">＋ Add Caption</button></div>`
            },
            music: {
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
                title: 'Music Engine',
                html: `<div class="prop-section"><div class="prop-section-title">Analysis</div><button class="music-btn" onclick="analyzeAudio()">Analyze BPM</button><button class="music-btn" style="margin-top:8px" onclick="syncCuts()">Sync to Beats</button></div>`
            },
            transform: {
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/><path d="M3 15h18"/></svg>',
                title: 'Transform',
                html: `<div class="prop-section"><div class="prop-section-title">Scale</div><input type="range" class="prop-slider" min="10" max="200" value="100" oninput="scaleVideo(this.value)"/><div class="prop-section-title" style="margin-top:12px">Aspect Ratio</div><div class="chip-grid"><div class="chip-option active" onclick="setAR(this,'16/9')">16:9</div><div class="chip-option" onclick="setAR(this,'9/16')">9:16</div></div></div>`
            }
        };

        let selectedClip = null;
        function selectClip(clip) {
            selectedClip = clip;
            const body = document.getElementById('manualPropsBody');
            // H2 FIX: build inspector panel with DOM APIs — clip.name/id via textContent
            body.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'prop-section';

            const title = document.createElement('div');
            title.className = 'prop-section-title';
            title.textContent = 'Clip: ' + (clip.name || 'Unnamed'); // textContent = safe

            const row = document.createElement('div');
            row.className = 'prop-row';

            const label = document.createElement('span');
            label.className = 'prop-label';
            label.textContent = 'Start';

            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'prop-input';
            input.value = Number.isFinite(clip.start) ? clip.start.toFixed(2) : '0';
            // Use a validated safeId (only our own generated IDs: alphanumeric + dash)
            const safeClipId = /^[a-zA-Z0-9_-]+$/.test(clip.id) ? clip.id : '';
            input.addEventListener('change', function() {
                if (safeClipId) updateClipProps(safeClipId, 'start', this.value);
            });

            const splitBtn = document.createElement('button');
            splitBtn.className = 'music-btn';
            splitBtn.style.marginTop = '10px';
            splitBtn.textContent = '✂ Split Clip';
            splitBtn.addEventListener('click', splitAtPlayhead);

            row.appendChild(label);
            row.appendChild(input);
            section.appendChild(title);
            section.appendChild(row);
            section.appendChild(splitBtn);
            body.appendChild(section);
        }

        function updateClipProps(id, prop, val) {
            projectState.tracks.forEach(t => t.clips.forEach(c => { if(c.id === id) c[prop] = parseFloat(val); }));
            renderTimeline();
        }

        function setTool(name) {
            const cfg = toolConfigs[name] || toolConfigs.select;
            document.getElementById('propsTitle').textContent = cfg.title;
            document.getElementById('manualPropsBody').innerHTML = cfg.html;
        }

        async function analyzeAudio() {
            const vid = document.getElementById('previewVideo');
            if(!vid.src) return showToast('No video!', '⚠️');
            showToast('Analyzing...', '⏳');
            const bpm = await MusicEngine.analyzeBPM(await (await fetch(vid.src)).arrayBuffer());
            document.getElementById('bpmVal').textContent = Math.round(bpm);
            showToast('BPM: ' + Math.round(bpm), '🎯');
        }

        function syncCuts() {
            const bpm = parseInt(document.getElementById('bpmVal')?.textContent);
            if(!bpm) return showToast('Analyze BPM first', '⚠️');
            const interval = 60/bpm;
            projectState.tracks.forEach(t => t.clips.forEach(c => { c.start = Math.round(c.start/interval)*interval; }));
            renderTimeline();
            showToast('Synced!', '🎯');
        }

        function splitAtPlayhead() {
            const vid = document.getElementById('previewVideo');
            if(!vid || !selectedClip) return;
            const time = vid.currentTime;
            const splitPoint = time - selectedClip.start + selectedClip.trimStart;
            const newClip = JSON.parse(JSON.stringify(selectedClip));
            newClip.id = 's' + Date.now();
            newClip.trimStart = splitPoint;
            newClip.start = selectedClip.start + (selectedClip.trimEnd - selectedClip.trimStart);
            selectedClip.trimEnd = splitPoint;
            projectState.tracks.forEach(t => { if(t.clips.includes(selectedClip)) t.clips.push(newClip); });
            renderTimeline();
        }

        function scaleVideo(v) { document.getElementById('previewVideo').style.transform = `scale(${v/100})`; }
        function setAR(el, ar) { document.getElementById('previewScreen').style.aspectRatio = ar; }

        async function handleMusicUpload(e) {
            const f = e.target.files[0]; if(!f) return;
            const assetId = 'm' + Date.now();
            await ProjectService.saveAsset(currentProject.id, assetId, f);
            const url = await AssetManager.getUrl(currentProject.id, assetId);
            const buffer = await MusicEngine.getCtx().decodeAudioData(await (await fetch(url)).arrayBuffer());
            let track = projectState.tracks.find(t => t.type === 'audio');
            track.clips.push({ id: 'm' + Date.now(), assetId, name: f.name, type: 'music', start: 0, duration: buffer.duration, trimStart: 0, trimEnd: buffer.duration, color: 'rgba(236,72,153,0.3)', borderColor: 'rgba(236,72,153,0.5)' });
            renderTimeline();
        }

        function formatTime(s) { return Math.floor(s/60) + ':' + Math.floor(s%60).toString().padStart(2,'0'); }
        function togglePlay() { const vid = document.getElementById('previewVideo'); if(vid.paused) vid.play(); else vid.pause(); }
        function saveProject() { ProjectService.updateProject(currentProject.id, { projectState }); showToast('Saved!', '✅'); }
        
        async function exportProject() {
            document.getElementById('exportModal').classList.add('active');
            await window.handleEditorExport();
            document.getElementById('exportStatus').textContent = 'Done!';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                // M3 FIX: guard against deleted/malformed project IDs
                currentProject = ProjectService.getProject(id);
                if (!currentProject) {
                    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;background:#0a0a0f;flex-direction:column;gap:16px"><h2>Project not found</h2><p>This project may have been deleted or the link is invalid.</p><a href="dashboard.html" style="color:#8b5cf6">Back to Dashboard</a></div>';
                    return;
                }
                if (currentProject.projectState && Array.isArray(currentProject.projectState.tracks)) {
                    projectState = currentProject.projectState;
                }
                const v = projectState.tracks.find(t=>t.type==='video')?.clips[0];
                if(v) {
                    const vid = document.getElementById('previewVideo');
                    vid.src = await AssetManager.getUrl(id, v.assetId);
                    vid.style.display = 'block';
                    document.getElementById('previewIdle').style.display = 'none';
                    document.getElementById('previewControls').style.display = 'flex';
                }
            }
            renderTimeline();
            setTool('select');
        });

        document.getElementById('previewVideo').ontimeupdate = () => {
            const vid = document.getElementById('previewVideo');
            const progress = vid.currentTime / vid.duration;
            document.getElementById('scrubber').value = progress * 100;
            document.getElementById('timeDisplay').textContent = formatTime(vid.currentTime) + ' / ' + formatTime(vid.duration);
            const playhead = document.getElementById('timelinePlayhead');
            if(playhead) playhead.style.left = (72 + progress * (document.querySelector('.track-lane').offsetWidth - 72)) + 'px';
        };
</script>
</body>

</html>
