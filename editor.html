<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Editor — Clip Magic</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── Layout ── */
        body {
            overflow: hidden;
        }

        .editor-shell {
            display: grid;
            grid-template-rows: 52px 1fr;
            grid-template-columns: 56px 1fr 280px;
            height: 100vh;
            padding-top: 0;
        }

        /* ── Top Bar ── */
        .editor-topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .topbar-logo-icon {
            width: 30px;
            height: 30px;
            background: var(--gradient-main);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .topbar-logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        .file-name-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            min-width: 160px;
            border-bottom: 1px solid transparent;
            padding: 2px 4px;
            transition: var(--transition);
        }

        .file-name-input:focus {
            border-color: var(--purple);
        }

        .topbar-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.12);
            color: var(--purple);
            border-color: var(--border-hover);
        }

        .icon-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .topbar-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 8px;
        }

        /* ── Left Toolbar ── */
        .editor-tools {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 4px;
            overflow-y: auto;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .tool-btn:hover,
        .tool-btn.active {
            background: rgba(139, 92, 246, 0.14);
            color: var(--purple);
        }

        .tool-btn .tool-label {
            font-size: 0.48rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
            line-height: 1;
        }

        .tool-separator {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── Center: preview + timeline ── */
        .editor-center {
            display: grid;
            display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); height: 100%;
        }

        /* Preview */
        .preview-area { flex: 1; min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .preview-screen {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a0a3a, #0a1a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
        }

        .preview-screen.filter-vivid video { filter: saturate(1.35) contrast(1.08); }
        .preview-screen.filter-cinematic video { filter: contrast(1.15) saturate(0.82) sepia(0.08); }
        .preview-screen.filter-bw video { filter: grayscale(1) contrast(1.12); }
        .preview-screen.filter-warm video { filter: saturate(1.2) sepia(0.22) hue-rotate(-8deg); }
        .preview-screen.filter-cool video { filter: saturate(0.92) hue-rotate(12deg) brightness(1.04); }
        .text-overlay-layer { position:absolute; inset:0; pointer-events:none; z-index:4; }
        .text-overlay { position:absolute; transform:translate(-50%,-50%); max-width:80%; color:#fff; text-align:center; font-weight:700; text-shadow:0 2px 5px #000; white-space:pre-wrap; }
        .caption-overlay { bottom:8%; left:50%; top:auto; transform:translateX(-50%); background:rgba(0,0,0,.55); padding:6px 10px; border-radius:6px; font-size:1rem; }
        .transition-badge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9; padding:1px 4px; border-radius:3px; background:rgba(8,8,20,.8); color:#ddd6fe; font-size:9px; pointer-events:none; }
        .timeline-waveform { position:absolute; inset:3px 4px; width:calc(100% - 8px); height:calc(100% - 6px); opacity:.9; pointer-events:none; }
        .pip-video { position:absolute; z-index:3; object-fit:cover; border:1px solid rgba(255,255,255,.7); box-shadow:0 4px 20px rgba(0,0,0,.45); pointer-events:none; }
        .grade-vignette::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:2; background:radial-gradient(ellipse, transparent 55%, rgba(0,0,0,.35)); }

        /* ── Sunset Vaporwave Special Effects ── */
        [data-theme="vaporwave"] .editor-center {
            background: linear-gradient(to bottom, #1a0633 0%, #2d0b5a 50%, #4b0d6b 100%) !important;
            position: relative;
            z-index: 1;
        }

        [data-theme="vaporwave"] .preview-area {
            background: transparent !important;
        }

        [data-theme="vaporwave"] .editor-center::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background:
                linear-gradient(rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridMove 3s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 50px;
            }
        }

        [data-theme="vaporwave"] .editor-center::after {
            content: '';
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: linear-gradient(#ff00ff, #ffbb00);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 0, 255, 0.6);
            z-index: -2;
            opacity: 0.55;
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 0% 70%, 0% 72%, 100% 72%, 100% 76%, 0% 76%, 0% 80%, 100% 80%, 100% 84%, 0% 84%, 0% 90%, 100% 90%, 100% 100%, 0% 100%);
        }

        [data-theme="vaporwave"] .bg-orbs {
            display: none;
        }

        [data-theme="vaporwave"] .preview-screen {
            border: 2px solid var(--purple);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(12px);
        }

        .preview-idle {
            text-align: center;
        }

        .preview-idle p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .preview-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px 16px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .scrubber-wrap {
            flex: 1;
            position: relative;
        }

        .scrubber {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        .scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--purple);
            border-radius: 50%;
        }

        .time-display {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.72rem;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Timeline */
        .timeline-area { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; max-height: 45vh; min-height: 180px; }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .timeline-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .track {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .track-label {
            width: 64px;
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-shrink: 0;
            text-align: right;
        }

        .track-lane {
            flex: 1;
            height: 26px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
        }

        .track-lane:hover {
            border-color: var(--border-hover);
        }

        .track-clip {
            position: absolute;
            top: 3px;
            bottom: 3px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            font-size: 0.65rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .clip-video {
            background: rgba(139, 92, 246, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
            left: 0;
            width: 55%;
        }

        .clip-caption {
            background: rgba(6, 182, 212, 0.3);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #67e8f9;
            left: 8%;
            width: 35%;
        }

        .clip-music {
            background: rgba(236, 72, 153, 0.3);
            border: 1px solid rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
            left: 0;
            width: 80%;
        }

        .track-clip:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .track-clip.selected {
            outline: 2px solid var(--purple-light);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
            z-index: 8;
        }

        /* Trim Handles */
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: rgba(255, 255, 255, 0.7);
            cursor: ew-resize;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            touch-action: none;
        }
        .trim-handle::before {
            content: '';
            position: absolute;
            inset: 0 -8px;
            z-index: 1;
        }

        .trim-handle::after {
            content: '';
            width: 2px;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1px;
        }

        .trim-handle-left {
            left: 0;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .trim-handle-right {
            right: 0;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .trim-handle:hover {
            background: #fff;
        }

        .clip-trimming {
            border: 2px solid #fff !important;
            cursor: ew-resize;
        }

        .clip-dragging {
            opacity: 0.5;
            transform: scale(0.95);
            z-index: 100;
        }

        .clip-delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .track-clip:hover .clip-delete-btn {
            display: flex;
        }

        /* ── Right Properties Panel ── */
        .editor-props {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .props-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .props-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        .prop-section {
            margin-bottom: 20px;
        }

        .prop-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .prop-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            width: 80px;
            flex-shrink: 0;
        }

        .prop-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            transition: var(--transition);
        }

        .prop-input:focus {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.06);
        }

        .prop-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }

        .prop-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--gradient-main);
            border-radius: 50%;
        }

        .prop-color {
            flex: 1;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            cursor: pointer;
            background: none;
        }

        .prop-select {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            cursor: pointer;
        }

        .chip-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .chip-option {
            padding: 7px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 8px;
            text-align: center;
            font-size: 0.73rem;
            cursor: pointer;
            transition: var(--transition);
            color: var(--text-secondary);
        }

        .chip-option:hover,
        .chip-option.active {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.1);
            color: var(--text-primary);
        }

        .waveform-canvas {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            display: block;
            margin-bottom: 10px;
        }

        .bpm-display {
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
        }

        .bpm-value {
            font-family: 'Outfit', sans-serif;
            font-size: 2rem;
            font-weight: 800;
        }

        .bpm-label {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .music-btn {
            width: 100%;
            padding: 9px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        /* ── Template Gallery Styles ── */
        .template-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .template-card:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.06);
            transform: translateY(-2px);
        }

        .template-thumb {
            transition: var(--transition);
        }

        .template-card:hover .template-thumb {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);
        }

        .music-btn:hover {
            border-color: var(--border-hover);
            background: rgba(139, 92, 246, 0.08);
            color: var(--text-primary);
        }

        .light-theme-note {
            display: none;
        }

        [data-theme="light"] .preview-screen {
            background: linear-gradient(135deg, #3d2b7a, #1a3a5a);
        }

        /* ── Edit Mode Toggle ── */
        .mode-toggle {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 3px;
            gap: 0;
        }

        .mode-btn {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .mode-btn:hover {
            color: var(--text-secondary);
        }

        .mode-btn.active {
            background: var(--gradient-main);
            color: white;
            box-shadow: 0 2px 8px rgba(139, 92, 246, 0.3);
        }

        /* ── AI Tools Panel ── */
        .ai-tools-panel {
            display: none;
        }

        .ai-tools-panel.visible {
            display: block;
        }

        .ai-tool-card {
            background: rgba(139, 92, 246, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: var(--transition);
        }

        .ai-tool-card:hover {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.12);
        }

        .ai-tool-card.active {
            border-color: var(--purple);
            box-shadow: 0 0 0 1px rgba(139, 92, 246, 0.3);
        }

        .ai-tool-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .ai-tool-icon {
            font-size: 1.2rem;
        }

        .ai-tool-name {
            font-size: 0.85rem;
            font-weight: 700;
        }

        .ai-tool-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .ai-run-btn {
            width: 100%;
            padding: 10px;
            margin-top: 14px;
            background: var(--gradient-main);
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 0.85rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .ai-run-btn:hover {
            transform: translateY(-1px);
            box-shadow: var(--glow-purple);
        }

        .manual-tools-section {
            display: block;
        }

        .manual-tools-section.hidden {
            display: none;
        }

        /* ── Export Modal ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .export-modal {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            transform: scale(0.9);
            transition: var(--transition);
        }

        .modal-overlay.active .export-modal {
            transform: scale(1);
        }

        .export-progress-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            position: relative;
        }

        .export-progress-circle svg {
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.05);
            stroke-width: 8;
        }

        .circle-fill {
            fill: none;
            stroke: var(--purple);
            stroke-width: 8;
            stroke-linecap: round;
            stroke-dasharray: 314;
            stroke-dashoffset: 314;
            transition: stroke-dashoffset 0.1s linear;
        }

        .export-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .editor-shell {
                grid-template-columns: 1fr;
                grid-template-rows: 52px auto 1fr auto;
                height: auto;
                min-height: 100vh;
            }

            .editor-topbar {
                flex-wrap: wrap;
                padding: 8px 12px;
            }

            .topbar-actions {
                width: 100%;
                justify-content: flex-start;
                flex-wrap: wrap;
            }

            .editor-tools {
                grid-column: 1;
                grid-row: 2;
                flex-direction: row;
                justify-content: flex-start;
                padding: 8px 10px;
                border-right: none;
                border-bottom: 1px solid var(--border);
                overflow-x: auto;
            }

            .tool-btn {
                width: 44px;
                height: 44px;
                flex-shrink: 0;
            }

            .editor-center {
                grid-column: 1;
                grid-row: 3;
            }

            .preview-area {
                min-height: 260px;
            }

            .editor-props {
                grid-column: 1;
                grid-row: 4;
                border-left: none;
                border-top: 1px solid var(--border);
                max-height: 260px;
            }
        }
    </style>
    <script src="app.js"></script>
    <script src="music-engine.js"></script>
    <script src="ffmpeg-engine.js"></script>
</head>
<body>

    <script>
        let projectState = {
            id: 'p-' + Date.now(),
            name: 'Untitled Project',
            tracks: [
                { id: 'track-v1', type: 'video', name: 'Video 1', clips: [] },
                { id: 'track-a1', type: 'audio', name: 'Audio 1', clips: [] }
            ],
            textOverlays: [],
            bassGain: 0
        };
        window.projectState = projectState;

        const MAX_TIMELINE_SECONDS = 120;
        const MIN_TRIM_SECONDS = 0.05;
        let timelineRenderQueued = false;
        let timelineZoom = 1;
        let snapEnabled = true;
        let selectedClip = null;
        const undoStack = [];
        const redoStack = [];
        const SNAP_INTERVAL = 0.25;
        const cloneState = (value) => JSON.parse(JSON.stringify(value));
        function updateHistoryButtons() {
            const undo = document.getElementById('undoBtn');
            const redo = document.getElementById('redoBtn');
            if (undo) undo.disabled = undoStack.length === 0;
            if (redo) redo.disabled = redoStack.length === 0;
        }
        function recordEdit() {
            undoStack.push(cloneState(projectState));
            if (undoStack.length > 50) undoStack.shift();
            redoStack.length = 0;
            updateHistoryButtons();
        }
        function restoreState(snapshot) {
            projectState = cloneState(snapshot);
            window.projectState = projectState;
            selectedClip = null;
            requestTimelineRender();
        }
        function undoEdit() {
            if (!undoStack.length) return;
            redoStack.push(cloneState(projectState));
            restoreState(undoStack.pop());
            updateHistoryButtons();
        }
        function redoEdit() {
            if (!redoStack.length) return;
            undoStack.push(cloneState(projectState));
            restoreState(redoStack.pop());
            updateHistoryButtons();
        }
        function toggleSnap() {
            snapEnabled = !snapEnabled;
            const button = document.getElementById('snapToggle');
            if (button) button.textContent = snapEnabled ? 'Snap: On' : 'Snap: Off';
        }
        function setTimelineZoom(value) {
            timelineZoom = clamp(Number(value) || 1, 0.5, 3);
            const container = document.getElementById('tracksContainer');
            if (container) container.style.minWidth = `${timelineZoom * 100}%`;
            requestTimelineRender();
        }
        function snapTime(value) {
            return snapEnabled ? Math.round(value / SNAP_INTERVAL) * SNAP_INTERVAL : value;
        }
        function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }
        function getClipSourceDuration(clip) {
            const declared = Number(clip.duration);
            if (Number.isFinite(declared) && declared > 0) return declared;
            const mediaDuration = document.getElementById('previewVideo')?.duration;
            if (Number.isFinite(mediaDuration) && mediaDuration > 0) return mediaDuration;
            return Math.max(Number(clip.trimEnd) || 0, 1);
        }
        function requestTimelineRender() {
            if (timelineRenderQueued) return;
            timelineRenderQueued = true;
            requestAnimationFrame(() => {
                timelineRenderQueued = false;
                renderTimeline();
            });
        }

        function renderTimeline() {
            const container = document.getElementById('tracksContainer');
            if (!container) return;
            const fragment = document.createDocumentFragment();
            const maxDuration = MAX_TIMELINE_SECONDS;
            projectState.tracks.forEach(track => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.onmousedown = (e) => seekFromTimeline(e);
                const label = document.createElement('span');
                label.className = 'track-label';
                label.innerText = track.name;
                const lane = document.createElement('div');
                lane.className = 'track-lane';
                lane.id = `${track.id}Track`;
                track.clips.forEach(c => {
                    const clipEl = document.createElement('div');
                    clipEl.className = `track-clip clip-${c.type}${selectedClip === c ? ' selected' : ''}`;
                    clipEl.id = `clip-${c.id}`;
                    clipEl.draggable = false;
                    clipEl.onpointerdown = (e) => {
                        if (!e.target.closest('.trim-handle')) beginMove(e, c, track, lane);
                    };
                    const sourceDuration = getClipSourceDuration(c);
                    const trimStart = clamp(Number(c.trimStart) || 0, 0, Math.max(0, sourceDuration - MIN_TRIM_SECONDS));
                    const trimEnd = clamp(Number(c.trimEnd) || sourceDuration, trimStart + MIN_TRIM_SECONDS, sourceDuration);
                    c.trimStart = trimStart;
                    c.trimEnd = trimEnd;
                    const duration = trimEnd - trimStart;
                    clipEl.style.left = (c.start / maxDuration * 100) + '%';
                    clipEl.style.width = (duration / maxDuration * 100) + '%';
                    clipEl.style.background = c.color;
                    clipEl.style.border = `1px solid ${c.borderColor}`;
                    clipEl.onclick = (e) => { e.stopPropagation(); selectClip(c); };
                    if (c.transition && c.transition.type !== 'none') {
                        const badge = document.createElement('span');
                        badge.className = 'transition-badge';
                        badge.textContent = c.transition.type;
                        clipEl.appendChild(badge);
                    }
                    if (track.type === 'audio' || c.type === 'music' || c.type === 'audio') {
                        const waveform = document.createElement('canvas');
                        waveform.className = 'timeline-waveform';
                        waveform.setAttribute('aria-label', 'Audio waveform');
                        clipEl.appendChild(waveform);
                        drawTimelineWaveform(c, waveform);
                        clipEl.title = `Audio • ${Math.round((Number(c.volume) || 1) * 100)}% volume`;
                    }
                    const leftHandle = document.createElement('div');
                    leftHandle.className = 'trim-handle trim-handle-left';
                    leftHandle.title = 'Drag to trim start';
                    leftHandle.onpointerdown = (e) => beginTrim(e, c, 'start', lane);
                    const rightHandle = document.createElement('div');
                    rightHandle.className = 'trim-handle trim-handle-right';
                    rightHandle.title = 'Drag to trim end';

                    clipEl.append(leftHandle, rightHandle);

                });
                trackEl.appendChild(label);

                fragment.appendChild(trackEl);
            });
            container.replaceChildren(fragment);
        }

        async function drawTimelineWaveform(clip, canvas) {
            const draw = (values) => {
                const width = Math.max(20, canvas.clientWidth || 240);
                const height = Math.max(20, canvas.clientHeight || 44);
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(236,72,153,.85)';
                const step = Math.max(1, Math.floor(values.length / width));
                for (let x = 0; x < width; x++) {
                    const amp = Math.min(1, Math.abs(values[Math.min(values.length - 1, x * step)] || 0));
                    const bar = Math.max(1, amp * (height - 4) * (Number(clip.volume) || 1));
                    ctx.fillRect(x, (height - bar) / 2, 1, bar);
                }
            };
            requestAnimationFrame(async () => {
                try {
                    const projectId = window.currentProject?.id;
                    if (!projectId || !clip.assetId || !window.AssetManager || !window.MusicEngine) return draw(new Float32Array(1));
                    const url = await AssetManager.getUrl(projectId, clip.assetId);
                    const buffer = await MusicEngine.decode_audio(url);
                    draw(MusicEngine.generate_waveform(buffer, Math.max(20, canvas.clientWidth || 240)));
                } catch (_) {
                    draw(new Float32Array(1));
                }
            });
        }

        function beginMove(event, clip, track, lane) {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            selectClip(clip);
            const startX = event.clientX;
            const initialStart = Number(clip.start) || 0;
            const initialState = cloneState(projectState);
            const laneWidth = Math.max(lane.clientWidth, 1);
            const clipDuration = Math.max(MIN_TRIM_SECONDS, (Number(clip.trimEnd) || 0) - (Number(clip.trimStart) || 0));
            const clipEl = document.getElementById(`clip-${clip.id}`);
            clipEl?.classList.add('clip-dragging');

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - startX) / laneWidth) * MAX_TIMELINE_SECONDS;
                const maxStart = Math.max(0, MAX_TIMELINE_SECONDS - clipDuration);
                clip.start = clamp(snapTime(initialStart + delta), 0, maxStart);
                if (clipEl) clipEl.style.left = `${(clip.start / MAX_TIMELINE_SECONDS) * 100}%`;
            };
            const onEnd = () => {
                clipEl?.classList.remove('clip-dragging');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.start !== initialStart) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                }
            };
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            const modifier = event.ctrlKey || event.metaKey;
            if (modifier && event.key.toLowerCase() === 'z') {
                event.preventDefault();
                event.shiftKey ? redoEdit() : undoEdit();
            } else if (modifier && event.key.toLowerCase() === 'y') {

        function beginTrim(event, clip, edge, lane) {
            event.preventDefault();
            event.stopPropagation();
            const laneRect = lane.getBoundingClientRect();
            const sourceDuration = getClipSourceDuration(clip);
            const initialStart = Number(clip.trimStart) || 0;
            const initialEnd = Number(clip.trimEnd) || sourceDuration;
            const initialState = cloneState(projectState);
            const clipEl = event.currentTarget.parentElement;
            clipEl.classList.add('clip-trimming');
            event.currentTarget.setPointerCapture?.(event.pointerId);

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - event.clientX) / Math.max(laneRect.width, 1)) * MAX_TIMELINE_SECONDS;
                if (edge === 'start') {
                    clip.trimStart = clamp(initialStart + delta, 0, initialEnd - MIN_TRIM_SECONDS);
                } else {
                    clip.trimEnd = clamp(initialEnd + delta, initialStart + MIN_TRIM_SECONDS, sourceDuration);
                }
                selectedClip = clip;
                clipEl.style.width = `${((clip.trimEnd - clip.trimStart) / MAX_TIMELINE_SECONDS) * 100}%`;
            };

            const onEnd = () => {
                clipEl.classList.remove('clip-trimming');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.trimStart !== initialStart || clip.trimEnd !== initialEnd) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                }
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        function addKeyframe() {
            if (!selectedClip) return showToast('Select a clip first.', '⚠️');

            selectedClip.keyframes ||= [];
            const time = currentClipTime();
            selectedClip.keyframes = selectedClip.keyframes.filter(item => Math.abs(item.time - time) > 0.01);
            selectedClip.keyframes.push({
                time,

            });

        function addSpeedPoint() {
            if (!selectedClip) return showToast('Select a clip first.', '⚠️');
            recordEdit();
            selectedClip.speedSegments ||= [];
            const time = currentClipTime();
            const speed = clamp(Number(document.getElementById('speedValue')?.value) || 1, 0.1, 8);
            selectedClip.speedSegments = selectedClip.speedSegments.filter(item => Math.abs(item.time - time) > 0.01);
            selectedClip.speedSegments.push({ time, speed });
            selectedClip.speedSegments.sort((a, b) => a.time - b.time);
            updatePreviewVisuals();
            showToast(`${speed}× speed point added.`, '⏩', 'success');
        }

        function interpolateKeyframes(clip, time) {
            const frames = (clip.keyframes || []).slice().sort((a, b) => a.time - b.time);
            if (!frames.length) return { scale: 100, rotation: 0, opacity: 100 };
            if (time <= frames[0].time) return frames[0];
            if (time >= frames[frames.length - 1].time) return frames[frames.length - 1];
            const nextIndex = frames.findIndex(frame => frame.time >= time);
            const a = frames[nextIndex - 1];
            const b = frames[nextIndex];
            const ratio = (time - a.time) / Math.max(b.time - a.time, 0.001);
            return ['scale', 'rotation', 'opacity'].reduce((result, key) => {
                result[key] = a[key] + (b[key] - a[key]) * ratio;
                return result;
            }, {});
        }

        function speedAtTime(clip, time) {
            const points = (clip.speedSegments || []).filter(item => Number.isFinite(item.time)).sort((a, b) => a.time - b.time);
            let speed = 1;
            for (const point of points) {
                if (point.time > time) break;
                speed = clamp(Number(point.speed) || 1, 0.1, 8);
            }
            return speed;
        }

        function updatePreviewVisuals() {
            const screen = document.getElementById('previewScreen');
            const video = document.getElementById('previewVideo');
            if (!screen) return;
            screen.className = screen.className.replace(/\bfilter-\S+/g, '').trim();
            if (selectedClip?.filter) screen.classList.add(`filter-${selectedClip.filter}`);
            if (video && selectedClip) {
                const time = currentClipTime();
                const props = interpolateKeyframes(selectedClip, time);
                video.style.transform = `scale(${props.scale / 100}) rotate(${props.rotation}deg)`;
                video.style.opacity = String(props.opacity / 100);
                video.playbackRate = speedAtTime(selectedClip, time);
                video.style.filter = `${getBasePreviewFilter(selectedClip.filter)} ${getGradePreviewFilter(selectedClip.colorGrade)}`.trim();
            }
            renderPipOverlays();
            renderTextOverlays();
        }

        function getBasePreviewFilter(filter) {
            return ({ vivid: 'saturate(1.35) contrast(1.08)', cinematic: 'contrast(1.15) saturate(.82) sepia(.08)', bw: 'grayscale(1) contrast(1.12)', warm: 'saturate(1.2) sepia(.22)', cool: 'saturate(.92) hue-rotate(12deg) brightness(1.04)' })[filter] || '';
        }

        function getGradePreviewFilter(grade = {}) {
            const preset = grade.preset || 'none';
            const presets = {
                'teal-orange': 'contrast(1.12) saturate(1.28) sepia(.08) hue-rotate(-8deg)',
                film: 'contrast(1.08) saturate(.9) sepia(.16)',
                bleach: 'contrast(1.35) saturate(.45)',
                noir: 'grayscale(1) contrast(1.3)',
                sunset: 'saturate(1.4) sepia(.28) hue-rotate(-12deg)'
            };
            const exposure = Math.pow(2, Number(grade.exposure) || 0);
            const contrast = Number(grade.contrast) || 1;
            const saturation = Number(grade.saturation) || 1;
            return `${presets[preset] || ''} brightness(${exposure}) contrast(${contrast}) saturate(${saturation})`.trim();
        }

        function applyColorGrade() {
            if (!selectedClip) return showToast('Select a clip first.', '⚠️');
            recordEdit();
            selectedClip.colorGrade = {
                preset: document.getElementById('gradePreset')?.value || 'none',
                exposure: Number(document.getElementById('gradeExposure')?.value) || 0,
                contrast: Number(document.getElementById('gradeContrast')?.value) || 1,
                saturation: Number(document.getElementById('gradeSaturation')?.value) || 1
            };
            updatePreviewVisuals();
        }

        function applyPipSettings() {
            if (!selectedClip) return showToast('Select a video clip first.', '⚠️');
            recordEdit();
            selectedClip.pip ||= {};
            selectedClip.pip.position = document.getElementById('pipPosition')?.value || 'bottom-right';
            selectedClip.pip.size = clamp(Number(document.getElementById('pipSize')?.value) || 32, 15, 60);
            selectedClip.pip.opacity = clamp(Number(document.getElementById('pipOpacity')?.value) || 100, 20, 100);
            renderPipOverlays();
        }

        function moveSelectedToPipTrack() {
            if (!selectedClip || selectedClip.type !== 'video') return showToast('Select a video clip first.', '⚠️');
            const sourceTrack = projectState.tracks.find(track => track.clips?.includes(selectedClip));
            if (!sourceTrack) return;
            let pipTrack = projectState.tracks.find(track => track.type === 'video' && track !== sourceTrack);
            if (!pipTrack) {
                pipTrack = { id: `track-video-${Date.now()}`, type: 'video', name: 'Video Overlay', clips: [] };
                projectState.tracks.push(pipTrack);
            }
            recordEdit();
            sourceTrack.clips = sourceTrack.clips.filter(clip => clip !== selectedClip);
            selectedClip.pip ||= { position: 'bottom-right', size: 32, opacity: 100 };
            pipTrack.clips.push(selectedClip);
            requestTimelineRender();
            renderPipOverlays();
            showToast('Clip moved to PiP overlay track.', '▣', 'success');
        }

        const pipVideoCache = new Map();
        async function renderPipOverlays() {
            const screen = document.getElementById('previewScreen');
            const mainVideo = document.getElementById('previewVideo');
            if (!screen || !mainVideo) return;
            const now = mainVideo.currentTime || 0;
            const activeIds = new Set();
            for (const track of projectState.tracks.filter(item => item.type === 'video').slice(1)) {
                for (const clip of track.clips || []) {
                    const duration = Math.max(0.01, (Number(clip.trimEnd) || Number(clip.duration) || 1) - (Number(clip.trimStart) || 0));
                    if (now < (Number(clip.start) || 0) || now > (Number(clip.start) || 0) + duration) continue;
                    activeIds.add(clip.id);
                    let pip = pipVideoCache.get(clip.id);
                    if (!pip) {
                        if (!window.currentProject?.id || !clip.assetId) continue;
                        pip = document.createElement('video');
                        pip.className = 'pip-video';
                        pip.muted = true;
                        pip.playsInline = true;
                        pip.src = await AssetManager.getUrl(window.currentProject?.id, clip.assetId);
                        screen.appendChild(pip);
                        pipVideoCache.set(clip.id, pip);
                    }
                    const settings = clip.pip || { position: 'bottom-right', size: 32, opacity: 100 };
                    const margin = 3;
                    pip.style.width = `${settings.size}%`;
                    pip.style.height = `${settings.size * .5625}%`;
                    pip.style.opacity = `${settings.opacity / 100}`;
                    pip.style.top = settings.position.startsWith('top') ? `${margin}%` : 'auto';
                    pip.style.bottom = settings.position.startsWith('bottom') ? `${margin}%` : 'auto';
                    pip.style.left = settings.position.endsWith('left') ? `${margin}%` : 'auto';
                    pip.style.right = settings.position.endsWith('right') ? `${margin}%` : 'auto';
                    pip.currentTime = (Number(clip.trimStart) || 0) + now - (Number(clip.start) || 0);
                    if (!mainVideo.paused) pip.play().catch(() => {});
                }
            }
            for (const [id, pip] of pipVideoCache) if (!activeIds.has(id)) pip.style.display = 'none'; else pip.style.display = 'block';
        }

        function renderTextOverlays() {
            const layer = document.getElementById('textOverlayLayer');
            if (!layer) return;
            layer.replaceChildren();
            const now = document.getElementById('previewVideo')?.currentTime || 0;
            (projectState.textOverlays || []).filter(item => now >= item.start && now <= item.end).forEach(item => {
                const el = document.createElement('div');
                el.className = item.kind === 'caption' ? 'text-overlay caption-overlay' : 'text-overlay';
                el.textContent = item.text;
                el.style.left = `${item.x ?? 50}%`;
                el.style.top = item.kind === 'caption' ? '' : `${item.y ?? 50}%`;
                el.style.fontSize = `${item.size || 28}px`;
                el.style.color = item.color || '#fff';
                layer.appendChild(el);
            });
        }

        function addTextOverlay() {
            const text = document.getElementById('overlayText')?.value.trim();
            if (!text) return showToast('Enter text for the overlay.', '⚠️');
            recordEdit();
            projectState.textOverlays ||= [];
            const start = document.getElementById('previewVideo')?.currentTime || 0;
            projectState.textOverlays.push({ id: `text-${Date.now()}`, kind: 'text', text, start, end: start + 3, x: 50, y: 50, size: 28, color: '#fff' });
            renderTextOverlays();
            showToast('Text overlay added.', '✅');
        }

        async function generateSubtitles() {
            const transcript = document.getElementById('captionTranscript')?.value.trim();
            if (!transcript) return showToast('Paste a transcript first.', '⚠️');
            const button = document.querySelector('#manualPropsBody button');
            if (button) { button.disabled = true; button.textContent = 'Generating…'; }
            try {
                const response = await fetch('/api/gemini', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'subtitles', transcript }) });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Gemini request failed');
                recordEdit();
                projectState.textOverlays ||= [];
                projectState.textOverlays.push(...data.subtitles.map(item => ({ ...item, id: `caption-${Date.now()}-${item.start}`, kind: 'caption', x: 50, size: 22, color: '#fff' })));
                renderTextOverlays();
                showToast(`${data.subtitles.length} subtitle segments added.`, '✅', 'success');
            } catch (error) {
                showToast(error.message, '❌', 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = '✨ Generate with Gemini'; }
            }
        }

        async function analyzeAudio() {
            const vid = document.getElementById('previewVideo');
            if(!vid.src) return showToast('No video!', '⚠️');
            showToast('Analyzing...', '⏳');
            const bpm = await MusicEngine.analyzeBPM(await (await fetch(vid.src)).arrayBuffer());
            document.getElementById('bpmVal').textContent = Math.round(bpm);
            showToast('BPM: ' + Math.round(bpm), '🎯');
        }

        function syncCuts() {
            const bpm = parseInt(document.getElementById('bpmVal')?.textContent);
            if(!bpm) return showToast('Analyze BPM first', '⚠️');
            const interval = 60/bpm;
            projectState.tracks.forEach(t => t.clips.forEach(c => { c.start = Math.round(c.start/interval)*interval; }));
            requestTimelineRender();
            showToast('Synced!', '🎯');
        }

        function splitAtPlayhead() {
            const vid = document.getElementById('previewVideo');
            if(!vid || !selectedClip) return;
            const time = vid.currentTime;
            const splitPoint = time - selectedClip.start + selectedClip.trimStart;
            if (splitPoint <= selectedClip.trimStart + MIN_TRIM_SECONDS || splitPoint >= selectedClip.trimEnd - MIN_TRIM_SECONDS) {
                return showToast('Move the playhead inside the clip before splitting.', '⚠️');
            }
            recordEdit();
            const newClip = JSON.parse(JSON.stringify(selectedClip));
            newClip.id = 's' + Date.now();
            newClip.trimStart = splitPoint;
            newClip.start = selectedClip.start + (selectedClip.trimEnd - selectedClip.trimStart);
            selectedClip.trimEnd = splitPoint;
            projectState.tracks.forEach(t => { if(t.clips.includes(selectedClip)) t.clips.push(newClip); });
            requestTimelineRender();
        }

        function scaleVideo(v) { document.getElementById('previewVideo').style.transform = `scale(${v/100})`; }
        function setAR(el, ar) { document.getElementById('previewScreen').style.aspectRatio = ar; }

        async function handleMusicUpload(e) {
            const f = e.target.files[0]; if(!f) return;
            const assetId = 'm' + Date.now();
            await ProjectService.saveAsset(currentProject.id, assetId, f);
            const url = await AssetManager.getUrl(currentProject.id, assetId);
            const buffer = await MusicEngine.getCtx().decodeAudioData(await (await fetch(url)).arrayBuffer());
            let track = projectState.tracks.find(t => t.type === 'audio');
            track.clips.push({ id: 'm' + Date.now(), assetId, name: f.name, type: 'music', start: 0, duration: buffer.duration, trimStart: 0, trimEnd: buffer.duration, volume: 1, fadeIn: 0, fadeOut: 0, color: 'rgba(236,72,153,0.3)', borderColor: 'rgba(236,72,153,0.5)' });
            requestTimelineRender();
        }

        function formatTime(s) { return Math.floor(s/60) + ':' + Math.floor(s%60).toString().padStart(2,'0'); }
        function togglePlay() { const vid = document.getElementById('previewVideo'); if(vid.paused) vid.play(); else vid.pause(); }
        function saveProject() { ProjectService.updateProject(currentProject.id, { projectState }); showToast('Saved!', '✅'); }
        
        function exportProject() {
            document.getElementById('exportModal').classList.add('active');
            document.getElementById('exportOptions').style.display = 'grid';
            document.getElementById('startExportBtn').style.display = 'flex';
            document.getElementById('cancelExportBtn').textContent = 'Close';
            document.getElementById('exportStatus').textContent = 'Choose settings, then render directly in your browser with FFmpeg.wasm.';
        }

        function cancelExport() {
            document.getElementById('exportModal').classList.remove('active');
        }

        async function startExportWithOptions() {
            const startButton = document.getElementById('startExportBtn');
            if (startButton) startButton.style.display = 'none';
            document.getElementById('exportOptions').style.display = 'none';
            document.getElementById('cancelExportBtn').textContent = 'Cancel Export';
            document.getElementById('exportStatus').textContent = 'Preparing assets...';
            await window.handleEditorExport({
                format: 'mp4',
                resolution: document.getElementById('exportResolution').value,
                quality: document.getElementById('exportQuality').value,
                audioBitrate: document.getElementById('exportAudioBitrate').value,
                fps: document.getElementById('exportFps').value
            });
            document.getElementById('exportStatus').textContent = 'Render complete.';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                // M3 FIX: guard against deleted/malformed project IDs
                currentProject = ProjectService.getProject(id);
                if (!currentProject) {
                    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;background:#0a0a0f;flex-direction:column;gap:16px"><h2>Project not found</h2><p>This project may have been deleted or the link is invalid.</p><a href="dashboard.html" style="color:#8b5cf6">Back to Dashboard</a></div>';
                    return;
                }
                if (currentProject.projectState && Array.isArray(currentProject.projectState.tracks)) {
                    projectState = currentProject.projectState;
                }
                projectState.textOverlays ||= [];
                window.currentProject = currentProject;
                window.projectState = projectState;
                const v = projectState.tracks.find(t=>t.type==='video')?.clips[0];
                if(v) {
                    const vid = document.getElementById('previewVideo');
                    vid.src = await AssetManager.getUrl(id, v.assetId);
                    vid.addEventListener('loadedmetadata', () => {
                        const duration = vid.duration;
                        if (Number.isFinite(duration) && duration > 0) {
                            v.duration = duration;
                            if (!Number.isFinite(v.trimEnd) || v.trimEnd <= 1) v.trimEnd = duration;
                            requestTimelineRender();
                        }
                    }, { once: true });
                    vid.style.display = 'block';
                    document.getElementById('previewIdle').style.display = 'none';
                    document.getElementById('previewControls').style.display = 'flex';
                }
            }
            setTimelineZoom(timelineZoom);
            updateHistoryButtons();
            renderTimeline();
            setTool('select');
        });

        let timeUpdateQueued = false;
        document.getElementById('previewVideo').ontimeupdate = () => {
            if (timeUpdateQueued) return;
            timeUpdateQueued = true;
            requestAnimationFrame(() => {
                timeUpdateQueued = false;
                const vid = document.getElementById('previewVideo');
                const progress = vid.duration > 0 ? vid.currentTime / vid.duration : 0;
                document.getElementById('scrubber').value = progress * 100;
                document.getElementById('timeDisplay').textContent = formatTime(vid.currentTime) + ' / ' + formatTime(vid.duration);
                const playhead = document.getElementById('timelinePlayhead');
                const lane = document.querySelector('.track-lane');
                if (playhead && lane) playhead.style.left = (72 + progress * (lane.clientWidth - 72)) + 'px';
                updatePreviewVisuals();
                renderTextOverlays();
            });
        };
</script>
