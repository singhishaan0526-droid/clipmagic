<!DOCTYPE html>
<html>
<head>
  <title>Rowspan and Colspan Demo</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
    }

    table {
      margin: 20px auto;
      border-collapse: collapse;
      width: 60%;
    }

    th, td {
      border: 2px solid black;
      padding: 15px;
    }

    th {
      background-color: lightgray;
    }
  </style>
</head>
<body>

<h2>Rowspan and Colspan Example</h2>

<table>
  <!-- Colspan Example -->
  <tr>
    <th colspan="3">Student Details</th>
  </tr>

  <tr>
    <th>Name</th>
    <th>Course</th>
    <th>Year</th>
  </tr>

  <!-- Rowspan Example -->
  <tr>
    <td rowspan="2">Ishaan</td>
    <td>BCA</td>
    <td>1st</td>
  </tr>

  <tr>
    <td>BCA</td>
    <td>2nd</td>
  </tr>

  <tr>
    <td>Rahul</td>
    <td>BCA</td>
    <td>1st</td>
  </tr>
</table>

</body>
</html>
