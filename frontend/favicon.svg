<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Rounded Base Frame -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#cmGrad)" />
  <!-- Inner Glass Highlight -->
  <rect x="5" y="5" width="54" height="27" rx="15" fill="white" fill-opacity="0.12" />
  <!-- Central Icon: Sleek Lightning Bolt merged with Play/Magic Symbol -->
  <path d="M34 14 L20 33 L30 33 L26 50 L44 29 L32 29 Z" fill="url(#boltGrad)" filter="url(#glow)" />
  <!-- Subtle Sparkle Dots -->
  <circle cx="46" cy="18" r="2.5" fill="#ffffff" opacity="0.9" />
  <circle cx="18" cy="46" r="1.5" fill="#38bdf8" opacity="0.8" />
</svg>
