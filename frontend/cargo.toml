[package]
name = "clip-magic-music"
version = "0.1.0"
edition = "2021"
description = "Clip Magic — Rust/WASM music processing engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dependencies.web-sys]
version = "0.3"
features = [
  "AudioContext",
  "AudioBuffer",
  "AnalyserNode",
]

[profile.release]
opt-level = "s"   # optimize for size
lto = true
