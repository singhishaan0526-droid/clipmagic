<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClipMagic Filters Demo</title>
<style>
  :root{--bg:#0b0b0e;--panel:#17181d;--fg:#f2f2f4;--mut:#8b8d96;--acc:#7c5cff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:16px;gap:14px}
  #stage{width:min(100%,420px);background:#000;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
  canvas#out{width:100%;max-height:60vh;object-fit:contain;display:block}
  #bar{width:min(100%,420px);display:flex;gap:10px;align-items:center}
  #bar input[type=range]{flex:1;accent-color:var(--acc)}
  button,label.btn{background:var(--panel);color:var(--fg);border:1px solid #2b2d35;border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit}
  button.primary{background:var(--acc);border-color:var(--acc)}
  #chips{width:min(100%,420px);display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x proximity}
  .chip{flex:0 0 72px;scroll-snap-align:start;text-align:center;cursor:pointer;color:var(--mut);font-size:11px}
  .chip canvas{width:64px;height:64px;object-fit:cover;border-radius:50%;border:2px solid transparent;display:block;margin:0 auto 5px}
  .chip.on{color:var(--fg)} .chip.on canvas{border-color:#fff}
  #name{font-weight:600}
</style>
</head>
<body>
  <div id="stage"><canvas id="out"></canvas></div>
  <div id="name">No effect</div>
  <div id="bar">
    <span style="color:var(--mut)">Strength</span>
    <input id="int" type="range" min="0" max="100" value="100">
  </div>
  <div id="chips"></div>
  <div id="bar">
    <label class="btn">Choose video / photo<input id="file" type="file" accept="video/*,image/*" hidden></label>
    <button id="play">Pause</button>
    <button id="export" class="primary">Export</button>
  </div>
  <video id="vid" playsinline muted loop style="display:none"></video>
  <img id="img" src="sample.png" style="display:none">

<script src="filters-pack.js"></script>
<script>
const { FILTERS, Renderer, exportVideo } = ClipFilters;
const out = document.getElementById('out'), vid = document.getElementById('vid'), img = document.getElementById('img');
const r = new Renderer(out);
let source = img, isVideo = false;

const chipsEl = document.getElementById('chips'), nameEl = document.getElementById('name');
const thumbs = FILTERS.map(f => {
  const el = document.createElement('div'); el.className = 'chip';
  const c = document.createElement('canvas'); c.width = c.height = 128;
  el.append(c, Object.assign(document.createElement('div'), { textContent: f.name }));
  el.onclick = () => select(f.id);
  chipsEl.append(el);
  return { f, el, c, r: new Renderer(c) };
});

function select(id) {
  r.setFilter(id);
  thumbs.forEach(t => t.el.classList.toggle('on', t.f.id === id));
  nameEl.textContent = ClipFilters.byId[id].name;
  if (!isVideo) r.render(source);
}
function refreshThumbs() {
  const w = source.videoWidth || source.naturalWidth, h = source.videoHeight || source.naturalHeight;
  if (!w) return;
  const s = Math.min(w, h), tmp = document.createElement('canvas'); tmp.width = tmp.height = 128;
  tmp.getContext('2d').drawImage(source, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 128, 128);
  thumbs.forEach(t => { t.r.setFilter(t.f.id); t.r.render(tmp); });
}

document.getElementById('int').oninput = e => { r.setIntensity(e.target.value / 100); if (!isVideo) r.render(source); };
document.getElementById('file').onchange = e => {
  const file = e.target.files[0]; if (!file) return;
  const url = URL.createObjectURL(file);
  r.stop();
  if (file.type.startsWith('video')) {
    isVideo = true; source = vid; vid.src = url;
    vid.onloadeddata = () => { vid.play(); refreshThumbs(); r.start(vid); };
  } else {
    isVideo = false; source = img; img.onload = () => { refreshThumbs(); r.render(img); }; img.src = url;
  }
};
document.getElementById('play').onclick = e => {
  if (!isVideo) return;
  if (vid.paused) { vid.play(); e.target.textContent = 'Pause'; } else { vid.pause(); e.target.textContent = 'Play'; }
};
document.getElementById('export').onclick = async e => {
  const b = e.target; b.disabled = true;
  if (!isVideo) {
    out.toBlob(bl => { dl(bl, 'filtered.png'); b.disabled = false; });
    return;
  }
  b.textContent = 'Exporting…'; r.stop(); vid.loop = false;
  const blob = await exportVideo(vid, r.filter.id, { intensity: r.intensity });
  vid.loop = true; dl(blob, 'filtered.webm'); r.start(vid); vid.play();
  b.textContent = 'Export'; b.disabled = false;
};
function dl(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }

(img.complete ? Promise.resolve() : new Promise(r => img.onload = r)).then(() => { refreshThumbs(); select('none'); r.render(img); });
</script>
</body>
</html>
