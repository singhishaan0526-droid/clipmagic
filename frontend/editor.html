        function seekFromTimeline(event) {
            if (event.target.closest('.track-clip') || event.target.closest('.trim-handle')) return;
            const lane = event.currentTarget.querySelector('.track-lane');
            const video = document.getElementById('previewVideo');
            if (!lane || !video) return;
            const rect = lane.getBoundingClientRect();
            const fraction = clamp((event.clientX - rect.left) / Math.max(rect.width, 1), 0, 1);
            const timelineTime = fraction * MAX_TIMELINE_SECONDS;
            
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (videoTrack && videoTrack.clips.length) {
                let targetClip = videoTrack.clips.find(c => {
                    const dur = (c.trimEnd || c.duration || 1) - (c.trimStart || 0);
                    return timelineTime >= (c.start || 0) && timelineTime <= (c.start || 0) + dur;
                });
                if (targetClip) {
                    const rel = Math.max(0, timelineTime - (targetClip.start || 0));
                    video.currentTime = (targetClip.trimStart || 0) + rel;
                    syncAudioPlayback(timelineTime, !video.paused);
                    return;
                }
            }
            if (Number.isFinite(video.duration) && video.duration > 0) {
                video.currentTime = fraction * video.duration;
            }
            syncAudioPlayback(timelineTime, !video.paused);
        }

        function addTrack(type) {
            recordEdit();
            const count = projectState.tracks.filter(track => track.type === type).length + 1;
            projectState.tracks.push({
                id: `track-${type}-${Date.now()}`,
                type,
                name: `${type === 'video' ? 'Video' : 'Audio'} ${count}`,
                clips: []
            });
            requestTimelineRender();
            if (type === 'audio') {
                const audioInput = document.getElementById('globalAudioInput');
                if (audioInput) audioInput.click();
            }
        }

        function beginMove(event, clip, track, lane) {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            selectClip(clip);
            const startX = event.clientX;
            const initialStart = Number(clip.start) || 0;
            const initialState = cloneState(projectState);
            const laneWidth = Math.max(lane.clientWidth, 1);
            const clipDuration = Math.max(MIN_TRIM_SECONDS, (Number(clip.trimEnd) || 0) - (Number(clip.trimStart) || 0));
            const clipEl = document.getElementById(`clip-${clip.id}`);
            clipEl?.classList.add('clip-dragging');

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - startX) / laneWidth) * MAX_TIMELINE_SECONDS;
                const maxStart = Math.max(0, MAX_TIMELINE_SECONDS - clipDuration);
                clip.start = clamp(snapTime(initialStart + delta), 0, maxStart);
                if (clipEl) clipEl.style.left = `${(clip.start / MAX_TIMELINE_SECONDS) * 100}%`;
            };
            const onEnd = () => {
                clipEl?.classList.remove('clip-dragging');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.start !== initialStart) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                }
            };
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        function deleteSelectedClip(ripple = false) {
            if (!selectedClip) return;
            const clipId = selectedClip.id;
            const track = projectState.tracks.find(item => item.clips?.some(clip => clip.id === clipId));
            if (!track) return;
            recordEdit();
            const deletedClip = selectedClip;
            const deletedDuration = Math.max(MIN_TRIM_SECONDS, (Number(deletedClip.trimEnd) || Number(deletedClip.duration) || 1) - (Number(deletedClip.trimStart) || 0));
            const deletedStart = Number(deletedClip.start) || 0;

            track.clips = track.clips.filter(clip => clip.id !== clipId);

            if (ripple) {
                // Shift all subsequent clips to the left to close gap
                track.clips.forEach(c => {
                    if (Number(c.start) > deletedStart) {
                        c.start = Math.max(0, Number(c.start) - deletedDuration);
                    }
                });
            }

            selectedClip = null;
            requestTimelineRender();
            showToast(ripple ? '🌊 Ripple deleted clip (gap closed)' : '🗑️ Clip deleted', '🗑️', 'info');
        }

        // --- Precise Frame Stepping (1 frame / 10 frames) ---
        function stepFrame(count = 1) {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            if (!vid.paused) vid.pause();
            const { clip } = getClipUnderPlayhead();
            const fps = Number(clip?.sourceFps) || 30;
            const dt = count / fps;
            const totalDur = getTimelineTotalDuration();
            const newTime = clamp((vid.currentTime || 0) + dt, 0, totalDur > 0 ? totalDur : (vid.duration || 9999));
            vid.currentTime = newTime;
            showToast(`Frame step: ${newTime.toFixed(3)}s`, '🎞️', 'info');
        }

        // --- J / K / L Shuttle Transport Controls ---
        let shuttleInterval = null;
        function handleShuttle(key) {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            if (key === 'k') {
                shuttleSpeed = 0;
                if (shuttleInterval) { clearInterval(shuttleInterval); shuttleInterval = null; }
                vid.pause();
                showToast('⏸ Paused', '⏸', 'info');
            } else if (key === 'l') {
                if (shuttleInterval) { clearInterval(shuttleInterval); shuttleInterval = null; }
                if (shuttleSpeed <= 0) shuttleSpeed = 1;
                else if (shuttleSpeed === 1) shuttleSpeed = 2;
                else if (shuttleSpeed === 2) shuttleSpeed = 4;
                else shuttleSpeed = 8;
                vid.playbackRate = shuttleSpeed;
                vid.play();
                showToast(`⏩ Fast Forward ${shuttleSpeed}×`, '⏩', 'info');
            } else if (key === 'j') {
                vid.pause();
                if (shuttleSpeed >= 0) shuttleSpeed = -1;
                else if (shuttleSpeed === -1) shuttleSpeed = -2;
                else if (shuttleSpeed === -2) shuttleSpeed = -4;
                else shuttleSpeed = -8;
                if (shuttleInterval) clearInterval(shuttleInterval);
                const step = 0.04 * Math.abs(shuttleSpeed);
                shuttleInterval = setInterval(() => {
                    if (vid.currentTime <= 0.05) {
                        vid.currentTime = 0;
                        clearInterval(shuttleInterval);
                        shuttleInterval = null;
                        shuttleSpeed = 0;
                    } else {
                        vid.currentTime = Math.max(0, vid.currentTime - step);
                    }
                }, 40);
                showToast(`⏪ Rewind ${Math.abs(shuttleSpeed)}×`, '⏪', 'info');
            }
        }

        // --- Complete Keyboard Shortcuts ---
        document.addEventListener('keydown', (event) => {
            const tag = document.activeElement?.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            const modifier = event.ctrlKey || event.metaKey;

            if (modifier && event.key.toLowerCase() === 'z') {
                event.preventDefault();
                event.shiftKey ? redoEdit() : undoEdit();
            } else if (modifier && event.key.toLowerCase() === 'y') {
                event.preventDefault();
                redoEdit();
            } else if (event.key === 'Delete' || event.key === 'Backspace') {
                event.preventDefault();
                if (inPoint !== null && outPoint !== null) {
                    deleteInOutRange(event.shiftKey);
                } else {
                    deleteSelectedClip(event.shiftKey);
                }
            } else if (event.key.toLowerCase() === 's' || event.key.toLowerCase() === 'c') {
                event.preventDefault();
                splitAtPlayhead();
            } else if (event.key.toLowerCase() === 'i') {
                event.preventDefault();
                setInPoint();
            } else if (event.key.toLowerCase() === 'o') {
                event.preventDefault();
                setOutPoint();
            } else if (event.altKey && event.key.toLowerCase() === 'x') {
                event.preventDefault();
                clearInOutPoints();
            } else if (event.key.toLowerCase() === 'n') {
                event.preventDefault();
                toggleSnap();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                stepFrame(event.shiftKey ? -10 : -1);
            } else if (event.key === 'ArrowRight') {
                event.preventDefault();
                stepFrame(event.shiftKey ? 10 : 1);
            } else if (event.altKey && (event.key === '.' || event.key === '>')) {
                event.preventDefault();
                jumpAdjacentKeyframe(1);
            } else if (event.altKey && (event.key === ',' || event.key === '<')) {
                event.preventDefault();
                jumpAdjacentKeyframe(-1);
            } else if (event.altKey && event.key.toLowerCase() === 'k') {
                event.preventDefault();
                toggleKeyframeAtPlayhead();
            } else if (event.key.toLowerCase() === 'k') {
                event.preventDefault();
                toggleKeyframeAtPlayhead();
            } else if (event.key.toLowerCase() === 'j') {
                event.preventDefault();
                handleShuttle('j');
            } else if (event.key.toLowerCase() === 'l') {
                event.preventDefault();
                handleShuttle('l');
            } else if (event.key.toLowerCase() === 'q') {
                event.preventDefault();
                trimClipStartToPlayhead();
            } else if (event.key.toLowerCase() === 'w') {
                event.preventDefault();
                trimClipEndToPlayhead();
            } else if (event.code === 'Space') {
                event.preventDefault();
                togglePlay();
            }
        });

        // --- Exact Live-Frame Drag Trimming with Floating Tooltips ---
        function beginTrim(event, clip, edge, lane) {
            event.preventDefault();
            event.stopPropagation();
            const laneRect = lane.getBoundingClientRect();
            const sourceDuration = getClipSourceDuration(clip);
            const initialTrimStart = Number(clip.trimStart) || 0;
            const initialTrimEnd = Number(clip.trimEnd) || sourceDuration;
            const initialStart = Number(clip.start) || 0;
            const initialState = cloneState(projectState);
            const clipEl = event.currentTarget.parentElement;
            const video = document.getElementById('previewVideo');
            const audioEl = document.getElementById('previewAudio');
            const isAudio = clip.type === 'music' || clip.type === 'audio';
            
            if (video && !video.paused) video.pause();
            if (audioEl && !audioEl.paused) audioEl.pause();
            clipEl.classList.add('clip-trimming');
            event.currentTarget.setPointerCapture?.(event.pointerId);

            // Floating Tooltip showing exact time
            let tooltip = clipEl.querySelector('.trim-tooltip');
            if (!tooltip) {
                tooltip = document.createElement('div');
                tooltip.className = 'trim-tooltip';
                clipEl.appendChild(tooltip);
            }

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - event.clientX) / Math.max(laneRect.width, 1)) * MAX_TIMELINE_SECONDS;
                if (edge === 'start') {
                    let newTrimStart = clamp(initialTrimStart + delta, 0, initialTrimEnd - MIN_TRIM_SECONDS);
                    newTrimStart = snapTime(newTrimStart, clip.id);
                    const trimDelta = newTrimStart - initialTrimStart;
                    clip.trimStart = newTrimStart;
                    clip.start = Math.max(0, initialStart + trimDelta);
                    clipEl.style.left = `${(clip.start / MAX_TIMELINE_SECONDS) * 100}%`;
                    if (isAudio && audioEl && Number.isFinite(audioEl.duration)) {
                        audioEl.currentTime = clip.trimStart;
                    } else if (video && video.src && Number.isFinite(video.duration)) {
                        video.currentTime = clip.trimStart;
                    }
                    tooltip.textContent = `In: ${clip.trimStart.toFixed(2)}s`;
                } else {
                    let newTrimEnd = clamp(initialTrimEnd + delta, (clip.trimStart || 0) + MIN_TRIM_SECONDS, sourceDuration);
                    newTrimEnd = snapTime(newTrimEnd, clip.id);
                    clip.trimEnd = newTrimEnd;
                    if (isAudio && audioEl && Number.isFinite(audioEl.duration)) {
                        audioEl.currentTime = clip.trimEnd;
                    } else if (video && video.src && Number.isFinite(video.duration)) {
                        video.currentTime = clip.trimEnd;
                    }
                    tooltip.textContent = `Out: ${clip.trimEnd.toFixed(2)}s`;
                }
                selectedClip = clip;
                const dur = clip.trimEnd - (clip.trimStart || 0);
                clipEl.style.width = `${(dur / MAX_TIMELINE_SECONDS) * 100}%`;
            };

            const onEnd = () => {
                clipEl.classList.remove('clip-trimming');
                if (tooltip && tooltip.parentElement) tooltip.parentElement.removeChild(tooltip);
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.trimStart !== initialTrimStart || clip.trimEnd !== initialTrimEnd) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                    updateTrimInspectors(clip);
                    if (selectedClip === clip) selectClip(clip);
                }
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        function getClipUnderPlayhead() {
            const time = getCurrentPlaybackTime();
            if (selectedClip) {
                const tr = projectState.tracks.find(t => t.clips.includes(selectedClip));
                if (tr) return { clip: selectedClip, track: tr };
            }
            for (const track of projectState.tracks) {
                for (const clip of track.clips) {
                    const cStart = Number(clip.start) || 0;
                    const cDur = (Number(clip.trimEnd) || Number(clip.duration) || 1) - (Number(clip.trimStart) || 0);
                    if (time >= cStart - 0.05 && time <= cStart + cDur + 0.05) {
                        return { clip, track };
                    }
                }
            }
            const defaultTrack = projectState.tracks.find(t => t.type === 'video' && t.clips.length) || projectState.tracks.find(t => t.clips.length) || projectState.tracks[0];
            const defaultClip = defaultTrack?.clips[0] || null;
            return { clip: defaultClip, track: defaultTrack };
        }

        function splitAtPlayhead() {
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('Please load media or select a clip to split.', '⚠️');

            const time = getCurrentPlaybackTime();
            const sourceDuration = getClipSourceDuration(clip);
            const trimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
            const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : sourceDuration;
            
            let splitPoint = time;
            if (splitPoint <= trimStart + MIN_TRIM_SECONDS || splitPoint >= trimEnd - MIN_TRIM_SECONDS) {
                const relativeSplit = (time - (clip.start || 0)) + trimStart;
                if (relativeSplit > trimStart + MIN_TRIM_SECONDS && relativeSplit < trimEnd - MIN_TRIM_SECONDS) {
                    splitPoint = relativeSplit;
                } else {
                    return showToast('Move playhead inside the clip to split.', '⚠️');
                }
            }

            recordEdit();
            const originalTrimEnd = trimEnd;
            const newClip = JSON.parse(JSON.stringify(clip));
            newClip.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            
            clip.trimEnd = splitPoint;
            
            newClip.trimStart = splitPoint;
            newClip.trimEnd = originalTrimEnd;
            newClip.start = (clip.start || 0) + (splitPoint - trimStart);

            // Preserve animation keyframe tracks & continuity across split halves
            if (clip.animation && typeof valueAt === 'function') {
                const splitOffset = splitPoint - trimStart;
                const origAnim = JSON.parse(JSON.stringify(clip.animation));
                const firstAnim = {};
                const secondAnim = {};
                const props = ['scale', 'positionX', 'positionY', 'rotation', 'opacity', 'volume'];
                
                props.forEach(prop => {
                    const trackKfs = Array.isArray(origAnim[prop]) ? origAnim[prop] : [];
                    if (trackKfs.length > 0) {
                        const fallbackVal = (prop === 'scale' || prop === 'opacity') ? 100 : (prop === 'volume' ? 1.0 : 0);
                        const valAtSplit = valueAt(trackKfs, splitOffset, fallbackVal);
                        
                        const firstTrack = trackKfs.filter(k => k.t < splitOffset - 0.01);
                        firstTrack.push({ t: splitOffset, v: valAtSplit, ease: 'linear' });
                        firstAnim[prop] = firstTrack;
                        
                        const secondTrack = [{ t: 0, v: valAtSplit, ease: 'linear' }];
                        trackKfs.filter(k => k.t > splitOffset + 0.01).forEach(k => {
                            secondTrack.push({ ...k, t: Math.max(0, Number((k.t - splitOffset).toFixed(3))) });
                        });
                        secondAnim[prop] = secondTrack;
                    }
                });
                clip.animation = firstAnim;
                newClip.animation = secondAnim;
            }
            
            const clipIdx = track.clips.indexOf(clip);
            if (clipIdx !== -1) {
                track.clips.splice(clipIdx + 1, 0, newClip);
            } else {
                track.clips.push(newClip);
            }
            
            selectedClip = newClip;
            requestTimelineRender();
            selectClip(newClip);
            const isAud = clip.type === 'music' || clip.type === 'audio';
            showToast(`✂ ${isAud ? 'Audio' : 'Video'} clip split at playhead!`, '✂️', 'success');
        }

        function trimClipStartToPlayhead() {
            const { clip } = getClipUnderPlayhead();
            if (!clip) return showToast('No clip selected to trim.', '⚠️');
            const time = getCurrentPlaybackTime();
            const sourceDuration = getClipSourceDuration(clip);
            const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : sourceDuration;
            
            if (time >= trimEnd - MIN_TRIM_SECONDS) {
                return showToast('Playhead must be before the end of the clip.', '⚠️');
            }
            recordEdit();
            const oldTrimStart = clip.trimStart || 0;
            clip.trimStart = Math.max(0, time);
            clip.start = Math.max(0, (clip.start || 0) + (clip.trimStart - oldTrimStart));
            requestTimelineRender();
            updateTrimInspectors(clip);
            if (selectedClip === clip) selectClip(clip);
            showToast(`Trim In set to ${clip.trimStart.toFixed(2)}s`, '✂️', 'success');

        function splitClipHalves() {
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('No clip found.', '⚠️');
            const srcDur = getClipSourceDuration(clip);
            const start = clip.trimStart || 0;
            const end = clip.trimEnd || srcDur;
            const mid = start + (end - start) / 2;
            
            recordEdit();
            const originalTrimEnd = end;
            const newClip = JSON.parse(JSON.stringify(clip));
            newClip.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clip.trimEnd = mid;
            newClip.trimStart = mid;
            newClip.trimEnd = originalTrimEnd;
            newClip.start = (clip.start || 0) + (mid - start);
            
            const idx = track.clips.indexOf(clip);
            if (idx !== -1) track.clips.splice(idx + 1, 0, newClip);
            else track.clips.push(newClip);
            
            selectedClip = newClip;
            requestTimelineRender();
            selectClip(newClip);
            showToast('Clip split into 2 equal halves!', '✂️', 'success');

        function splitEveryNSeconds(n) {
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('No clip found.', '⚠️');
            const srcDur = getClipSourceDuration(clip);
            const start = clip.trimStart || 0;
            const end = clip.trimEnd || srcDur;
            const total = end - start;
            if (total <= n) return showToast(`Clip is shorter than ${n}s.`, '⚠️');
            
            recordEdit();
            const originalIndex = track.clips.indexOf(clip);
            const newClips = [];
            let current = start;
            let currentTimeline = clip.start || 0;
            
            while (current < end) {
                const next = Math.min(end, current + n);
                const c = JSON.parse(JSON.stringify(clip));
                c.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
                c.trimStart = current;
                c.trimEnd = next;
                c.start = currentTimeline;
                newClips.push(c);
                currentTimeline += (next - current);
                current = next;
            }
            
            if (originalIndex !== -1) {
                track.clips.splice(originalIndex, 1, ...newClips);
            }
            requestTimelineRender();
            showToast(`Split clip into ${newClips.length} pieces of ${n}s!`, '✂️', 'success');
        }

        // ==========================================
        // ANIMATION & KEYFRAME ENGINE (PRD v1.0 MVP)
        // ==========================================
        let activeAnimTab = 'quick'; // 'quick' (default) or 'custom'

        const Easing = {
            linear: (t) => t,
            easeIn: (t) => t * t * t,
            easeOut: (t) => 1 - Math.pow(1 - t, 3),
            easeInOut: (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2
        };

        function switchAnimTab(tab) {
            activeAnimTab = tab;
            const qBtn = document.getElementById('tabQuickAnim');
            const cBtn = document.getElementById('tabCustomAnim');
            const qPanel = document.getElementById('quickAnimPanel');

            if (qBtn) qBtn.classList.toggle('active', tab === 'quick');
            if (cBtn) cBtn.classList.toggle('active', tab === 'custom');
            if (qPanel) qPanel.style.display = tab === 'quick' ? 'block' : 'none';
            if (cPanel) cPanel.style.display = tab === 'custom' ? 'block' : 'none';

            const clip = getActiveClip();
            if (clip) syncKeyframeUIToClip(clip);
        }

        // Pure interpolation function for a keyframe track
        function valueAt(keyframes, localTime, fallback = 0) {
            if (!keyframes || !keyframes.length) return fallback;
            const sorted = keyframes.slice().sort((a, b) => a.t - b.t);
            if (localTime <= sorted[0].t) return sorted[0].v;
            if (localTime >= sorted[sorted.length - 1].t) return sorted[sorted.length - 1].v;

            const nextIdx = sorted.findIndex(k => k.t >= localTime);
            if (nextIdx <= 0) return sorted[0].v;
            const k0 = sorted[nextIdx - 1];
            const k1 = sorted[nextIdx];
            const dt = Math.max(0.0001, k1.t - k0.t);
            const progress = Math.min(1, Math.max(0, (localTime - k0.t) / dt));
            const easeFn = Easing[k0.ease || 'linear'] || Easing.linear;
            const eased = easeFn(progress);
            return k0.v + (k1.v - k0.v) * eased;
        }

        // Interpolates legacy { time, x, y, scale, rotation, opacity } array
        function interpolateLegacyKeyframes(clip, absTime) {
            const frames = (clip?.keyframes || []).slice().sort((a, b) => a.time - b.time);
            const base = clip?.transform || { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100 };
            const baseVol = Number(clip?.volume) ?? 1.0;
            if (!frames.length) return { ...base, volume: baseVol };
            if (frames.length === 1) return { ...base, ...frames[0], volume: baseVol };
            if (absTime <= frames[0].time) return { ...base, ...frames[0], volume: baseVol };
            if (absTime >= frames[frames.length - 1].time) return { ...base, ...frames[frames.length - 1], volume: baseVol };

            const nextIndex = frames.findIndex(f => f.time >= absTime);
            const a = frames[nextIndex - 1];
            const b = frames[nextIndex];
            const ratio = (absTime - a.time) / Math.max(b.time - a.time, 0.001);
            const easeFn = Easing[a.ease || 'linear'] || Easing.linear;
            const eased = easeFn(ratio);

            return {
                x: (a.x ?? base.x ?? 0) + ((b.x ?? base.x ?? 0) - (a.x ?? base.x ?? 0)) * eased,
                y: (a.y ?? base.y ?? 0) + ((b.y ?? base.y ?? 0) - (a.y ?? base.y ?? 0)) * eased,
                scale: (a.scale ?? base.scale ?? 100) + ((b.scale ?? base.scale ?? 100) - (a.scale ?? base.scale ?? 100)) * eased,
                rotation: (a.rotation ?? base.rotation ?? 0) + ((b.rotation ?? base.rotation ?? 0) - (a.rotation ?? base.rotation ?? 0)) * eased,
                opacity: (a.opacity ?? base.opacity ?? 100) + ((b.opacity ?? base.opacity ?? 100) - (a.opacity ?? base.opacity ?? 100)) * eased,
                volume: baseVol
            };
        }

        // Evaluates all properties at clip-relative localTime (0 <= localTime <= clipDuration)
        function evaluateClipAnimation(clip, localTime) {
            if (!clip) return { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100, volume: 1.0 };
            const tf = clip.transform || { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100 };
            const baseVol = Number.isFinite(clip.volume) ? Number(clip.volume) : 1.0;
            const anim = clip.animation;

            if (anim && (anim.scale || anim.positionX || anim.positionY || anim.rotation || anim.opacity || anim.volume)) {
                return {
                    x: valueAt(anim.positionX, localTime, tf.x ?? 0),
                    y: valueAt(anim.positionY, localTime, tf.y ?? 0),
                    scale: valueAt(anim.scale, localTime, tf.scale ?? 100),
                    rotation: valueAt(anim.rotation, localTime, tf.rotation ?? 0),
                    opacity: valueAt(anim.opacity, localTime, tf.opacity ?? 100),
                    volume: valueAt(anim.volume, localTime, baseVol)
                };
            }

            if (Array.isArray(clip.keyframes) && clip.keyframes.length > 0) {
                const trimS = Number(clip.trimStart) || 0;
                return interpolateLegacyKeyframes(clip, localTime + trimS);
            }

            return {
                x: tf.x ?? 0,
                y: tf.y ?? 0,
                scale: tf.scale ?? 100,
                rotation: tf.rotation ?? 0,
                opacity: tf.opacity ?? 100,
                volume: baseVol
            };
        }

        function interpolateKeyframes(clip, absTime) {
            if (!clip) return { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100, volume: 1.0 };
            const trimS = Number(clip.trimStart) || 0;
            const localTime = Math.max(0, absTime - trimS);
            return evaluateClipAnimation(clip, localTime);
        }

        // Returns unique sorted clip-relative timestamps of keyframes on the clip
        function getClipKeyframeTimes(clip) {
            if (!clip) return [];
            const times = new Set();
            const anim = clip.animation;
            if (anim) {
                ['scale', 'positionX', 'positionY', 'rotation', 'opacity', 'volume'].forEach(prop => {
                    if (Array.isArray(anim[prop])) {
                        anim[prop].forEach(k => {
                            if (Number.isFinite(k.t)) times.add(Number(k.t.toFixed(3)));
                        });
                    }
                });
            }
            if (Array.isArray(clip.keyframes)) {
                const trimS = Number(clip.trimStart) || 0;
                clip.keyframes.forEach(k => {
                    if (Number.isFinite(k.time)) times.add(Number((k.time - trimS).toFixed(3)));
                });
            }
            return Array.from(times).sort((a, b) => a - b);
        }

        function isPlayheadOnKeyframe(clip, localTime, tolerance = 0.05) {
            const times = getClipKeyframeTimes(clip);
            return times.some(t => Math.abs(t - localTime) <= tolerance);
        }

        function currentClipTime(clip = getActiveClip()) {
            const video = document.getElementById('previewVideo');
            if (!clip || !video) return 0;
            const trimS = Number(clip.trimStart) || 0;
            const trimE = Number(clip.trimEnd) || video.duration || 9999;
            return clamp(video.currentTime, trimS, trimE);
        }

        function getClipLocalTime(clip = getActiveClip()) {
            if (!clip) return 0;
            const absTime = currentClipTime(clip);
            return Math.max(0, absTime - (Number(clip.trimStart) || 0));
        }

        // --- Quick Animate Presets Implementation (Unlimited & Any Time) ---
        let quickAnimPlacement = 'playhead'; // 'playhead', 'start', 'end', 'whole'
        let quickAnimMode = 'append'; // 'append' or 'replace'

        function setQuickAnimPlacement(placement) {
            quickAnimPlacement = placement;
            ['placePlayhead', 'placeStart', 'placeEnd', 'placeWhole'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id.toLowerCase().includes(placement));
            });
            updateQuickAnimPlacementLabel();
        }

        function setQuickAnimMode(mode) {
            quickAnimMode = mode;
            ['modeAppend', 'modeReplace'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.toggle('active', id.toLowerCase().includes(mode));
            });
        }

        function updateQuickAnimPlacementLabel() {
            const lbl = document.getElementById('quickAnimTargetTimeLabel');
            if (!lbl) return;
            const clip = getActiveClip();
            const localT = clip ? getClipLocalTime(clip) : 0;
            if (quickAnimPlacement === 'playhead') {
                lbl.textContent = `📍 Playhead (${localT.toFixed(2)}s)`;
            } else if (quickAnimPlacement === 'start') {
                lbl.textContent = `🎬 Start (0.00s)`;
            } else if (quickAnimPlacement === 'end') {
                const dur = clip ? (Number(clip.trimEnd) || getClipSourceDuration(clip)) - (Number(clip.trimStart) || 0) : 0;
                lbl.textContent = `🏁 End (${dur.toFixed(2)}s)`;
            } else {
                lbl.textContent = `↔️ Entire Clip`;
            }
        }

        function insertKeyframeTrackNodes(clip, prop, nodes) {
            clip.animation ||= { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
            clip.animation[prop] ||= [];
            nodes.forEach(node => {
                const existIdx = clip.animation[prop].findIndex(k => Math.abs(k.t - node.t) <= 0.04);
                if (existIdx >= 0) {
                    clip.animation[prop][existIdx] = { ...clip.animation[prop][existIdx], ...node };
                } else {
                    clip.animation[prop].push(node);
                }
            });
            clip.animation[prop].sort((a, b) => a.t - b.t);
        }

        function applyQuickPreset(preset) {
            const clip = getActiveClip();
            if (!clip) return showToast('Please select or load a video clip first.', '⚠️');
            recordEdit();

            clip.activePreset = preset;
            const srcDur = getClipSourceDuration(clip);
            const trimS = Number(clip.trimStart) || 0;
            const trimE = Number(clip.trimEnd) || srcDur;
            const clipDur = Math.max(0.2, trimE - trimS);

            const durInput = Number(document.getElementById('quickAnimDuration')?.value) || 0.6;
            const animDur = Math.min(durInput, clipDur);
            const intensity = (Number(document.getElementById('quickAnimIntensity')?.value) || 100) / 100;
            const easing = document.getElementById('quickAnimEasing')?.value || 'easeOut';
            const direction = window.quickAnimDirection || 'left';

            clip.animationVersion = 1;

            // Timing calculation based on placement
            let t0 = 0;
            let t1 = animDur;
            const localTime = getClipLocalTime(clip);

            if (quickAnimPlacement === 'playhead') {
                t0 = clamp(localTime, 0, Math.max(0, clipDur - 0.05));
                t1 = Math.min(clipDur, t0 + animDur);
                if (t1 <= t0 + 0.02) t1 = Math.min(clipDur, t0 + 0.2);
            } else if (quickAnimPlacement === 'start') {
                t0 = 0;
                t1 = Math.min(clipDur, animDur);
            } else if (quickAnimPlacement === 'end') {
                t0 = Math.max(0, clipDur - animDur);
                t1 = clipDur;
            } else if (quickAnimPlacement === 'whole') {
                t0 = 0;
                t1 = clipDur;
            }

            if (quickAnimMode === 'replace') {
                clip.animation = { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
                clip.keyframes = [];
            } else {
                clip.animation ||= { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
            }

            const baseAtT0 = evaluateClipAnimation(clip, t0);
            const dt = Math.max(0.05, t1 - t0);

            if (preset === 'zoom-in') {
                const startScale = Math.max(20, Math.round(baseAtT0.scale * (1 - 0.25 * intensity)));
                const targetScale = Math.round(baseAtT0.scale);
                insertKeyframeTrackNodes(clip, 'scale', [
                    { t: t0, v: startScale, ease: easing },
                    { t: t1, v: targetScale, ease: 'linear' }
                ]);
                showToast(`🔍 Added Zoom In (${startScale}% ➔ ${targetScale}%) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'zoom-out') {
                const startScale = Math.min(250, Math.round(baseAtT0.scale * (1 + 0.25 * intensity)));
                const targetScale = Math.round(baseAtT0.scale);
                insertKeyframeTrackNodes(clip, 'scale', [
                    { t: t0, v: startScale, ease: easing },
                    { t: t1, v: targetScale, ease: 'linear' }
                ]);
                showToast(`🔎 Added Zoom Out (${startScale}% ➔ ${targetScale}%) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'punch-in') {
                const origScale = baseAtT0.scale || 100;
                const punchScale = Math.round(origScale * (1 + 0.35 * intensity));
                insertKeyframeTrackNodes(clip, 'scale', [
                    { t: t0, v: origScale, ease: 'easeIn' },
                    { t: t0 + dt * 0.35, v: punchScale, ease: 'easeOut' },
                    { t: t1, v: origScale, ease: 'linear' }
                ]);
                showToast(`⚡ Added Punch Snap at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'fade-in') {
                insertKeyframeTrackNodes(clip, 'opacity', [
                    { t: t0, v: 0, ease: easing },
                    { t: t1, v: 100, ease: 'linear' }
                ]);
                showToast(`👁️ Added Fade In (0% ➔ 100%) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'fade-out') {
                insertKeyframeTrackNodes(clip, 'opacity', [
                    { t: t0, v: 100, ease: easing },
                    { t: t1, v: 0, ease: 'linear' }
                ]);
                showToast(`🌘 Added Fade Out (100% ➔ 0%) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'slide-in') {
                let startX = 0, startY = 0;
                if (direction === 'left') startX = -100 * intensity;
                else if (direction === 'right') startX = 100 * intensity;
                else if (direction === 'top') startY = -100 * intensity;
                else if (direction === 'bottom') startY = 100 * intensity;

                if (startX !== 0) {
                    insertKeyframeTrackNodes(clip, 'positionX', [
                        { t: t0, v: baseAtT0.x + startX, ease: easing },
                        { t: t1, v: baseAtT0.x, ease: 'linear' }
                    ]);
                }
                if (startY !== 0) {
                    insertKeyframeTrackNodes(clip, 'positionY', [
                        { t: t0, v: baseAtT0.y + startY, ease: easing },
                        { t: t1, v: baseAtT0.y, ease: 'linear' }
                    ]);
                }
                showToast(`➡️ Added Slide In (${direction.toUpperCase()}) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'slide-out') {
                let endX = 0, endY = 0;
                if (direction === 'left') endX = -100 * intensity;
                else if (direction === 'right') endX = 100 * intensity;
                else if (direction === 'top') endY = -100 * intensity;
                else if (direction === 'bottom') endY = 100 * intensity;

                if (endX !== 0) {
                    insertKeyframeTrackNodes(clip, 'positionX', [
                        { t: t0, v: baseAtT0.x, ease: easing },
                        { t: t1, v: baseAtT0.x + endX, ease: 'linear' }
                    ]);
                }
                if (endY !== 0) {
                    insertKeyframeTrackNodes(clip, 'positionY', [
                        { t: t0, v: baseAtT0.y, ease: easing },
                        { t: t1, v: baseAtT0.y + endY, ease: 'linear' }
                    ]);
                }
                showToast(`⬅️ Added Slide Out (${direction.toUpperCase()}) at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'spin') {
                const deg = 360 * intensity;
                insertKeyframeTrackNodes(clip, 'rotation', [
                    { t: t0, v: baseAtT0.rotation, ease: easing },
                    { t: t1, v: baseAtT0.rotation + deg, ease: 'linear' }
                ]);
                showToast(`🌀 Added Spin 360° at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'bounce') {
                const origScale = baseAtT0.scale || 100;
                insertKeyframeTrackNodes(clip, 'scale', [
                    { t: t0, v: Math.round(origScale * 0.4), ease: 'easeOut' },
                    { t: t0 + dt * 0.45, v: Math.round(origScale * (1 + 0.22 * intensity)), ease: 'easeInOut' },
                    { t: t0 + dt * 0.75, v: Math.round(origScale * 0.95), ease: 'easeInOut' },
                    { t: t1, v: origScale, ease: 'linear' }
                ]);
                showToast(`🏀 Added Bounce Pop at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'shake') {
                const origX = baseAtT0.x || 0;
                const origY = baseAtT0.y || 0;
                const origR = baseAtT0.rotation || 0;
                const amp = 8 * intensity;
                insertKeyframeTrackNodes(clip, 'positionX', [
                    { t: t0, v: origX, ease: 'linear' },
                    { t: t0 + dt * 0.25, v: origX - amp, ease: 'linear' },
                    { t: t0 + dt * 0.50, v: origX + amp, ease: 'linear' },
                    { t: t0 + dt * 0.75, v: origX - (amp * 0.5), ease: 'linear' },
                    { t: t1, v: origX, ease: 'linear' }
                ]);
                insertKeyframeTrackNodes(clip, 'positionY', [
                    { t: t0, v: origY, ease: 'linear' },
                    { t: t0 + dt * 0.25, v: origY + (amp * 0.7), ease: 'linear' },
                    { t: t0 + dt * 0.50, v: origY - (amp * 0.7), ease: 'linear' },
                    { t: t0 + dt * 0.75, v: origY + (amp * 0.4), ease: 'linear' },
                    { t: t1, v: origY, ease: 'linear' }
                ]);
                insertKeyframeTrackNodes(clip, 'rotation', [
                    { t: t0, v: origR, ease: 'linear' },
                    { t: t0 + dt * 0.25, v: origR - (3 * intensity), ease: 'linear' },
                    { t: t0 + dt * 0.50, v: origR + (3 * intensity), ease: 'linear' },
                    { t: t1, v: origR, ease: 'linear' }
                ]);
                showToast(`💥 Added Glitch Shake at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'whip-pan') {
                const origX = baseAtT0.x || 0;
                const whipDist = 80 * intensity;
                insertKeyframeTrackNodes(clip, 'positionX', [
                    { t: t0, v: origX - whipDist, ease: 'easeOut' },
                    { t: t1, v: origX, ease: 'linear' }
                ]);
                insertKeyframeTrackNodes(clip, 'scale', [
                    { t: t0, v: Math.round(baseAtT0.scale * 1.15), ease: 'easeOut' },
                    { t: t1, v: baseAtT0.scale, ease: 'linear' }
                ]);
                showToast(`💨 Added Whip Pan at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            } else if (preset === 'volume-fade') {
                insertKeyframeTrackNodes(clip, 'volume', [
                    { t: t0, v: 0, ease: easing },
                    { t: t1, v: 1.0, ease: 'linear' }
                ]);
                showToast(`🔊 Added Volume Ramp at ${t0.toFixed(2)}s - ${t1.toFixed(2)}s`, '✨', 'success');
            }

            syncKeyframeUIToClip(clip);
            previewMotionAnimation(t0);
        }

        // --- Custom Keyframe Mode Handlers ---
        function addKeyframeAtClipLocalTime(clip, localTime) {
            if (!clip) return;
            recordEdit();
            clip.animation ||= { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
            const curVals = evaluateClipAnimation(clip, localTime);
            const ease = document.getElementById('keyframeEasingSelect')?.value || 'linear';

            const kx = Math.round(curVals.x ?? 0);
            const ky = Math.round(curVals.y ?? 0);
            const ks = Math.round(curVals.scale ?? 100);
            const kr = Math.round(curVals.rotation ?? 0);
            const ko = Math.round(curVals.opacity ?? 100);
            const kv = curVals.volume ?? 1.0;

            const upsert = (prop, val) => {
                clip.animation[prop] ||= [];
                const exist = clip.animation[prop].find(k => Math.abs(k.t - localTime) <= 0.06);
                if (exist) {
                    exist.v = val;
                } else {
                    clip.animation[prop].push({ t: localTime, v: val, ease });
                    clip.animation[prop].sort((a, b) => a.t - b.t);
                }
            };

            upsert('scale', ks);
            upsert('positionX', kx);
            upsert('positionY', ky);
            upsert('rotation', kr);
            upsert('opacity', ko);
            upsert('volume', kv);

            clip.activePreset = null;
            syncKeyframeUIToClip(clip);
            showToast(`◆ Keyframe added @ ${localTime.toFixed(2)}s (Total: ${getClipKeyframeTimes(clip).length} KFs)`, '◆', 'success');
        }

        function toggleKeyframeAtPlayhead() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please select or load a clip first.', '⚠️');
            recordEdit();

            clip.animation ||= { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
            const localTime = getClipLocalTime(clip);
            const isOn = isPlayheadOnKeyframe(clip, localTime, 0.06);

            if (isOn) {
                // Delete keyframe at this time
                ['scale', 'positionX', 'positionY', 'rotation', 'opacity', 'volume'].forEach(prop => {
                    if (Array.isArray(clip.animation[prop])) {
                        clip.animation[prop] = clip.animation[prop].filter(k => Math.abs(k.t - localTime) > 0.06);
                    }
                });
                if (Array.isArray(clip.keyframes)) {
                    const absTime = currentClipTime(clip);
                    clip.keyframes = clip.keyframes.filter(k => Math.abs(k.time - absTime) > 0.06);
                }
                showToast(`🗑️ Deleted Keyframe at ${localTime.toFixed(2)}s`, '🗑️', 'info');
            } else {
                // Add keyframe at this time with current values
                const curVals = evaluateClipAnimation(clip, localTime);
                const kx = Number(document.getElementById('keyframeX')?.value) ?? curVals.x ?? 0;
                const ky = Number(document.getElementById('keyframeY')?.value) ?? curVals.y ?? 0;
                const ks = Number(document.getElementById('keyframeScale')?.value) ?? curVals.scale ?? 100;
                const kr = Number(document.getElementById('keyframeRotation')?.value) ?? curVals.rotation ?? 0;
                const ko = Number(document.getElementById('keyframeOpacity')?.value) ?? curVals.opacity ?? 100;
                const kv = (Number(document.getElementById('keyframeVolume')?.value) || 100) / 100;
                const ease = document.getElementById('keyframeEasingSelect')?.value || 'linear';

                clip.animation.scale.push({ t: localTime, v: ks, ease });
                clip.animation.positionX.push({ t: localTime, v: kx, ease });
                clip.animation.positionY.push({ t: localTime, v: ky, ease });
                clip.animation.rotation.push({ t: localTime, v: kr, ease });
                clip.animation.opacity.push({ t: localTime, v: ko, ease });
                clip.animation.volume.push({ t: localTime, v: kv, ease });

                ['scale', 'positionX', 'positionY', 'rotation', 'opacity', 'volume'].forEach(prop => {
                    clip.animation[prop].sort((a, b) => a.t - b.t);
                });
                const totalKfs = getClipKeyframeTimes(clip).length;
                showToast(`◆ Added Keyframe at ${localTime.toFixed(2)}s (Total: ${totalKfs} KFs)`, '◆', 'success');
            }

            clip.activePreset = null;
            setTool('keyframe');
            switchAnimTab('custom');
            syncKeyframeUIToClip(clip);
        }

        function jumpAdjacentKeyframe(direction) {
            const clip = getActiveClip();
            if (!clip) return;
            const times = getClipKeyframeTimes(clip);
            if (!times.length) return showToast('No keyframes on this clip.', '⚠️', 'info');

            const curLocal = getClipLocalTime(clip);
            const trimS = Number(clip.trimStart) || 0;

            if (direction === -1) {
                const prev = times.filter(t => t < curLocal - 0.05).pop();
                if (prev !== undefined) jumpToKeyframeTime(trimS + prev);
                else jumpToKeyframeTime(trimS + times[0]);
            } else {
                const next = times.find(t => t > curLocal + 0.05);
                if (next !== undefined) jumpToKeyframeTime(trimS + next);
                else jumpToKeyframeTime(trimS + times[times.length - 1]);
            }
        }

        function onKeyframeSliderInput(changedProp) {
            const clip = getActiveClip();
            if (!clip) return;

            const kx = Number(document.getElementById('keyframeX')?.value) || 0;
            const ky = Number(document.getElementById('keyframeY')?.value) || 0;
            const ks = Number(document.getElementById('keyframeScale')?.value) || 100;
            const kr = Number(document.getElementById('keyframeRotation')?.value) || 0;
            const ko = Number(document.getElementById('keyframeOpacity')?.value) || 100;
            const kv = (Number(document.getElementById('keyframeVolume')?.value) || 100) / 100;

            const xVal = document.getElementById('kfXVal');
            const yVal = document.getElementById('kfYVal');
            const sVal = document.getElementById('kfScaleVal');
            const rVal = document.getElementById('kfRotVal');
            const oVal = document.getElementById('kfOpacVal');
            const vVal = document.getElementById('kfVolVal');

            if (xVal) xVal.textContent = kx + '%';
            if (yVal) yVal.textContent = ky + '%';
            if (sVal) sVal.textContent = ks + '%';
            if (rVal) rVal.textContent = kr + '°';
            if (oVal) oVal.textContent = ko + '%';
            if (vVal) vVal.textContent = Math.round(kv * 100) + '%';

            clip.transform = { x: kx, y: ky, scale: ks, rotation: kr, opacity: ko };
            clip.volume = kv;

            // Auto-keyframe logic (FR-12): if keyframes exist on the clip
            const kfTimes = getClipKeyframeTimes(clip);
            if (kfTimes.length > 0) {
                clip.animation ||= { scale: [], positionX: [], positionY: [], rotation: [], opacity: [], volume: [] };
                const localTime = getClipLocalTime(clip);
                const ease = document.getElementById('keyframeEasingSelect')?.value || 'linear';

                // Helper to update or insert keyframe for a prop
                const upsertKf = (propName, val) => {
                    clip.animation[propName] ||= [];
                    const existing = clip.animation[propName].find(k => Math.abs(k.t - localTime) <= 0.12);
                    if (existing) {
                        existing.v = val;
                    } else {
                        clip.animation[propName].push({ t: localTime, v: val, ease });
                        clip.animation[propName].sort((a, b) => a.t - b.t);
                    }
                };

                if (changedProp === 'scale') upsertKf('scale', ks);
                else if (changedProp === 'x') upsertKf('positionX', kx);
                else if (changedProp === 'y') upsertKf('positionY', ky);
                else if (changedProp === 'rotation') upsertKf('rotation', kr);
                else if (changedProp === 'opacity') upsertKf('opacity', ko);
                else if (changedProp === 'volume') upsertKf('volume', kv);
                else {
                    upsertKf('scale', ks);
                    upsertKf('positionX', kx);
                    upsertKf('positionY', ky);
                    upsertKf('rotation', kr);
                    upsertKf('opacity', ko);
                    upsertKf('volume', kv);
                }
                renderKeyframeList();
            }

            updatePreviewVisuals();
            renderMotionPathOverlay(clip);
            renderTransformGizmo(clip);
            requestTimelineRender();
        }
