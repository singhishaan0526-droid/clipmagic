                item.style.marginBottom = '6px';
                item.innerHTML = `
                    <div style="flex:1;cursor:pointer;" onclick="jumpToKeyframeTime(${trimS + t})" title="Click to jump playhead to this keyframe">
                        <div style="font-size:0.76rem;font-weight:700;color:#38bdf8;">◆ Point #${idx + 1} @ ${t.toFixed(2)}s</div>
                        <div style="font-size:0.68rem;color:var(--text-secondary);">Scale: ${Math.round(vals.scale)}% • Pos: (${Math.round(vals.x)}%, ${Math.round(vals.y)}%) • Rot: ${Math.round(vals.rotation)}° • Opac: ${Math.round(vals.opacity)}%</div>
                    </div>
                    <button class="icon-btn" style="width:24px;height:24px;color:#fca5a5;border-color:rgba(239,68,68,0.3);" onclick="deleteKeyframeAtTime(${t})" title="Delete Keyframe">✕</button>
                `;
                container.appendChild(item);
            });
        }

        function syncKeyframeUIToClip(clip) {
            if (!clip) return;
            clip.transform ||= { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100 };
            const localTime = getClipLocalTime(clip);
            const currentVals = evaluateClipAnimation(clip, localTime);

            const kx = document.getElementById('keyframeX');
            const ky = document.getElementById('keyframeY');
            const ks = document.getElementById('keyframeScale');
            const kr = document.getElementById('keyframeRotation');
            const ko = document.getElementById('keyframeOpacity');
            const kv = document.getElementById('keyframeVolume');

            if (kx) kx.value = currentVals.x ?? 0;
            if (ky) ky.value = currentVals.y ?? 0;
            if (ks) ks.value = currentVals.scale ?? 100;
            if (kr) kr.value = currentVals.rotation ?? 0;
            if (ko) ko.value = currentVals.opacity ?? 100;
            if (kv) kv.value = Math.round((currentVals.volume ?? 1) * 100);

            const xVal = document.getElementById('kfXVal');
            const yVal = document.getElementById('kfYVal');
            const sVal = document.getElementById('kfScaleVal');
            const rVal = document.getElementById('kfRotVal');
            const oVal = document.getElementById('kfOpacVal');
            const vVal = document.getElementById('kfVolVal');

            if (xVal) xVal.textContent = Math.round(currentVals.x ?? 0) + '%';
            if (yVal) yVal.textContent = Math.round(currentVals.y ?? 0) + '%';
            if (sVal) sVal.textContent = Math.round(currentVals.scale ?? 100) + '%';
            if (rVal) rVal.textContent = Math.round(currentVals.rotation ?? 0) + '°';
            if (oVal) oVal.textContent = Math.round(currentVals.opacity ?? 100) + '%';
            if (vVal) vVal.textContent = Math.round((currentVals.volume ?? 1) * 100) + '%';

            // Playhead Readout
            const absTime = currentClipTime(clip);
            const playheadEl = document.getElementById('kfPlayheadTime');
            const localEl = document.getElementById('kfLocalTime');
            if (playheadEl) playheadEl.textContent = absTime.toFixed(2) + 's';
            if (localEl) localEl.textContent = localTime.toFixed(2) + 's';

            // Diamond Toggle Button State (Outlined ◇ vs Filled ◆)
            const isOn = isPlayheadOnKeyframe(clip, localTime, 0.06);
            const diamondBtn = document.getElementById('diamondToggleBtn');
            const diamondIcon = document.getElementById('diamondIcon');
            const diamondText = document.getElementById('diamondText');
            if (diamondBtn && diamondIcon && diamondText) {
                diamondBtn.classList.toggle('on-keyframe', isOn);
                diamondIcon.textContent = isOn ? '◆' : '◇';
                diamondText.textContent = isOn ? 'Delete Keyframe' : 'Add Keyframe';
            }

            // Highlight active Quick Animate preset
            document.querySelectorAll('.preset-card').forEach(btn => {
                btn.classList.toggle('active', clip.activePreset && btn.id === `presetBtn-${clip.activePreset}`);
            });

            renderKeyframeList();
            renderMotionPathOverlay(clip);
            renderTransformGizmo(clip);
            updateQuickAnimPlacementLabel();
            requestTimelineRender();
            updatePreviewVisuals();
        }

        // --- Drag Keyframe Timeline Markers with Magnetic Snapping (FR-10) ---
        function beginKeyframeDrag(event, clip, initialLocalKfTime, lane, clipEl) {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();

            const startX = event.clientX;
            const laneRect = lane.getBoundingClientRect();
            const trimS = Number(clip.trimStart) || 0;
            const srcDur = getClipSourceDuration(clip);
            const trimE = Number(clip.trimEnd) || srcDur;
            const clipDur = Math.max(0.01, trimE - trimS);
            const clipWidthPx = (clipDur / MAX_TIMELINE_SECONDS) * laneRect.width;

            const markerEl = event.currentTarget;
            markerEl.classList.add('dragging');
            markerEl.setPointerCapture?.(event.pointerId);

            let newLocalTime = initialLocalKfTime;

            const onMove = (moveEvt) => {
                const deltaX = moveEvt.clientX - startX;
                const deltaSec = (deltaX / Math.max(1, clipWidthPx)) * clipDur;
                let candidateTime = clamp(initialLocalKfTime + deltaSec, 0, clipDur);

                // Magnetic Snapping targets
                const snapTargets = [0, clipDur];
                const vid = document.getElementById('previewVideo');
                if (vid) snapTargets.push(Math.max(0, vid.currentTime - trimS));

                const otherTimes = getClipKeyframeTimes(clip).filter(t => Math.abs(t - initialLocalKfTime) > 0.05);
                snapTargets.push(...otherTimes);

                const snapThresh = Math.max(0.04, 0.15 / Math.max(timelineZoom, 0.5));
                for (const target of snapTargets) {
                    if (Math.abs(candidateTime - target) < snapThresh) {
                        candidateTime = target;
                        break;
                    }
                }

                newLocalTime = candidateTime;
                const pct = clamp((newLocalTime / clipDur) * 100, 1, 99);
                markerEl.style.left = `${pct}%`;
            };

            const onEnd = () => {
                markerEl.classList.remove('dragging');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);

                if (Math.abs(newLocalTime - initialLocalKfTime) > 0.01) {
                    recordEdit();
                    // Retime in clip.animation
                    if (clip.animation) {
                        ['scale', 'positionX', 'positionY', 'rotation', 'opacity', 'volume'].forEach(prop => {
                            if (Array.isArray(clip.animation[prop])) {
                                const target = clip.animation[prop].find(k => Math.abs(k.t - initialLocalKfTime) <= 0.05);
                                if (target) target.t = newLocalTime;
                                clip.animation[prop].sort((a, b) => a.t - b.t);
                            }
                        });
                    }
                    if (Array.isArray(clip.keyframes)) {
                        const target = clip.keyframes.find(k => Math.abs(k.time - (trimS + initialLocalKfTime)) <= 0.05);
                        if (target) target.time = trimS + newLocalTime;
                        clip.keyframes.sort((a, b) => a.time - b.time);
                    }
                    syncKeyframeUIToClip(clip);
                    showToast(`⏱️ Keyframe retimed to ${newLocalTime.toFixed(2)}s`, '⏱️', 'info');
                }
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        // --- Canvas Motion Path Overlay & Transform Gizmo (FR-19 & 5.2) ---
        function renderMotionPathOverlay(clip) {
            const svg = document.getElementById('motionPathOverlay');
            const screen = document.getElementById('previewScreen');
            if (!svg || !screen) return;

            const isAnimationTool = document.getElementById('tool-keyframe')?.classList.contains('active');
            if (!isAnimationTool || !clip) {
                svg.style.display = 'none';
                svg.innerHTML = '';
                return;
            }

            const kfTimes = getClipKeyframeTimes(clip);
            if (kfTimes.length < 2) {
                svg.style.display = 'none';
                svg.innerHTML = '';
                return;
            }

            const rect = screen.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;
            if (w <= 0 || h <= 0) return;

            svg.style.display = 'block';
            svg.setAttribute('viewBox', `0 0 ${w} ${h}`);

            let points = [];
            kfTimes.forEach(t => {
                const vals = evaluateClipAnimation(clip, t);
                const px = (w / 2) + (vals.x / 100) * (w / 2);
                const py = (h / 2) + (vals.y / 100) * (h / 2);
                points.push({ x: px, y: py, t, vals });
            });

            let polylinePoints = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
            let html = `<polyline points="${polylinePoints}" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" opacity="0.85"/>`;

            points.forEach((p, idx) => {
                html += `
                    <g transform="translate(${p.x}, ${p.y})" style="cursor:pointer;" onclick="jumpToKeyframeTime(${(Number(clip.trimStart) || 0) + p.t})">
                        <polygon points="0,-6 6,0 0,6 -6,0" fill="#a855f7" stroke="#ffffff" stroke-width="1.5"/>
                        <text x="8" y="4" fill="#38bdf8" font-size="10" font-weight="bold" font-family="sans-serif">${p.t.toFixed(1)}s</text>
                    </g>
                `;
            });

            svg.innerHTML = html;
        }

        let gizmoInitialized = false;
        function renderTransformGizmo(clip) {
            const gizmo = document.getElementById('previewTransformGizmo');
            const screen = document.getElementById('previewScreen');
            const video = document.getElementById('previewVideo');
            if (!gizmo || !screen) return;

            const isAnimationTool = document.getElementById('tool-keyframe')?.classList.contains('active');
            if (!isAnimationTool || !clip || !video || video.style.display === 'none') {
                gizmo.style.display = 'none';
                return;
            }

            const localTime = getClipLocalTime(clip);
            const props = evaluateClipAnimation(clip, localTime);

            const vRect = video.getBoundingClientRect();
            const sRect = screen.getBoundingClientRect();
            if (sRect.width <= 0 || sRect.height <= 0) return;

            const boxW = Math.max(40, vRect.width || (sRect.width * 0.8));
            const boxH = Math.max(30, vRect.height || (sRect.height * 0.8));
            const left = (sRect.width - boxW) / 2 + (props.x / 100) * (sRect.width / 2);
            const top = (sRect.height - boxH) / 2 + (props.y / 100) * (sRect.height / 2);

            gizmo.style.display = 'block';
            gizmo.style.width = `${boxW}px`;
            gizmo.style.height = `${boxH}px`;
            gizmo.style.left = `${left}px`;
            gizmo.style.top = `${top}px`;
            gizmo.style.transform = `rotate(${props.rotation}deg)`;

            if (!gizmoInitialized) {
                gizmo.innerHTML = `
                    <div class="gizmo-rotate-line"></div>
                    <div class="gizmo-rotate-handle" id="gizmoRotHandle" title="Drag to Rotate">↻</div>
                    <div class="gizmo-handle nw" id="gizmoHandleNW"></div>
                    <div class="gizmo-handle ne" id="gizmoHandleNE"></div>
                    <div class="gizmo-handle se" id="gizmoHandleSE"></div>
                    <div class="gizmo-handle sw" id="gizmoHandleSW"></div>
                `;
                initGizmoEvents(gizmo);
                gizmoInitialized = true;
            }
        }

        function initGizmoEvents(gizmo) {
            // Reposition Drag
            gizmo.onpointerdown = (e) => {
                if (e.target.closest('.gizmo-handle') || e.target.closest('.gizmo-rotate-handle')) return;
                e.preventDefault();
                e.stopPropagation();

                const clip = getActiveClip();
                if (!clip) return;
                const startX = e.clientX;
                const startY = e.clientY;
                const screen = document.getElementById('previewScreen');
                const sRect = screen.getBoundingClientRect();
                const initialVals = evaluateClipAnimation(clip, getClipLocalTime(clip));
                const initX = initialVals.x;
                const initY = initialVals.y;

                const onMove = (me) => {
                    const dx = ((me.clientX - startX) / (sRect.width / 2)) * 100;
                    const dy = ((me.clientY - startY) / (sRect.height / 2)) * 100;
                    const newX = clamp(initX + dx, -100, 100);
                    const newY = clamp(initY + dy, -100, 100);

                    const kx = document.getElementById('keyframeX');
                    const ky = document.getElementById('keyframeY');
                    if (kx) kx.value = newX;
                    if (ky) ky.value = newY;
                    onKeyframeSliderInput('position');
                };

                const onEnd = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onEnd);
                    recordEdit();
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onEnd, { once: true });
            };

            // Rotate Drag
            gizmo.querySelector('#gizmoRotHandle')?.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const clip = getActiveClip();
                if (!clip) return;

                const gRect = gizmo.getBoundingClientRect();
                const centerX = gRect.left + gRect.width / 2;
                const centerY = gRect.top + gRect.height / 2;

                const onMove = (me) => {
                    const rad = Math.atan2(me.clientY - centerY, me.clientX - centerX);
                    let deg = Math.round(rad * (180 / Math.PI) + 90);
                    if (deg > 180) deg -= 360;
                    const kr = document.getElementById('keyframeRotation');
                    if (kr) kr.value = clamp(deg, -360, 360);
                    onKeyframeSliderInput('rotation');
                };

                const onEnd = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onEnd);
                    recordEdit();
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onEnd, { once: true });
            });

            // Scale Drag on Corner Handles
            ['gizmoHandleNW', 'gizmoHandleNE', 'gizmoHandleSE', 'gizmoHandleSW'].forEach(handleId => {
                gizmo.querySelector(`#${handleId}`)?.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const clip = getActiveClip();
                    if (!clip) return;

                    const startY = e.clientY;
                    const initialVals = evaluateClipAnimation(clip, getClipLocalTime(clip));
                    const initScale = initialVals.scale;

                    const onMove = (me) => {
                        const delta = (startY - me.clientY) * 0.8;
                        const newScale = clamp(initScale + delta, 10, 300);
                        const ks = document.getElementById('keyframeScale');
                        if (ks) ks.value = newScale;
                        onKeyframeSliderInput('scale');
                    };

                    const onEnd = () => {
                        window.removeEventListener('pointermove', onMove);
                        window.removeEventListener('pointerup', onEnd);
                        recordEdit();
                    };

                    window.addEventListener('pointermove', onMove);
                    window.addEventListener('pointerup', onEnd, { once: true });
                });
            });
        }

        let playbackLoopRaf = null;
        function ensurePlaybackAnimationLoop() {
            if (playbackLoopRaf) cancelAnimationFrame(playbackLoopRaf);
            function step() {
                const vid = document.getElementById('previewVideo');
                if (vid && !vid.paused) {
                    updatePreviewVisuals();
                    playbackLoopRaf = requestAnimationFrame(step);
                } else {
                    playbackLoopRaf = null;
                }
            }
            playbackLoopRaf = requestAnimationFrame(step);
        }

        function previewMotionAnimation() {
            const vid = document.getElementById('previewVideo');
            const clip = getActiveClip();
            if (!vid || !clip) return;
            vid.currentTime = Number(clip.trimStart) || 0;
            vid.play();
            ensurePlaybackAnimationLoop();
            showToast('▶ Playing motion animation preview...', '▶', 'info');
        }

        function jumpToKeyframeTime(time) {
            const vid = document.getElementById('previewVideo');
            if (vid) vid.currentTime = time;
            updatePreviewVisuals();
            const clip = getActiveClip();
            if (clip) syncKeyframeUIToClip(clip);
        }

        function addSpeedPoint() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please load a video clip first.', '⚠️');
            recordEdit();
            clip.speedSegments ||= [];
            const time = currentClipTime(clip);
            const speed = clamp(Number(document.getElementById('speedValue')?.value) || 1, 0.1, 8);
            clip.speedSegments = clip.speedSegments.filter(item => Math.abs(item.time - time) > 0.01);
            clip.speedSegments.push({ time, speed });
            clip.speedSegments.sort((a, b) => a.time - b.time);
            updatePreviewVisuals();
            showToast(`${speed}× speed point added.`, '⏩', 'success');
        }

        function speedAtTime(clip, time) {
            const points = (clip?.speedSegments || []).filter(item => Number.isFinite(item.time)).sort((a, b) => a.time - b.time);
            let speed = 1;
            for (const point of points) {
                if (point.time > time) break;
                speed = clamp(Number(point.speed) || 1, 0.1, 8);
            }
            return speed;
        }

        function updatePreviewVisuals() {
            const screen = document.getElementById('previewScreen');
            const video = document.getElementById('previewVideo');
            if (!screen) return;
            const activeClip = getActivePlayingClip() || getActiveClip();
            screen.className = screen.className.replace(/\bfilter-\S+/g, '').trim();
            if (activeClip?.filter) screen.classList.add(`filter-${activeClip.filter}`);
            if (video && activeClip) {
                const time = currentClipTime(activeClip);
                const localTime = Math.max(0, time - (Number(activeClip.trimStart) || 0));
                const props = evaluateClipAnimation(activeClip, localTime);

                video.style.transform = `translate(${props.x}%, ${props.y}%) scale(${props.scale / 100}) rotate(${props.rotation}deg)`;
                video.style.opacity = String(props.opacity / 100);
                video.volume = clamp(props.volume, 0, 1);
                video.playbackRate = speedAtTime(activeClip, time);

                const vfx = activeClip.vfx || {};
                const level = clamp(Number(vfx.intensity) || 0, 0, 100) / 100;
                video.classList.remove('vfx-glitch', 'vfx-blur', 'vfx-shake');
                video.style.setProperty('--vfx-intensity', `${Math.max(1, level * 10)}`);
                const baseFilter = getBasePreviewFilter(activeClip.filter);
                const gradeFilter = getGradePreviewFilter(activeClip.colorGrade);
                const glitchFilter = vfx.preset === 'glitch' ? `contrast(${1 + level}) saturate(${1 + level * 1.5}) hue-rotate(${level * 18}deg)` : '';
                const blurFilter = vfx.preset === 'blur' ? `blur(${level * 8}px)` : '';
                video.style.filter = `${baseFilter} ${gradeFilter} ${glitchFilter} ${blurFilter}`.trim();
                if (vfx.preset === 'shake') video.classList.add('vfx-shake');
                if (vfx.preset === 'glitch') video.classList.add('vfx-glitch');
                if (vfx.preset === 'blur') video.classList.add('vfx-blur');
            }
            renderPipOverlays();
            renderTextOverlays();
            if (document.getElementById('tool-keyframe')?.classList.contains('active') && activeClip) {
                renderMotionPathOverlay(activeClip);
                renderTransformGizmo(activeClip);
            }
        }

        function applyVfx() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please load a video clip first.', '⚠️');
            recordEdit();
            clip.vfx = {
                preset: document.getElementById('vfxPreset')?.value || 'none',
                intensity: clamp(Number(document.getElementById('vfxIntensity')?.value) || 0, 0, 100)
            };
            const value = document.getElementById('vfxIntensityValue');
            if (value) value.textContent = `${clip.vfx.intensity}%`;
            updatePreviewVisuals();
            showToast('VFX applied!', '✦', 'success');
        }

        function getBasePreviewFilter(filter) {
            return ({
                vivid: 'saturate(1.8) contrast(1.15) brightness(1.05)',
                cinematic: 'contrast(1.25) saturate(0.75) sepia(0.2)',
                bw: 'grayscale(1) contrast(1.2) brightness(0.95)',
                warm: 'saturate(1.3) sepia(0.3) hue-rotate(-10deg)',
                cool: 'saturate(1.1) hue-rotate(18deg) brightness(1.05)'
            })[filter] || '';
        }

        function getGradePreviewFilter(grade = {}) {
            const preset = grade.preset || 'none';
            const presets = {
                'teal-orange': 'contrast(1.18) saturate(1.35) sepia(.1) hue-rotate(-10deg)',
                film: 'contrast(1.1) saturate(.85) sepia(.2)',
                bleach: 'contrast(1.4) saturate(.4)',
                noir: 'grayscale(1) contrast(1.35)',
                sunset: 'saturate(1.45) sepia(.32) hue-rotate(-15deg)'
            };
            const exposure = Math.pow(2, Number(grade.exposure) || 0);
            const contrast = Number(grade.contrast) || 1;
            const saturation = Number(grade.saturation) || 1;
            return `${presets[preset] || ''} brightness(${exposure}) contrast(${contrast}) saturate(${saturation})`.trim();
        }

        function applyColorGrade() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please load a video clip first.', '⚠️');
            recordEdit();
            clip.colorGrade = {
                preset: document.getElementById('gradePreset')?.value || 'none',
                exposure: Number(document.getElementById('gradeExposure')?.value) || 0,
                contrast: Number(document.getElementById('gradeContrast')?.value) || 1,
                saturation: Number(document.getElementById('gradeSaturation')?.value) || 1
            };
            updatePreviewVisuals();
            showToast('Color grade applied!', '◐', 'success');
        }

        function applyPipSettings() {
            if (!selectedClip) return showToast('Select a video clip first.', '⚠️');
            recordEdit();
            selectedClip.pip ||= {};
            selectedClip.pip.position = document.getElementById('pipPosition')?.value || 'bottom-right';
            selectedClip.pip.size = clamp(Number(document.getElementById('pipSize')?.value) || 32, 15, 60);
            selectedClip.pip.opacity = clamp(Number(document.getElementById('pipOpacity')?.value) || 100, 20, 100);
            renderPipOverlays();
        }

        function moveSelectedToPipTrack() {
            if (!selectedClip || selectedClip.type !== 'video') return showToast('Select a video clip first.', '⚠️');
            const sourceTrack = projectState.tracks.find(track => track.clips?.includes(selectedClip));
            if (!sourceTrack) return;
            let pipTrack = projectState.tracks.find(track => track.type === 'video' && track !== sourceTrack);
            if (!pipTrack) {
                pipTrack = { id: `track-video-${Date.now()}`, type: 'video', name: 'Video Overlay', clips: [] };
                projectState.tracks.push(pipTrack);
            }
            recordEdit();
            sourceTrack.clips = sourceTrack.clips.filter(clip => clip !== selectedClip);
            selectedClip.pip ||= { position: 'bottom-right', size: 32, opacity: 100 };
            pipTrack.clips.push(selectedClip);
            requestTimelineRender();
            renderPipOverlays();
            showToast('Clip moved to PiP overlay track.', '▣', 'success');
        }

        const pipVideoCache = new Map();
        async function renderPipOverlays() {
            const screen = document.getElementById('previewScreen');
            const mainVideo = document.getElementById('previewVideo');
            if (!screen || !mainVideo) return;
            const now = mainVideo.currentTime || 0;
            const activeIds = new Set();
            for (const track of projectState.tracks.filter(item => item.type === 'video').slice(1)) {
                for (const clip of track.clips || []) {
                    const duration = Math.max(0.01, (Number(clip.trimEnd) || Number(clip.duration) || 1) - (Number(clip.trimStart) || 0));
                    if (now < (Number(clip.start) || 0) || now > (Number(clip.start) || 0) + duration) continue;
                    activeIds.add(clip.id);
                    let pip = pipVideoCache.get(clip.id);
                    if (!pip) {
                        if (!window.currentProject?.id || !clip.assetId) continue;
                        pip = document.createElement('video');
                        pip.className = 'pip-video';
                        pip.muted = true;
                        pip.playsInline = true;
                        pip.src = await AssetManager.getUrl(window.currentProject?.id, clip.assetId);
                        screen.appendChild(pip);
                        pipVideoCache.set(clip.id, pip);
                    }
                    const settings = clip.pip || { position: 'bottom-right', size: 32, opacity: 100 };
                    const margin = 3;
                    pip.style.width = `${settings.size}%`;
                    pip.style.height = `${settings.size * .5625}%`;
                    pip.style.opacity = `${settings.opacity / 100}`;
                    pip.style.top = settings.position.startsWith('top') ? `${margin}%` : 'auto';
                    pip.style.bottom = settings.position.startsWith('bottom') ? `${margin}%` : 'auto';
                    pip.style.left = settings.position.endsWith('left') ? `${margin}%` : 'auto';
                    pip.style.right = settings.position.endsWith('right') ? `${margin}%` : 'auto';
                    pip.currentTime = (Number(clip.trimStart) || 0) + now - (Number(clip.start) || 0);
                    if (!mainVideo.paused) pip.play().catch(() => {});
                }
            }
            for (const [id, pip] of pipVideoCache) if (!activeIds.has(id)) pip.style.display = 'none'; else pip.style.display = 'block';
        }

        let activeTextDrag = null;

        function syncTextOverlayPositionControls(item) {
            const x = clamp(Number(item.x) || 50, 5, 95);
            const y = clamp(Number(item.y) || 76, 5, 95);
            const xInput = document.getElementById('overlayX');
            const yInput = document.getElementById('overlayY');

        function beginTextOverlayDrag(event, item, element) {
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            recordEdit();
            activeTextDrag = {
                item,
                element,
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                startItemX: Number(item.x) || 50,
                startItemY: Number(item.y) || 76,
                rect: document.getElementById('previewScreen')?.getBoundingClientRect()
            };
            element.classList.add('dragging');
            try { element.setPointerCapture?.(event.pointerId); } catch (_) { /* window listeners still track the drag */ }
            window.addEventListener('pointermove', moveTextOverlayDrag);
            window.addEventListener('pointerup', endTextOverlayDrag, { once: true });
            window.addEventListener('pointercancel', endTextOverlayDrag, { once: true });
        }

        function moveTextOverlayDrag(event) {
            const drag = activeTextDrag;
            if (!drag || (drag.pointerId !== undefined && event.pointerId !== drag.pointerId)) return;
            const rect = drag.rect || document.getElementById('previewScreen')?.getBoundingClientRect();
            if (!rect || !rect.width || !rect.height) return;
            drag.item.x = clamp(drag.startItemX + ((event.clientX - drag.startX) / rect.width) * 100, 5, 95);
            drag.item.y = clamp(drag.startItemY + ((event.clientY - drag.startY) / rect.height) * 100, 5, 95);
            drag.element.style.left = `${drag.item.x}%`;
            drag.element.style.top = `${drag.item.y}%`;
            syncTextOverlayPositionControls(drag.item);
        }

        function endTextOverlayDrag(event) {
            const drag = activeTextDrag;
            if (!drag) return;
            if (event?.pointerId !== undefined && drag.pointerId !== undefined && event.pointerId !== drag.pointerId) return;
            drag.element.classList.remove('dragging');
            try { drag.element.releasePointerCapture?.(drag.pointerId); } catch (_) { /* capture may already be released */ }
            activeTextDrag = null;
            window.removeEventListener('pointermove', moveTextOverlayDrag);
            window.removeEventListener('pointercancel', endTextOverlayDrag);
            requestTimelineRender();
            showToast('Text position updated.', '↕', 'success');
        }

        function renderTextOverlays() {
            const layer = document.getElementById('textOverlayLayer');
            if (!layer) return;
            layer.replaceChildren();
            const now = typeof getCurrentPlaybackTime === 'function' ? getCurrentPlaybackTime() : (document.getElementById('previewVideo')?.currentTime || 0);
            const activeOverlays = (projectState.textOverlays || []).filter(item => now >= Number(item.start || 0) && now <= Number(item.end || 0));
            
            activeOverlays.forEach(item => {
                const el = document.createElement('div');
                const style = item.style || (item.kind === 'caption' ? 'solid' : 'gradient');
                const animation = item.animation || 'word-by-word';
                const textFilter = item.textFilter || 'none';
                el.className = `text-overlay ${item.kind === 'caption' ? 'caption-overlay' : ''} lyric-${style} lyric-${animation} lyric-${textFilter}`.trim();
                el.style.left = `${clamp(Number(item.x) || 50, 5, 95)}%`;
                el.style.top = `${clamp(Number(item.y) || (item.kind === 'caption' ? 84 : 76), 5, 95)}%`;
                el.style.fontSize = `${clamp(Number(item.size) || 32, 14, 96)}px`;
                el.style.setProperty('--lyric-a', item.colorA || item.color || '#f472b6');
                el.style.setProperty('--lyric-b', item.colorB || item.color || '#60a5fa');
                el.title = 'Drag to position text';
                el.onpointerdown = (event) => beginTextOverlayDrag(event, item, el);

                const rawText = String(item.text || '').trim();
                const words = rawText.split(/\s+/).filter(Boolean);
                const start = Number(item.start || 0);
                const end = Number(item.end || start + 3);
                const duration = Math.max(0.1, end - start);
                const elapsed = Math.max(0, now - start);
                const progress = Math.min(1, elapsed / duration);
                
                // Determine active word index with word-level timing precision
                let activeWordIndex = -1;
                const hasDetailedWords = Array.isArray(item.words) && item.words.length > 0;
                
                if (hasDetailedWords) {
                    activeWordIndex = item.words.findIndex(w => now >= Number(w.start || 0) && now < Number(w.end || (Number(w.start || 0) + 0.3)));
                    if (activeWordIndex === -1 && now >= start && now <= end) {
                        for (let i = item.words.length - 1; i >= 0; i--) {
                            if (now >= Number(item.words[i].start || 0)) {
                                activeWordIndex = i;
                                break;
                            }
                        }
                    }
                }
                
                if (activeWordIndex === -1) {
                    activeWordIndex = Math.min(words.length - 1, Math.floor(progress * words.length));
                }

                if (animation === 'word-by-word' || animation === 'pop' || animation === 'slide-up' || animation === 'pulse' || item.kind === 'caption') {
                    const displayList = (hasDetailedWords && item.words.length === words.length)
                        ? item.words.map(w => w.word)
                        : words;

                    displayList.forEach((word, index) => {
                        const span = document.createElement('span');
                        let stateClass = 'upcoming';
                        if (index < activeWordIndex) stateClass = 'sung';
                        else if (index === activeWordIndex) stateClass = 'active-word';
                        
                        span.className = `lyric-word ${stateClass}`;
                        span.style.setProperty('--word-index', index);
                        span.textContent = word + (index < displayList.length - 1 ? ' ' : '');
                        el.appendChild(span);
                    });
                } else {
                    el.textContent = rawText;
                }
                layer.appendChild(el);
            });
        }

        function sliceAudioBuffer(ctx, fullBuffer, startTime = 0, endTime = null) {
            const sampleRate = fullBuffer.sampleRate;
            const validStart = Math.max(0, Number(startTime) || 0);
            const validEnd = Math.min(fullBuffer.duration, Number.isFinite(endTime) && endTime > validStart ? Number(endTime) : fullBuffer.duration);
            
            const startSample = Math.floor(validStart * sampleRate);
            const endSample = Math.floor(validEnd * sampleRate);
            const sampleCount = Math.max(1, endSample - startSample);

            const sliced = ctx.createBuffer(fullBuffer.numberOfChannels, sampleCount, sampleRate);
            for (let c = 0; c < fullBuffer.numberOfChannels; c++) {
                const srcData = fullBuffer.getChannelData(c);
                const dstData = sliced.getChannelData(c);
                dstData.set(srcData.subarray(startSample, endSample));
            }
            return sliced;
        }

        function audioBufferToWavBase64(audioBuffer, maxSeconds = 90) {
            const targetSampleRate = 16000;
            const duration = Math.min(maxSeconds, audioBuffer.duration);
            const numSamples = Math.floor(duration * targetSampleRate);
            
            const inputChannels = [];
            for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                inputChannels.push(audioBuffer.getChannelData(c));
            }
            const monoSamples = new Float32Array(numSamples);
            const step = audioBuffer.sampleRate / targetSampleRate;
            
            for (let i = 0; i < numSamples; i++) {
                const srcIdx = Math.floor(i * step);
                let sum = 0;
                for (let c = 0; c < inputChannels.length; c++) {
                    sum += inputChannels[c][srcIdx] || 0;
                }
                monoSamples[i] = sum / inputChannels.length;
            }
            
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            
            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetSampleRate, true);
            view.setUint32(28, targetSampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, numSamples * 2, true);
            
            let offset = 44;
            for (let i = 0; i < numSamples; i++) {
                let s = Math.max(-1, Math.min(1, monoSamples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                offset += 2;
            }
            
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i += 8192) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
            }
            return btoa(binary);
        }

        async function getAudioBufferForAIProcessing() {
            const ctx = MusicEngine.getCtx();
            if (ctx && ctx.state === 'suspended') {
                try { await ctx.resume(); } catch (_) {}
            }
            
            const audioTrack = projectState.tracks.find(t => t.type === 'audio');
            const audioClips = audioTrack?.clips || [];
            const selectedAudioClip = (selectedClip && selectedClip.trackType === 'audio') ? selectedClip : null;
            const targetClip = selectedAudioClip || audioClips[0];
            const previewAudio = document.getElementById('previewAudio');
            const vid = document.getElementById('previewVideo');
            const projectId = getReliableProjectId();
            const scope = document.getElementById('overlayAudioSource')?.value || 'trimmed-clip';

            // 1. Check custom audio track
            if (targetClip || (previewAudio && previewAudio.src && (projectState.muteVideoAudio || !vid || !vid.src))) {
                let fullBuffer = null;
                if (previewAudio && previewAudio.src) {
                    try {
                        const res = await fetch(previewAudio.src);
                        const ab = await res.arrayBuffer();
                        fullBuffer = await new Promise((res, rej) => ctx.decodeAudioData(ab.slice(0), res, rej));
                    } catch (e) {
                        console.warn('Could not decode previewAudio.src directly:', e);
                    }
                }

                if (!fullBuffer && targetClip && targetClip.assetId && typeof AssetManager !== 'undefined') {
                    try {
                        const url = await AssetManager.getUrl(projectId, targetClip.assetId);
                        if (url) {
                            const res = await fetch(url);
                            const ab = await res.arrayBuffer();
                            fullBuffer = await new Promise((res, rej) => ctx.decodeAudioData(ab.slice(0), res, rej));
                        }
                    } catch (e) {}
                }

                if (fullBuffer) {
                    // Extract ONLY the trimmed portion that is placed in the video timeline!
                    if (scope === 'trimmed-clip' && targetClip) {
                        const trimStart = Number(targetClip.trimStart) || 0;
                        const trimEnd = Number.isFinite(targetClip.trimEnd) ? targetClip.trimEnd : fullBuffer.duration;
                        const timelineStart = Number(targetClip.start) || 0;
                        const sliced = sliceAudioBuffer(ctx, fullBuffer, trimStart, trimEnd);
                        return {
                            buffer: sliced,
                            sourceName: `${targetClip.name || 'Music'} (${trimStart.toFixed(1)}s - ${trimEnd.toFixed(1)}s)`,
                            timelineOffset: timelineStart,
                            isTrimmed: true
                        };
                    } else {
                        return { buffer: fullBuffer, sourceName: targetClip?.name || 'Added Music', timelineOffset: Number(targetClip?.start || 0) };
                    }
                }
            }

            // 2. Fallback to video audio track
            if (vid && vid.src && !projectState.muteVideoAudio) {
                try {
                    const res = await fetch(vid.src);
                    const ab = await res.arrayBuffer();
                    const fullBuf = await new Promise((res, rej) => ctx.decodeAudioData(ab.slice(0), res, rej));
                    const videoTrack = projectState.tracks.find(t => t.type === 'video');
                    const vClip = videoTrack?.clips?.[0];
                    if (scope === 'trimmed-clip' && vClip) {
                        const trimStart = Number(vClip.trimStart) || 0;
                        const trimEnd = Number.isFinite(vClip.trimEnd) ? vClip.trimEnd : fullBuf.duration;
                        const timelineStart = Number(vClip.start) || 0;
                        const sliced = sliceAudioBuffer(ctx, fullBuf, trimStart, trimEnd);
                        return {
                            buffer: sliced,
                            sourceName: `Video Track (${trimStart.toFixed(1)}s - ${trimEnd.toFixed(1)}s)`,
                            timelineOffset: timelineStart,
                            isTrimmed: true
                        };
                    }
                    return { buffer: fullBuf, sourceName: 'Video Audio', timelineOffset: 0 };
                } catch (e) {}
            }

            return null;
        }

        async function autoGenerateSongLyrics(providedBuffer = null, providedName = null) {
            let audioBuffer = providedBuffer;
            let sourceName = providedName;
            let timelineOffset = 0;

            if (!audioBuffer) {
                showToast('🎧 AI reading trimmed audio track...', '⏳');
                const result = await getAudioBufferForAIProcessing();
                if (!result || !result.buffer) {
                    return showToast('Please load or trim a music/video clip first!', '⚠️');
                }
                audioBuffer = result.buffer;
                sourceName = result.sourceName;
                timelineOffset = Number(result.timelineOffset) || 0;
            }

            const targetLang = document.getElementById('overlayLanguage')?.value || 'hinglish';
            const targetY = clamp(Number(document.getElementById('overlayY')?.value) || 82, 10, 95);
            const targetX = clamp(Number(document.getElementById('overlayX')?.value) || 50, 10, 90);
            const targetStyle = document.getElementById('overlayStyle')?.value || 'gradient';
            const targetColorA = document.getElementById('overlayColorA')?.value || '#f472b6';
            const targetColorB = document.getElementById('overlayColorB')?.value || '#38bdf8';
            const targetAnimation = document.getElementById('overlayAnimation')?.value || 'word-by-word';
            const targetSize = clamp(Number(document.getElementById('overlaySize')?.value) || 34, 16, 96);

            const langLabels = { hinglish: 'Hinglish', hindi: 'Hindi (हिन्दी)', english: 'English', auto: 'Auto-Detect' };
            showToast(`🤖 Gemini AI transcribing "${sourceName || 'music'}" [${langLabels[targetLang] || targetLang}]...`, '🎙️');

            try {
                const audioBase64 = audioBufferToWavBase64(audioBuffer, 90);
                const res = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'transcribe_audio',
                        audio: audioBase64,
                        mimeType: 'audio/wav',
                        language: targetLang
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Audio transcription failed');

                const lyrics = data.lyrics || [];
                if (!lyrics.length) {
                    showToast('No sung lyrics or speech detected in this trimmed music segment.', 'ℹ️', 'info');
                    return;
                }

                recordEdit();
                projectState.textOverlays ||= [];

                lyrics.forEach((item, idx) => {
                    const rawStart = Number(item.start) || 0;
                    const rawEnd = Number(item.end) || (rawStart + 2.5);
                    const start = Number((timelineOffset + rawStart).toFixed(2));
                    const end = Number((timelineOffset + rawEnd).toFixed(2));

                    // Offset individual words to line up exactly with timeline position
                    const words = (Array.isArray(item.words) ? item.words : []).map(w => ({
                        word: w.word,
                        start: Number((timelineOffset + Number(w.start || 0)).toFixed(2)),
                        end: Number((timelineOffset + Number(w.end || (w.start + 0.3))).toFixed(2))
                    }));

                    projectState.textOverlays.push({
                        id: `lyric-ai-${Date.now()}-${idx}`,
                        kind: 'lyric',
                        text: item.text,
                        words,
                        start,
                        end,
                        x: targetX,
                        y: targetY,
                        size: targetSize,
                        style: targetStyle,
                        colorA: targetColorA,
                        colorB: targetColorB,
                        animation: targetAnimation,
                        textFilter: 'glow'
                    });
                });

                renderTextOverlays();
                renderLyricsLayerList();
                requestTimelineRender();
                showToast(`✨ Generated ${lyrics.length} synced lyric layers for trimmed music!`, '🎤', 'success');
            } catch (err) {
                console.error('Lyric transcription error:', err);
                showToast(err.message || 'AI transcription failed. Check server logs.', '❌', 'error');
            }
        }

        function syncAudioPlayback(timelineTime, isPlaying) {
            const audioEl = document.getElementById('previewAudio');
            if (!audioEl) return;
            
            const audioTrack = projectState.tracks.find(t => t.type === 'audio');
            if (!audioTrack || !audioTrack.clips || !audioTrack.clips.length) {
                if (!audioEl.paused) audioEl.pause();
                return;
            }
            
            const activeAudioClip = audioTrack.clips.find(c => {
                const dur = (c.trimEnd || c.duration || 0) - (c.trimStart || 0);
                return timelineTime >= (c.start || 0) && timelineTime <= (c.start || 0) + dur;
            });
            
            if (activeAudioClip) {
                const clipOffset = timelineTime - (activeAudioClip.start || 0);
                const targetAudioTime = (activeAudioClip.trimStart || 0) + clipOffset;
                
                if (!audioEl.src && activeAudioClip.assetId) {
                    const pId = getReliableProjectId();
                    if (typeof AssetManager !== 'undefined') {
                        AssetManager.getUrl(pId, activeAudioClip.assetId).then(url => {
                            if (url && audioEl.src !== url) audioEl.src = url;
                        }).catch(() => {});
                    }
                }
                
                if (Math.abs(audioEl.currentTime - targetAudioTime) > 0.15) {
                    audioEl.currentTime = targetAudioTime;
                }
                
                const vol = (activeAudioClip.volume !== undefined ? activeAudioClip.volume : 1) * (projectState.musicVolume !== undefined ? projectState.musicVolume : 1);
                audioEl.volume = clamp(vol, 0, 1);
                
                if (isPlaying) {
                    if (audioEl.paused) {
                        audioEl.play().catch(() => {});
                    }
                } else {
                    if (!audioEl.paused) audioEl.pause();
                }
            } else {
                if (!audioEl.paused) audioEl.pause();
            }
        }

        async function importAudioFile(f) {
            if (!f) return;
            try {
                showToast('Importing & decoding audio file...', '⏳');
                const projectId = getReliableProjectId();
                const assetId = 'music-' + Date.now();
                const objectUrl = URL.createObjectURL(f);

                // 1. Persist asset to IndexedDB
                if (typeof ProjectService !== 'undefined' && ProjectService.saveAsset) {
                    try {
                        await ProjectService.saveAsset(projectId, assetId, f);
                    } catch (saveErr) {
                        console.warn('Could not persist audio asset:', saveErr);
                    }
                }

                let duration = 30;
                let bpm = 120;

                // 2. Resilient audio decoding with multiple fallbacks
                try {
                    const arrayBuffer = await f.arrayBuffer();
                    const ctx = MusicEngine.getCtx();
                    if (ctx && ctx.state === 'suspended') {
                        try { await ctx.resume(); } catch (_) {}
                    }
                    
                    const audioBuffer = await new Promise((resolve, reject) => {
                        try {
                            const p = ctx.decodeAudioData(
                                arrayBuffer.slice(0),
                                buf => resolve(buf),
                                err => reject(err)
                            );
                            if (p && typeof p.then === 'function') {
                                p.then(resolve).catch(reject);
                            }
                        } catch (e) {
                            reject(e);
                        }
                    });

                    if (audioBuffer && Number.isFinite(audioBuffer.duration) && audioBuffer.duration > 0) {
                        duration = audioBuffer.duration;
                        try {
                            bpm = MusicEngine.analyze_bpm(audioBuffer);
                        } catch (_) {}
                    }
                } catch (decodeErr) {
                    console.warn('WebAudio decodeAudioData failed, using HTML5 Audio fallback:', decodeErr);
                    duration = await new Promise(resolve => {
                        const tempAudio = new Audio();
                        tempAudio.preload = 'metadata';
                        tempAudio.onloadedmetadata = () => resolve(tempAudio.duration > 0 ? tempAudio.duration : 30);
                        tempAudio.onerror = () => resolve(30);
                        tempAudio.src = objectUrl;
                    });
                }

                // 3. Add to Audio track
                let track = projectState.tracks.find(t => t.type === 'audio');
                if (!track) {
                    track = { id: 'track-a-' + Date.now(), type: 'audio', name: 'Music 1', clips: [] };
                    projectState.tracks.push(track);
                }

                recordEdit();
                const newClip = {
                    id: 'm-' + Date.now(),
                    assetId,
                    name: f.name || 'Custom Audio',
                    type: 'music',
                    start: 0,
                    duration: duration,
                    trimStart: 0,
                    trimEnd: duration,
                    volume: 1.0,
                    fadeIn: 0,
                    fadeOut: 0,
                    color: 'rgba(236,72,153,0.35)',
                    borderColor: 'rgba(236,72,153,0.6)'
                };
                track.clips.push(newClip);

                // 4. Set live preview audio
                const previewAudio = document.getElementById('previewAudio');
                if (previewAudio) {
                    previewAudio.src = objectUrl;
                    previewAudio.volume = clamp(projectState.musicVolume !== undefined ? projectState.musicVolume : 1, 0, 1);
                }

                const vid = document.getElementById('previewVideo');
                const idleEl = document.getElementById('previewIdle');
                const ctrlEl = document.getElementById('previewControls');

                // If no video, make controls and visualizer available
                if (!vid || !vid.src) {
                    if (idleEl) {
                        idleEl.innerHTML = `
                            <div style="font-size:2.8rem; margin-bottom:8px;">🎵</div>
                            <p style="font-weight:700; color:#fff; font-size:1rem; margin-bottom:4px;">${f.name}</p>
                            <p style="font-size:0.75rem; color:var(--text-muted);">Audio Track Active • ${formatTime(duration)}</p>
                            <button class="btn btn-ghost" style="margin-top:14px; font-size:0.75rem; padding:6px 14px;" onclick="document.getElementById('fileInput').click()">＋ Add Video or Background</button>
                        `;
                    }
                    if (ctrlEl) ctrlEl.style.display = 'flex';
                } else {
                    setVideoAudioMuted(true);
                }

                const bpmVal = document.getElementById('bpmVal');
                if (bpmVal && bpm) bpmVal.textContent = Math.round(bpm);

                requestTimelineRender();
                syncMusicUIToState();

                if (vid && vid.src) {
                    showToast(`🎵 Music added & video muted! Generating synced lyric layers from "${f.name}"...`, '🎤', 'info');
                    // Automatically generate animated karaoke lyric layers from the added music
                    autoGenerateSongLyrics(audioBuffer || null, f.name);
                } else {
                    showToast(`🎵 Custom audio "${f.name}" imported successfully!`, '✅', 'success');
                }
            } catch (err) {
                console.error('Failed to import audio:', err);
                showToast('Failed to import audio file. Please try another MP3 or WAV file.', '⚠️');
            }
        }

        async function loadVideo(e) {
            const f = e.target?.files?.[0];
            if (!f) return;

            // If an audio file was selected in the main file picker, route to audio importer
            if (f.type.startsWith('audio') || f.name.match(/\.(mp3|wav|m4a|aac|ogg|flac|mpa|mpeg|mpg)$/i) || f.type === 'audio/mpeg') {
                await importAudioFile(f);
                e.target.value = '';
                return;
            }

            const assetId = 'v' + Date.now();
            const projectId = getReliableProjectId();
            if (typeof ProjectService !== 'undefined' && ProjectService.saveAsset) {
                await ProjectService.saveAsset(projectId, assetId, f);
            }
            const url = URL.createObjectURL(f);
            const vid = document.getElementById('previewVideo');
            if (vid) {
                vid.src = url;
                vid.style.display = 'block';
                const idleEl = document.getElementById('previewIdle');
                if (idleEl) idleEl.style.display = 'none';
                const ctrlEl = document.getElementById('previewControls');
                if (ctrlEl) ctrlEl.style.display = 'flex';
                
                vid.addEventListener('loadedmetadata', async () => {
                    let track = projectState.tracks.find(t => t.type === 'video');
                    if (!track) {
                        track = { id: 'track-v' + Date.now(), type: 'video', name: 'Video 1', clips: [] };
                        projectState.tracks.unshift(track);
                    }
                    const duration = vid.duration || 5;
                    track.clips.push({
                        id: 'c' + Date.now(),
                        assetId,
                        name: f.name,
                        type: f.type.startsWith('image') ? 'image' : 'video',
                        start: 0,
                        duration: duration,
                        trimStart: 0,
                        trimEnd: duration,
                        volume: 1,
                        color: 'rgba(139,92,246,0.3)',
                        borderColor: 'rgba(139,92,246,0.5)'
                    });

                    // Automatically extract & add background audio from video if not image
                    if (!f.type.startsWith('image')) {
                        try {
                            const buffer = await MusicEngine.getCtx().decodeAudioData(await f.arrayBuffer());
                            let aTrack = projectState.tracks.find(t => t.type === 'audio');
                            if (!aTrack) {
                                aTrack = { id: 'track-a1', type: 'audio', name: 'Audio 1', clips: [] };
                                projectState.tracks.push(aTrack);
                            }
                            aTrack.clips.push({
                                id: 'm-auto-' + Date.now(),
                                assetId: 'audio-' + assetId,
                                name: f.name.replace(/\.[^/.]+$/, '') + ' (Audio)',
                                type: 'music',
                                start: 0,
                                duration: buffer.duration,
                                trimStart: 0,
                                trimEnd: buffer.duration,
                                volume: 1.0,
                                color: 'rgba(236,72,153,0.3)',
                                borderColor: 'rgba(236,72,153,0.5)'
                            });
                            const bpm = MusicEngine.analyze_bpm(buffer);
                            const bpmVal = document.getElementById('bpmVal');
                            if (bpmVal) bpmVal.textContent = Math.round(bpm);
                        } catch (_) {
                            // Video might have no audio track, silently continue
                        }
                    }

                    syncMusicUIToState();
                    requestTimelineRender();
                    showToast('Media loaded & audio synced!', '🎬', 'success');
                }, { once: true });
            }
        }

        function stepForward() {

        function getTimelineTotalDuration() {
            let maxEnd = 0;
            projectState.tracks.forEach(track => {
                track.clips.forEach(clip => {
                    const srcDur = getClipSourceDuration(clip);
                    const trimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
                    const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : srcDur;
                    const dur = Math.max(0.01, trimEnd - trimStart);
                    const end = (clip.start || 0) + dur;
                    if (end > maxEnd) maxEnd = end;
                });
            });
            return Math.max(maxEnd, 0.5);
        }

        function getActivePlayingClip() {
            const vid = document.getElementById('previewVideo');
            if (!vid) return null;
            const time = vid.currentTime;
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (!videoTrack || !videoTrack.clips.length) return null;
            
            const clip = videoTrack.clips.find(c => {
                const start = c.trimStart || 0;
                const end = c.trimEnd || c.duration || 9999;
                return time >= start - 0.05 && time <= end + 0.05;
            });
            return clip || videoTrack.clips[0];
        }

        function seekVideo(val) {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            const totalDur = getTimelineTotalDuration();
            const targetTimelineTime = (parseFloat(val) / 100) * totalDur;
            
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (videoTrack && videoTrack.clips.length) {
                let targetClip = videoTrack.clips.find(c => {
                    const dur = (c.trimEnd || c.duration || 1) - (c.trimStart || 0);
                    return targetTimelineTime >= (c.start || 0) && targetTimelineTime <= (c.start || 0) + dur;
                });
                if (!targetClip) {
                    targetClip = videoTrack.clips.reduce((nearest, c) => {
                        return Math.abs((c.start || 0) - targetTimelineTime) < Math.abs((nearest.start || 0) - targetTimelineTime) ? c : nearest;
                    }, videoTrack.clips[0]);
                }
                if (targetClip) {
                    const rel = Math.max(0, targetTimelineTime - (targetClip.start || 0));
                    vid.currentTime = (targetClip.trimStart || 0) + rel;
                    syncAudioPlayback(targetTimelineTime, !vid.paused);
                    return;
                }
            }
            if (Number.isFinite(vid.duration) && vid.duration > 0) {
                vid.currentTime = (parseFloat(val) / 100) * vid.duration;
            }
            syncAudioPlayback(targetTimelineTime, !vid.paused);
        }

        function toggleMute() {
            const vid = document.getElementById('previewVideo');
            if (vid) {
                vid.muted = !vid.muted;
                const muteBtn = document.getElementById('muteBtn');
                if (muteBtn) muteBtn.classList.toggle('active', vid.muted);
            }
        }

        function togglePlay() {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            if (vid.paused) {
                const activeClip = getActivePlayingClip();
                if (activeClip) {
                    const srcDur = getClipSourceDuration(activeClip);
                    const trimStart = Number.isFinite(activeClip.trimStart) ? activeClip.trimStart : 0;
                    const trimEnd = Number.isFinite(activeClip.trimEnd) ? activeClip.trimEnd : srcDur;
                    if (vid.currentTime < trimStart || vid.currentTime >= trimEnd - 0.05) {
                        vid.currentTime = trimStart;
                    }
                }
                vid.play().catch(() => {});
                ensurePlaybackAnimationLoop();
                const totalDur = getTimelineTotalDuration();
                let timelineCurrent = 0;
                if (activeClip) {
                    const trimStart = activeClip.trimStart || 0;
                    timelineCurrent = (activeClip.start || 0) + Math.max(0, vid.currentTime - trimStart);
                } else {
                    timelineCurrent = vid.currentTime;
                }
                syncAudioPlayback(timelineCurrent, true);
            } else {
                vid.pause();
                syncAudioPlayback(0, false);
            }
        }

            const kr = document.getElementById('keyframeRotation');
            const ko = document.getElementById('keyframeOpacity');
            if (preset === 'center') { if(kx) kx.value=0; if(ky) ky.value=0; if(ks) ks.value=100; if(kr) kr.value=0; if(ko) ko.value=100; }
            else if (preset === 'top-left') { if(kx) kx.value=-35; if(ky) ky.value=-35; }
            else if (preset === 'top-right') { if(kx) kx.value=35; if(ky) ky.value=-35; }
            else if (preset === 'bottom-left') { if(kx) kx.value=-35; if(ky) ky.value=35; }
            else if (preset === 'bottom-right') { if(kx) kx.value=35; if(ky) ky.value=35; }
            else if (preset === 'zoom') { if(ks) ks.value=150; }
            ['kfXVal','kfYVal','kfScaleVal','kfRotVal','kfOpacVal'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                if(id==='kfXVal' && kx) el.textContent = kx.value + '%';
                if(id==='kfYVal' && ky) el.textContent = ky.value + '%';
                if(id==='kfScaleVal' && ks) el.textContent = ks.value + '%';
                if(id==='kfRotVal' && kr) el.textContent = kr.value + '°';
                if(id==='kfOpacVal' && ko) el.textContent = ko.value + '%';
            });
        }

        function setSpeedGUI(val) {
            const sInput = document.getElementById('speedValue');
            const rInput = document.getElementById('speedValueRange');
            const label = document.getElementById('speedValLabel');
            if (sInput) sInput.value = val;
            if (rInput) rInput.value = val;
            if (label) label.textContent = val + '×';
        }

        function updateSpeedValLabel(val) {
            const sInput = document.getElementById('speedValue');
            const label = document.getElementById('speedValLabel');
            if (sInput) sInput.value = val;
            if (label) label.textContent = val + '×';
        }
        
        function exportProject() {
            document.getElementById('exportModal').classList.add('active');
            document.getElementById('exportOptions').style.display = 'grid';
            document.getElementById('startExportBtn').style.display = 'flex';
            document.getElementById('cancelExportBtn').textContent = 'Close';
            document.getElementById('exportStatus').textContent = 'Choose settings, then render directly in your browser with FFmpeg.wasm.';
        }

        function cancelExport() {
            document.getElementById('exportModal').classList.remove('active');
        }

        async function startExportWithOptions() {
            const startButton = document.getElementById('startExportBtn');
            if (startButton) startButton.style.display = 'none';
            document.getElementById('exportOptions').style.display = 'none';
            document.getElementById('cancelExportBtn').textContent = 'Cancel Export';
            document.getElementById('exportStatus').textContent = 'Preparing assets...';
            await window.handleEditorExport({
                format: 'mp4',
                presetPlatform: document.getElementById('exportPresetPlatform')?.value || 'standard',
                resolution: document.getElementById('exportResolution').value,
                quality: document.getElementById('exportQuality').value,
                audioBitrate: document.getElementById('exportAudioBitrate').value,
                fps: document.getElementById('exportFps').value
            });
            document.getElementById('exportStatus').textContent = 'Render complete.';
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const id = new URLSearchParams(window.location.search).get('id');
            if (id) {
                // M3 FIX: guard against deleted/malformed project IDs
                currentProject = ProjectService.getProject(id);
                if (!currentProject) {
                    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#fff;background:#0a0a0f;flex-direction:column;gap:16px"><h2>Project not found</h2><p>This project may have been deleted or the link is invalid.</p><a href="dashboard.html" style="color:#8b5cf6">Back to Dashboard</a></div>';
                    return;
                }
                if (currentProject.projectState && Array.isArray(currentProject.projectState.tracks)) {
                    projectState = currentProject.projectState;
                }
                projectState.textOverlays ||= [];
                window.currentProject = currentProject;
                window.projectState = projectState;
                const v = projectState.tracks.find(t=>t.type==='video')?.clips[0];
                if(v) {
                    const vid = document.getElementById('previewVideo');
                    vid.src = await AssetManager.getUrl(id, v.assetId);
                    vid.addEventListener('loadedmetadata', () => {
                        const duration = vid.duration;
                        if (Number.isFinite(duration) && duration > 0) {
                            v.duration = duration;
                            if (!Number.isFinite(v.trimEnd) || v.trimEnd <= 1) v.trimEnd = duration;
                            requestTimelineRender();
                        }
                    }, { once: true });
                    vid.style.display = 'block';
                    document.getElementById('previewIdle').style.display = 'none';
                    document.getElementById('previewControls').style.display = 'flex';
                }
            }
            setTimelineZoom(timelineZoom);
            updateHistoryButtons();
            renderTimeline();
            setTool('select');

            // --- Drag and Drop support for Audio & Video ---
            const dropTargets = [document.getElementById('previewScreen'), document.getElementById('timelineScrollArea')];
            dropTargets.forEach(target => {
                if (!target) return;
                target.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    target.classList.add('drag-active');
                });
                target.addEventListener('dragleave', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    target.classList.remove('drag-active');
                });
                target.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    target.classList.remove('drag-active');
                    const files = Array.from(e.dataTransfer?.files || []);
                    for (const f of files) {
                        if (f.type.startsWith('audio') || f.name.match(/\.(mp3|wav|m4a|aac|ogg|flac|mpa|mpeg|mpg)$/i) || f.type === 'audio/mpeg') {
                            await importAudioFile(f);
                        } else {
                            await loadVideo({ target: { files: [f] } });
                        }
                    }
                });
            });
        });

        let timeUpdateQueued = false;
        document.getElementById('previewVideo').ontimeupdate = () => {
            if (timeUpdateQueued) return;
            timeUpdateQueued = true;
            requestAnimationFrame(() => {
                timeUpdateQueued = false;
                const vid = document.getElementById('previewVideo');
                if (!vid) return;

                const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
                const activeClip = getActivePlayingClip();
                
                if (activeClip && videoTrack) {
                    const srcDur = getClipSourceDuration(activeClip);
                    const trimStart = Number.isFinite(activeClip.trimStart) ? activeClip.trimStart : 0;
                    const trimEnd = Number.isFinite(activeClip.trimEnd) ? activeClip.trimEnd : srcDur;
                    
                    if (vid.currentTime >= trimEnd - 0.02 && !vid.paused) {
                        const clipIndex = videoTrack.clips.indexOf(activeClip);
                        const nextClip = videoTrack.clips[clipIndex + 1];
                        if (nextClip) {
                            vid.currentTime = nextClip.trimStart || 0;
                        } else {
                            vid.pause();
                            vid.currentTime = trimEnd;
                        }
                    }
                }

                const totalDur = getTimelineTotalDuration();
                let timelineCurrent = 0;
                if (activeClip) {
                    const trimStart = activeClip.trimStart || 0;
                    timelineCurrent = (activeClip.start || 0) + Math.max(0, vid.currentTime - trimStart);
                } else {
                    timelineCurrent = vid.currentTime;
                }
                
                const progress = totalDur > 0 ? clamp(timelineCurrent / totalDur, 0, 1) : 0;
                const scrubber = document.getElementById('scrubber');
                if (scrubber) scrubber.value = progress * 100;
                
                const timeDisplay = document.getElementById('timeDisplay');
                if (timeDisplay) timeDisplay.textContent = formatTime(timelineCurrent) + ' / ' + formatTime(totalDur);
                
                document.querySelectorAll('.lane-playhead').forEach(el => {
                    el.style.left = clamp((timelineCurrent / MAX_TIMELINE_SECONDS) * 100, 0, 100) + '%';
                });
                
                updatePreviewVisuals();
                renderTextOverlays();
                syncAudioPlayback(timelineCurrent, !vid.paused);
            });
        };

        // --- AI Editor Functions ---
        function setEditMode(mode) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            if (mode === 'manual') {
                document.getElementById('modeManual').classList.add('active');
                document.getElementById('manualPropsBody').style.display = 'block';
                document.getElementById('aiToolsPanel').style.display = 'none';
            } else {
                document.getElementById('modeAI').classList.add('active');
                document.getElementById('manualPropsBody').style.display = 'none';
                document.getElementById('aiToolsPanel').style.display = 'block';
            }
        }

        let activeAITool = null;
        function toggleAITool(el, toolName) {
            document.querySelectorAll('.ai-tool-card').forEach(card => card.classList.remove('active'));
            if (activeAITool !== toolName) {
                el.classList.add('active');
                activeAITool = toolName;
            } else {
                activeAITool = null;
            }
        }

        async function runAIProcessing() {
            if (!activeAITool) {
                showToast('Please select an AI tool first.', '⚠️', 'error');
                return;
            }
            
            showToast('Asking Gemini AI...', '🤖');
            
            try {
                let prompt = "Suggest some generic creative edits for a video.";
                if (activeAITool === 'reframe') {
                    prompt = "I have a landscape video. Provide step-by-step instructions on how to use AI to track the main subject and crop it to a 9:16 vertical format for TikTok. Keep it brief.";
                }
                
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                alert("Gemini AI Says:\n\n" + data.text);
                showToast('AI processing complete.', '✅', 'success');
                
            } catch (error) {
                console.error('Error calling AI:', error);
                showToast('Failed to reach AI. Check server logs.', '❌', 'error');
            }
        }

</script>
