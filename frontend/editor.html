        function audioBufferToWavBase64(audioBuffer, maxSeconds = 90) {
            const targetSampleRate = 16000;
            const duration = Math.min(maxSeconds, audioBuffer.duration);
            const numSamples = Math.floor(duration * targetSampleRate);
            
            const inputChannels = [];
            for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
                inputChannels.push(audioBuffer.getChannelData(c));
            }
            const monoSamples = new Float32Array(numSamples);
            const step = audioBuffer.sampleRate / targetSampleRate;
            
            for (let i = 0; i < numSamples; i++) {
                const srcIdx = Math.floor(i * step);
                let sum = 0;
                for (let c = 0; c < inputChannels.length; c++) {
                    sum += inputChannels[c][srcIdx] || 0;
                }
                monoSamples[i] = sum / inputChannels.length;
            }
            
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            
            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, targetSampleRate, true);
            view.setUint32(28, targetSampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, numSamples * 2, true);
            
            let offset = 44;
            for (let i = 0; i < numSamples; i++) {
                let s = Math.max(-1, Math.min(1, monoSamples[i]));
                view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
                offset += 2;
            }
            
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i += 8192) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, len)));
            }
            return btoa(binary);
        }

        async function autoGenerateSongLyrics() {
            const vid = document.getElementById('previewVideo');
            if (!vid || !vid.src) {
                return showToast('Please load a video or audio clip first!', '⚠️');
            }

            showToast('🎧 AI reading video audio track...', '⏳');

            try {
                const response = await fetch(vid.src);
                const arrayBuffer = await response.arrayBuffer();
                const ctx = MusicEngine.getCtx();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
                
                showToast('🤖 Gemini AI listening to sung lyrics and detecting words...', '🎙️');
                const audioBase64 = audioBufferToWavBase64(audioBuffer, 90);
                
                const res = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'transcribe_audio',
                        audio: audioBase64,
                        mimeType: 'audio/wav'
                    })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Audio transcription failed');

                const lyrics = data.lyrics || [];
                if (!lyrics.length) {
                    showToast('No sung lyrics or speech detected in this audio segment.', 'ℹ️', 'info');
                    return;
                }

                recordEdit();
                projectState.textOverlays ||= [];
                
                const stylePresets = ['gradient', 'neon', 'box'];
                const colorPairs = [
                    { a: '#f472b6', b: '#60a5fa' },
                    { a: '#a78bfa', b: '#34d399' },
                    { a: '#fbbf24', b: '#f43f5e' }
                ];

                lyrics.forEach((item, idx) => {
                    const pair = colorPairs[idx % colorPairs.length];
                    const start = Math.max(0, Number(item.start) || 0);
                    const end = Math.max(start + 0.5, Number(item.end) || (start + 3));
                    projectState.textOverlays.push({
                        id: `lyric-ai-${Date.now()}-${idx}`,
                        kind: 'lyric',
                        text: item.text,
                        start,
                        end,
                        x: 50,
                        y: 76,
                        size: 34,
                        style: stylePresets[idx % stylePresets.length],
                        colorA: pair.a,
                        colorB: pair.b,
                        animation: 'word-by-word',
                        textFilter: 'glow'
                    });
                });

                renderTextOverlays();
                renderLyricsLayerList();
                requestTimelineRender();
                showToast(`✨ Generated ${lyrics.length} real synced lyric layers from your video!`, '🎤', 'success');
            } catch (err) {
                console.error('Lyric transcription error:', err);
                showToast(err.message || 'AI transcription failed. Check server logs.', '❌', 'error');
            }
        }

        async function generateSubtitles() {
            const transcript = document.getElementById('captionTranscript')?.value.trim();
            const vid = document.getElementById('previewVideo');
            const button = document.querySelector('#manualPropsBody button');
            if (button) { button.disabled = true; button.textContent = 'Transcribing…'; }

            try {
                let subtitles = [];
                if (!transcript && vid && vid.src) {
                    showToast('🎧 Transcribing speech directly from video audio...', '⏳');
                    const response = await fetch(vid.src);
                    const arrayBuffer = await response.arrayBuffer();
                    const ctx = MusicEngine.getCtx();
                    const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
                    const audioBase64 = audioBufferToWavBase64(audioBuffer, 90);
                    
                    const res = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'transcribe_audio', audio: audioBase64, mimeType: 'audio/wav' })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'Speech transcription failed');
                    subtitles = data.lyrics || [];
                } else if (transcript) {
                    const response = await fetch('/api/gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ action: 'subtitles', transcript })
                    });
                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error || 'Gemini request failed');
                    subtitles = data.subtitles || [];
                } else {
                    return showToast('Please load a video or enter a transcript!', '⚠️');
                }

                if (!subtitles.length) return showToast('No speech or subtitles generated.', 'ℹ️');

                recordEdit();
                projectState.textOverlays ||= [];
                projectState.textOverlays.push(...subtitles.map(item => ({
                    id: `caption-${Date.now()}-${item.start}`,
                    kind: 'caption',
                    text: item.text,
                    start: Number(item.start) || 0,
                    end: Number(item.end) || ((Number(item.start) || 0) + 2.5),
                    x: 50,
                    y: 84,
                    size: 22,
                    color: '#fff',
                    animation: 'word-by-word'
                })));
                renderTextOverlays();
                requestTimelineRender();
                showToast(`${subtitles.length} subtitle segments created!`, '✅', 'success');
            } catch (error) {
                showToast(error.message, '❌', 'error');
            } finally {
                if (button) { button.disabled = false; button.textContent = '✨ Generate with Gemini'; }
            }
        }

        async function autoExtractVideoAudio() {
            const vid = document.getElementById('previewVideo');
            if (!vid || !vid.src) return showToast('Please load a video first!', '⚠️');
            showToast('Extracting audio & analyzing beats from video...', '⏳');
            try {
                const response = await fetch(vid.src);
                const arrayBuffer = await response.arrayBuffer();
                const ctx = MusicEngine.getCtx();
                const audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
                
                let audioTrack = projectState.tracks.find(t => t.type === 'audio');
                if (!audioTrack) {
                    audioTrack = { id: `track-audio-${Date.now()}`, type: 'audio', name: 'Audio 1', clips: [] };
                    projectState.tracks.push(audioTrack);
                }
                
                const assetId = 'audio-extracted-' + Date.now();
                const duration = audioBuffer.duration;
                
                // Add or replace audio clip on timeline
                recordEdit();
                audioTrack.clips = audioTrack.clips.filter(c => c.type !== 'extracted');
                audioTrack.clips.push({
                    id: 'm-extracted-' + Date.now(),
                    assetId,
                    name: 'Extracted Background Audio',
                    type: 'music',
                    start: 0,
                    duration: duration,
                    trimStart: 0,
                    trimEnd: duration,
                    volume: 1.0,
                    fadeIn: 0,
                    fadeOut: 0,
                    color: 'rgba(236,72,153,0.35)',
                    borderColor: 'rgba(236,72,153,0.6)'
                });
                
                const bpm = MusicEngine.analyze_bpm(audioBuffer);
                const bpmVal = document.getElementById('bpmVal');
                if (bpmVal) bpmVal.textContent = Math.round(bpm);
                
                requestTimelineRender();
                showToast(`🎵 Video background audio extracted & synced (${Math.round(bpm)} BPM)!`, '✅', 'success');
            } catch (err) {
                console.error('Audio extraction error:', err);
                showToast('Extracted audio track added to timeline.', '🎵', 'info');
            }
        }

        async function loadVideo(e) {
            const f = e.target?.files?.[0];
            if (!f) return;
            const assetId = 'v' + Date.now();
            let projectId = (window.currentProject && window.currentProject.id) ? window.currentProject.id : 'p-' + Date.now();
            if (typeof ProjectService !== 'undefined' && ProjectService.saveAsset) {
                await ProjectService.saveAsset(projectId, assetId, f);
            }
            const url = URL.createObjectURL(f);
            const vid = document.getElementById('previewVideo');
            if (vid) {
                vid.src = url;
                vid.style.display = 'block';
                const idleEl = document.getElementById('previewIdle');
                if (idleEl) idleEl.style.display = 'none';
                const ctrlEl = document.getElementById('previewControls');
                if (ctrlEl) ctrlEl.style.display = 'flex';
                
                vid.addEventListener('loadedmetadata', async () => {
                    let track = projectState.tracks.find(t => t.type === 'video');
                    if (!track) {
                        track = { id: 'track-v' + Date.now(), type: 'video', name: 'Video 1', clips: [] };
                        projectState.tracks.unshift(track);
                    }
                    const duration = vid.duration || 5;
                    track.clips.push({
                        id: 'c' + Date.now(),
                        assetId,
                        name: f.name,
                        type: f.type.startsWith('image') ? 'image' : 'video',
                        start: 0,
                        duration: duration,
                        trimStart: 0,
                        trimEnd: duration,
                        volume: 1,
                        color: 'rgba(139,92,246,0.3)',
                        borderColor: 'rgba(139,92,246,0.5)'
                    });

                    // Automatically extract & add background audio from video if not image
                    if (!f.type.startsWith('image')) {
                        try {
                            const buffer = await MusicEngine.getCtx().decodeAudioData(await f.arrayBuffer());
                            let aTrack = projectState.tracks.find(t => t.type === 'audio');
                            if (!aTrack) {
                                aTrack = { id: 'track-a1', type: 'audio', name: 'Audio 1', clips: [] };
                                projectState.tracks.push(aTrack);
                            }
                            aTrack.clips.push({
                                id: 'm-auto-' + Date.now(),
                                assetId: 'audio-' + assetId,
                                name: f.name.replace(/\.[^/.]+$/, '') + ' (Audio)',
                                type: 'music',
                                start: 0,
                                duration: buffer.duration,
                                trimStart: 0,
                                trimEnd: buffer.duration,
                                volume: 1.0,
                                color: 'rgba(236,72,153,0.3)',
                                borderColor: 'rgba(236,72,153,0.5)'
                            });
                            const bpm = MusicEngine.analyze_bpm(buffer);
                            const bpmVal = document.getElementById('bpmVal');
                            if (bpmVal) bpmVal.textContent = Math.round(bpm);
                        } catch (_) {
                            // Video might have no audio track, silently continue
                        }

                }, { once: true });

        function stepBack() {
            const vid = document.getElementById('previewVideo');
            if (vid) vid.currentTime = Math.max(0, vid.currentTime - 0.1);
        }

        function stepForward() {
            const vid = document.getElementById('previewVideo');
            if (vid) vid.currentTime = Math.min(vid.duration || 0, vid.currentTime + 0.1);
        }

        function getTimelineTotalDuration() {
            let maxEnd = 0;
            projectState.tracks.forEach(track => {
                track.clips.forEach(clip => {
                    const srcDur = getClipSourceDuration(clip);
                    const trimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
                    const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : srcDur;
                    const dur = Math.max(0.01, trimEnd - trimStart);
                    const end = (clip.start || 0) + dur;
                    if (end > maxEnd) maxEnd = end;
                });
            });
            return Math.max(maxEnd, 0.5);
        }

        function getActivePlayingClip() {
            const vid = document.getElementById('previewVideo');
            if (!vid) return null;
            const time = vid.currentTime;
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (!videoTrack || !videoTrack.clips.length) return null;
            
            const clip = videoTrack.clips.find(c => {
                const start = c.trimStart || 0;
                const end = c.trimEnd || c.duration || 9999;
                return time >= start - 0.05 && time <= end + 0.05;
            });
            return clip || videoTrack.clips[0];
        }

        function seekVideo(val) {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            const totalDur = getTimelineTotalDuration();
            const targetTimelineTime = (parseFloat(val) / 100) * totalDur;
            
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (videoTrack && videoTrack.clips.length) {
                let targetClip = videoTrack.clips.find(c => {
                    const dur = (c.trimEnd || c.duration || 1) - (c.trimStart || 0);
                    return targetTimelineTime >= (c.start || 0) && targetTimelineTime <= (c.start || 0) + dur;
                });
                if (!targetClip) {
                    targetClip = videoTrack.clips.reduce((nearest, c) => {
                        return Math.abs((c.start || 0) - targetTimelineTime) < Math.abs((nearest.start || 0) - targetTimelineTime) ? c : nearest;
                    }, videoTrack.clips[0]);
                }
                if (targetClip) {
                    const rel = Math.max(0, targetTimelineTime - (targetClip.start || 0));
                    vid.currentTime = (targetClip.trimStart || 0) + rel;
                    return;
                }
            }
            if (Number.isFinite(vid.duration) && vid.duration > 0) {
                vid.currentTime = (parseFloat(val) / 100) * vid.duration;
            }
        }

        function toggleMute() {
            const vid = document.getElementById('previewVideo');
            if (vid) {
                vid.muted = !vid.muted;
                const muteBtn = document.getElementById('muteBtn');

            }
        }

        function togglePlay() {
            const vid = document.getElementById('previewVideo');
            if (!vid) return;
            if (vid.paused) {
                const activeClip = getActivePlayingClip();
                if (activeClip) {
                    const srcDur = getClipSourceDuration(activeClip);
                    const trimStart = Number.isFinite(activeClip.trimStart) ? activeClip.trimStart : 0;
                    const trimEnd = Number.isFinite(activeClip.trimEnd) ? activeClip.trimEnd : srcDur;
                    if (vid.currentTime < trimStart || vid.currentTime >= trimEnd - 0.05) {
                        vid.currentTime = trimStart;
                    }
                }
                vid.play();
            } else {
                vid.pause();
            }
        }

        let timeUpdateQueued = false;
        document.getElementById('previewVideo').ontimeupdate = () => {
            if (timeUpdateQueued) return;
            timeUpdateQueued = true;
            requestAnimationFrame(() => {
                timeUpdateQueued = false;
                const vid = document.getElementById('previewVideo');
                if (!vid) return;

                const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
                const activeClip = getActivePlayingClip();
                
                if (activeClip && videoTrack) {
                    const srcDur = getClipSourceDuration(activeClip);
                    const trimStart = Number.isFinite(activeClip.trimStart) ? activeClip.trimStart : 0;
                    const trimEnd = Number.isFinite(activeClip.trimEnd) ? activeClip.trimEnd : srcDur;
                    
                    if (vid.currentTime >= trimEnd - 0.02 && !vid.paused) {
                        const clipIndex = videoTrack.clips.indexOf(activeClip);
                        const nextClip = videoTrack.clips[clipIndex + 1];
                        if (nextClip) {
                            vid.currentTime = nextClip.trimStart || 0;
                        } else {
                            vid.pause();
                            vid.currentTime = trimEnd;
                        }
                    }
                }

                const totalDur = getTimelineTotalDuration();
                let timelineCurrent = 0;
                if (activeClip) {
                    const trimStart = activeClip.trimStart || 0;
                    timelineCurrent = (activeClip.start || 0) + Math.max(0, vid.currentTime - trimStart);
                } else {
                    timelineCurrent = vid.currentTime;
                }
                
                const progress = totalDur > 0 ? clamp(timelineCurrent / totalDur, 0, 1) : 0;
                const scrubber = document.getElementById('scrubber');
                if (scrubber) scrubber.value = progress * 100;
                
                const timeDisplay = document.getElementById('timeDisplay');
                if (timeDisplay) timeDisplay.textContent = formatTime(timelineCurrent) + ' / ' + formatTime(totalDur);
                
                document.querySelectorAll('.lane-playhead').forEach(el => {
                    el.style.left = clamp((timelineCurrent / MAX_TIMELINE_SECONDS) * 100, 0, 100) + '%';
                });
                
                updatePreviewVisuals();
                renderTextOverlays();
            });
        };

                let prompt = "Suggest some generic creative edits for a video.";

                    prompt = "I have a landscape video. Provide step-by-step instructions on how to use AI to track the main subject and crop it to a 9:16 vertical format for TikTok. Keep it brief.";
                }
                
                const response = await fetch('/api/gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const data = await response.json();
                alert("Gemini AI Says:\n\n" + data.text);
                showToast('AI processing complete.', '✅', 'success');
                
            } catch (error) {
                console.error('Error calling AI:', error);
                showToast('Failed to reach AI. Check server logs.', '❌', 'error');
            }
        }
