<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Editor — Clip Magic</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ── Layout ── */
        body {
            overflow: hidden;
        }

        .editor-shell {
            display: grid;
            grid-template-rows: 52px 1fr;
            grid-template-columns: 56px 1fr 280px;
            height: 100vh;
            padding-top: 0;
        }

        /* ── Top Bar ── */
        .editor-topbar {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 16px;
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .topbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .topbar-logo-icon {
            width: 30px;
            height: 30px;
            background: var(--gradient-main);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .topbar-logo-text {
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: var(--gradient-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .topbar-divider {
            width: 1px;
            height: 28px;
            background: var(--border);
        }

        .file-name-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            min-width: 160px;
            border-bottom: 1px solid transparent;
            padding: 2px 4px;
            transition: var(--transition);
        }

        .file-name-input:focus {
            border-color: var(--purple);
        }

        .topbar-actions {
            display: flex;
            gap: 6px;
            margin-left: auto;
            align-items: center;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .icon-btn:hover {
            background: rgba(139, 92, 246, 0.12);
            color: var(--purple);
            border-color: var(--border-hover);
        }

        .icon-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .topbar-status {
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0 8px;
        }

        /* ── Left Toolbar ── */
        .editor-tools {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 0;
            gap: 4px;
            overflow-y: auto;
        }

        .tool-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }

        .tool-btn:hover,
        .tool-btn.active {
            background: rgba(139, 92, 246, 0.14);
            color: var(--purple);
        }

        .tool-btn .tool-label {
            font-size: 0.48rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-top: 2px;
            line-height: 1;
        }

        .tool-separator {
            width: 28px;
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ── Center: preview + timeline ── */
        .editor-center {
            display: grid;
            display: flex; flex-direction: column; overflow: hidden; background: var(--bg-primary); height: 100%;
        }

        /* Preview */
        .preview-area { flex: 1; min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .preview-screen {
            max-width: 100%;
            max-height: 100%;
            aspect-ratio: 16/9;
            background: linear-gradient(135deg, #1a0a3a, #0a1a3a);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 4px;
        }

        .preview-screen.filter-vivid video { filter: saturate(1.35) contrast(1.08); }
        .preview-screen.filter-cinematic video { filter: contrast(1.15) saturate(0.82) sepia(0.08); }
        .preview-screen.filter-bw video { filter: grayscale(1) contrast(1.12); }
        .preview-screen.filter-warm video { filter: saturate(1.2) sepia(0.22) hue-rotate(-8deg); }
        .preview-screen.filter-cool video { filter: saturate(0.92) hue-rotate(12deg) brightness(1.04); }
        .text-overlay-layer { position:absolute; inset:0; pointer-events:none; z-index:4; }
        .text-overlay { 
            position:absolute; 
            transform:translate(-50%,-50%); 
            max-width:85%; 
            color:#fff; 
            text-align:center; 
            font-weight:800; 
            font-family:'Outfit', 'Inter', sans-serif;
            text-shadow:0 2px 8px rgba(0,0,0,0.85); 
            white-space:pre-wrap; 
            line-height:1.2; 
            will-change:transform,opacity,filter; 
            letter-spacing: 0.2px;
            pointer-events:auto; 
            cursor:grab; 
            user-select:none; 
            touch-action:none;
        }
        .text-overlay:hover, .text-overlay.dragging { outline:1px dashed rgba(255,255,255,.8); outline-offset:6px; }
        .text-overlay.dragging { cursor:grabbing; animation:none !important; transform:translate(-50%,-50%) scale(1) !important; }
        .text-overlay::after { content:'↕ drag'; position:absolute; left:50%; top:100%; transform:translate(-50%,6px); opacity:0; padding:2px 5px; border-radius:4px; background:rgba(0,0,0,.65); color:#fff; font:600 10px/1 Inter,sans-serif; white-space:nowrap; pointer-events:none; transition:opacity .15s; }
        .text-overlay:hover::after, .text-overlay.dragging::after { opacity:.9; }
        .text-overlay .lyric-word {
            display: inline-block;
            white-space: pre;
            padding: 0 2px;
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s ease, text-shadow 0.15s ease, opacity 0.15s ease, filter 0.15s ease;
        }
        .text-overlay .lyric-word.upcoming {
            opacity: 0.4;
            transform: scale(0.95);
            filter: blur(0.6px);
        }
        .text-overlay .lyric-word.sung {
            opacity: 0.95;
            color: #ffffff;
            transform: scale(1);
        }
        .text-overlay .lyric-word.active-word {
            opacity: 1 !important;
            color: #fde047 !important;
            transform: scale(1.28) translateY(-3px) !important;
            text-shadow: 0 0 16px #fde047, 0 0 32px #eab308, 0 4px 12px rgba(0,0,0,0.95) !important;
            font-weight: 900;
            z-index: 10;
            filter: drop-shadow(0 0 8px rgba(253, 224, 71, 0.8));
            animation: activeWordPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes activeWordPop {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.35) translateY(-5px); }
            100% { transform: scale(1.28) translateY(-3px); }
        }
        .lyric-gradient { 
            background:linear-gradient(90deg,var(--lyric-a,#f472b6),var(--lyric-b,#60a5fa),var(--lyric-a,#f472b6)); 
            background-size:220% auto; 
            -webkit-background-clip:text; 
            background-clip:text; 
            -webkit-text-fill-color:transparent; 
            animation:lyricGradient 3s linear infinite; 
        }
        .lyric-neon { 
            text-shadow:0 0 8px var(--lyric-a,#f472b6), 0 0 20px var(--lyric-b,#60a5fa), 0 2px 6px #000; 
        }
        .lyric-outline { 
            -webkit-text-stroke:1.5px var(--lyric-b,#60a5fa); 
            text-shadow:0 2px 6px #000; 
        }
        .lyric-box { 
            padding:.3em .6em; 
            border:1.5px solid color-mix(in srgb,var(--lyric-a,#f472b6) 70%,white); 
            border-radius:.45em; 
            background:linear-gradient(135deg,color-mix(in srgb,var(--lyric-a,#f472b6) 30%,rgba(0,0,0,0.6)),color-mix(in srgb,var(--lyric-b,#60a5fa) 25%,rgba(0,0,0,0.6))); 
            backdrop-filter:blur(10px); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .lyric-glow { filter:drop-shadow(0 0 9px var(--lyric-a,#f472b6)); }
        .lyric-shadow { text-shadow:0 3px 0 rgba(0,0,0,.85),0 6px 16px rgba(0,0,0,.7); }
        .lyric-pop { animation:lyricPop .42s cubic-bezier(.2,.8,.2,1) both; }
        .lyric-slide-up { animation:lyricSlideUp .5s cubic-bezier(.2,.8,.2,1) both; }
        .lyric-pulse { animation:lyricPulse 1.2s ease-in-out infinite; }
        .lyric-word-by-word .lyric-word { animation:lyricWordIn .35s both; animation-delay:calc(var(--word-index) * 90ms); }
        @keyframes lyricGradient { to { background-position:220% center; } }
        @keyframes lyricPop { from { opacity:0; transform:translate(-50%,-50%) scale(.65); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
        @keyframes lyricSlideUp { from { opacity:0; transform:translate(-50%,10%) scale(.96); } to { opacity:1; transform:translate(-50%,-50%) scale(1); } }
        @keyframes lyricPulse { 50% { transform:translate(-50%,-50%) scale(1.06); } }
        @keyframes lyricWordIn { from { opacity:0; transform:translateY(.35em); } to { opacity:1; transform:translateY(0); } }
        .caption-overlay { bottom:8%; left:50%; top:auto; transform:translateX(-50%); background:rgba(0,0,0,.7); padding:8px 14px; border-radius:8px; font-size:1.05rem; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); }
        .transition-badge { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:9; padding:1px 4px; border-radius:3px; background:rgba(8,8,20,.8); color:#ddd6fe; font-size:9px; pointer-events:none; }
        .timeline-waveform { position:absolute; inset:3px 4px; width:calc(100% - 8px); height:calc(100% - 6px); opacity:.9; pointer-events:none; }
        .pip-video { position:absolute; z-index:3; object-fit:cover; border:1px solid rgba(255,255,255,.7); box-shadow:0 4px 20px rgba(0,0,0,.45); pointer-events:none; }
        .grade-vignette::after { content:''; position:absolute; inset:0; pointer-events:none; z-index:2; background:radial-gradient(ellipse, transparent 55%, rgba(0,0,0,.35)); }
        @keyframes clipMagicShake { 0%,100% { transform:translate(0,0) } 25% { transform:translate(calc(var(--vfx-intensity) * -1px), var(--vfx-intensity)px) } 50% { transform:translate(var(--vfx-intensity)px, calc(var(--vfx-intensity) * -1px)) } 75% { transform:translate(var(--vfx-intensity)px, var(--vfx-intensity)px) } }
        .vfx-shake { animation:clipMagicShake .16s steps(2,end) infinite; }
        .vfx-glitch { }
        .vfx-blur { }
        .lyric-item-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            transition: var(--transition);
        }
        .lyric-item-card:hover {
            background: rgba(139, 92, 246, 0.1);
            border-color: rgba(139, 92, 246, 0.4);
        }
        .lyric-item-info {
            flex: 1;
            min-width: 0;
        }
        .lyric-item-text {
            font-size: 0.78rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-primary);
        }
        .lyric-item-time {
            font-size: 0.68rem;
            color: var(--purple-light);
            margin-top: 2px;
        }

        /* ── Sunset Vaporwave Special Effects ── */
        [data-theme="vaporwave"] .editor-center {
            background: linear-gradient(to bottom, #1a0633 0%, #2d0b5a 50%, #4b0d6b 100%) !important;
            position: relative;
            z-index: 1;
        }

        [data-theme="vaporwave"] .preview-area {
            background: transparent !important;
        }

        [data-theme="vaporwave"] .editor-center::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60%;
            background:
                linear-gradient(rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(255, 0, 255, 0.25) 1.5px, transparent 1.5px);
            background-size: 50px 50px;
            transform: perspective(400px) rotateX(60deg);
            transform-origin: bottom;
            animation: gridMove 3s linear infinite;
            z-index: -1;
            opacity: 0.6;
        }

        @keyframes gridMove {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: 0 50px;
            }
        }

        [data-theme="vaporwave"] .editor-center::after {
            content: '';
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 320px;
            height: 320px;
            background: linear-gradient(#ff00ff, #ffbb00);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(255, 0, 255, 0.6);
            z-index: -2;
            opacity: 0.55;
            clip-path: polygon(0% 0%, 100% 0%, 100% 70%, 0% 70%, 0% 72%, 100% 72%, 100% 76%, 0% 76%, 0% 80%, 100% 80%, 100% 84%, 0% 84%, 0% 90%, 100% 90%, 100% 100%, 0% 100%);
        }

        [data-theme="vaporwave"] .bg-orbs {
            display: none;
        }

        [data-theme="vaporwave"] .preview-screen {
            border: 2px solid var(--purple);
            box-shadow: 0 0 40px rgba(255, 0, 255, 0.4);
            background: rgba(0, 0, 0, 0.7) !important;
            backdrop-filter: blur(12px);
        }

        .preview-idle {
            text-align: center;
        }

        .preview-idle p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 8px;
        }

        .preview-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px 16px 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            backdrop-filter: blur(4px);
        }

        .ctrl-btn:hover {
            background: rgba(139, 92, 246, 0.5);
        }

        .scrubber-wrap {
            flex: 1;
            position: relative;
        }

        .scrubber {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            outline: none;
        }

        .scrubber::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--purple);
            border-radius: 50%;
        }

        .time-display {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.72rem;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Timeline */
        .timeline-area { background: var(--bg-secondary); border-top: 1px solid var(--border); padding: 12px 16px; display: flex; flex-direction: column; max-height: 45vh; min-height: 180px; }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .timeline-title {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .track {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .track-label {
            width: 64px;
            font-size: 0.7rem;
            color: var(--text-muted);
            flex-shrink: 0;
            text-align: right;
        }

        .track-lane {
            flex: 1;
            height: 28px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
        }

        .track-lane:hover {
            border-color: var(--border-hover);
        }

        .lane-playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #38bdf8;
            z-index: 25;
            pointer-events: none;
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.9);
            border-radius: 1px;
            transition: left 0.05s linear;
        }

        .lane-playhead::before {
            content: '';
            position: absolute;
            top: 0;
            left: -3px;
            width: 8px;
            height: 6px;
            background: #38bdf8;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
        }

        .track-clip {
            position: absolute;
            top: 3px;
            bottom: 3px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 6px;
            font-size: 0.65rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            cursor: grab;
            user-select: none;
        }

        .clip-video {
            background: rgba(139, 92, 246, 0.35);
            border: 1px solid rgba(139, 92, 246, 0.6);
            color: #c4b5fd;
            left: 0;
            width: 55%;
        }

        .clip-caption {
            background: rgba(6, 182, 212, 0.3);
            border: 1px solid rgba(6, 182, 212, 0.5);
            color: #67e8f9;
            left: 8%;
            width: 35%;
        }

        .clip-music {
            background: rgba(236, 72, 153, 0.3);
            border: 1px solid rgba(236, 72, 153, 0.5);
            color: #f9a8d4;
            left: 0;
            width: 80%;
        }

        .track-clip:active {
            cursor: grabbing;
            opacity: 0.8;
        }

        .track-clip.selected {
            outline: 2px solid var(--purple-light);
            box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
            z-index: 8;
        }

        /* Trim Handles */
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 6px;
            background: rgba(255, 255, 255, 0.7);
            cursor: ew-resize;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            touch-action: none;
        }
        .trim-handle::before {
            content: '';
            position: absolute;
            inset: 0 -8px;
            z-index: 1;
        }

        .trim-handle::after {
            content: '';
            width: 2px;
            height: 12px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 1px;
        }

        .trim-handle-left {
            left: 0;
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
        }

        .trim-handle-right {
            right: 0;
            border-top-right-radius: 4px;
            border-bottom-right-radius: 4px;
        }

        .trim-handle:hover {
            background: #fff;
        }

        .clip-trimming {
            border: 2px solid #fff !important;
            cursor: ew-resize;
        }

        .clip-dragging {
            opacity: 0.5;
            transform: scale(0.95);
            z-index: 100;
        }

        .clip-delete-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 18px;
            height: 18px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
        }

        .track-clip:hover .clip-delete-btn {
            display: flex;
        }

        /* ── Right Properties Panel ── */
        .editor-props {
            background: var(--bg-card);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .props-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Outfit', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            flex-shrink: 0;
        }

        .props-body {
            flex: 1;
            overflow-y: auto;
            padding: 14px 16px;
        }

        .prop-section {
            margin-bottom: 20px;
        }

        .prop-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .prop-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .prop-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            width: 80px;
            flex-shrink: 0;
        }

        .prop-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); background-clip: padding-box;
            border-radius: 7px;
            padding: 6px 10px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            transition: var(--transition);
        }

        .prop-input:focus {
            border-color: var(--purple);
            background: rgba(139, 92, 246, 0.06);
        }

        .prop-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;

        .circle-bg {

        @media (max-width: 900px) {
            body {
                overflow: auto;

            .editor-shell {

            .editor-topbar {

            .tool-btn { width:52px; height:48px; min-width:52px; border-radius:12px; }

            .editor-props {

    <script>
        let projectState = {
            id: 'p-' + Date.now(),
            name: 'Untitled Project',
            tracks: [
                { id: 'track-v1', type: 'video', name: 'Video 1', clips: [] },
                { id: 'track-a1', type: 'audio', name: 'Audio 1', clips: [] }
            ],
            textOverlays: [],
            bassGain: 0
        };
        window.projectState = projectState;

        const MAX_TIMELINE_SECONDS = 120;
        const MIN_TRIM_SECONDS = 0.05;
        let timelineRenderQueued = false;
        let timelineZoom = 1;
        let snapEnabled = true;
        let selectedClip = null;
        const undoStack = [];
        const redoStack = [];
        const SNAP_INTERVAL = 0.25;
        const cloneState = (value) => JSON.parse(JSON.stringify(value));
        function updateHistoryButtons() {
            const undo = document.getElementById('undoBtn');
            const redo = document.getElementById('redoBtn');
            if (undo) undo.disabled = undoStack.length === 0;
            if (redo) redo.disabled = redoStack.length === 0;
        }
        function recordEdit() {
            undoStack.push(cloneState(projectState));
            if (undoStack.length > 50) undoStack.shift();
            redoStack.length = 0;
            updateHistoryButtons();
        }
        function restoreState(snapshot) {
            projectState = cloneState(snapshot);
            window.projectState = projectState;
            selectedClip = null;
            requestTimelineRender();
        }
        function undoEdit() {
            if (!undoStack.length) return;
            redoStack.push(cloneState(projectState));
            restoreState(undoStack.pop());
            updateHistoryButtons();
        }
        function redoEdit() {
            if (!redoStack.length) return;
            undoStack.push(cloneState(projectState));
            restoreState(redoStack.pop());
            updateHistoryButtons();
        }
        function toggleSnap() {
            snapEnabled = !snapEnabled;
            const button = document.getElementById('snapToggle');
            if (button) button.textContent = snapEnabled ? 'Snap: On' : 'Snap: Off';
        }
        function setTimelineZoom(value) {
            timelineZoom = clamp(Number(value) || 1, 0.5, 3);
            const container = document.getElementById('tracksContainer');
            if (container) container.style.minWidth = `${timelineZoom * 100}%`;
            requestTimelineRender();
        }
        function snapTime(value) {
            return snapEnabled ? Math.round(value / SNAP_INTERVAL) * SNAP_INTERVAL : value;
        }
        function clamp(value, min, max) { return Math.min(Math.max(value, min), max); }
        function getClipSourceDuration(clip) {
            const declared = Number(clip.duration);
            if (Number.isFinite(declared) && declared > 0) return declared;
            const mediaDuration = document.getElementById('previewVideo')?.duration;
            if (Number.isFinite(mediaDuration) && mediaDuration > 0) return mediaDuration;
            return Math.max(Number(clip.trimEnd) || 0, 1);
        }
        function requestTimelineRender() {
            if (timelineRenderQueued) return;
            timelineRenderQueued = true;
            requestAnimationFrame(() => {
                timelineRenderQueued = false;
                renderTimeline();
            });
        }

        function renderTimeline() {
            const container = document.getElementById('tracksContainer');
            if (!container) return;
            const fragment = document.createDocumentFragment();
            const maxDuration = MAX_TIMELINE_SECONDS;
            projectState.tracks.forEach(track => {
                const trackEl = document.createElement('div');
                trackEl.className = 'track';
                trackEl.onmousedown = (e) => seekFromTimeline(e);
                const label = document.createElement('span');
                label.className = 'track-label';
                label.innerText = track.name;
                const lane = document.createElement('div');
                lane.className = 'track-lane';
                lane.id = `${track.id}Track`;
                track.clips.forEach(c => {
                    const clipEl = document.createElement('div');
                    clipEl.className = `track-clip clip-${c.type}${selectedClip === c ? ' selected' : ''}`;
                    clipEl.id = `clip-${c.id}`;
                    clipEl.draggable = false;
                    clipEl.onpointerdown = (e) => {
                        if (!e.target.closest('.trim-handle')) beginMove(e, c, track, lane);
                    };
                    const sourceDuration = getClipSourceDuration(c);
                    const trimStart = clamp(Number(c.trimStart) || 0, 0, Math.max(0, sourceDuration - MIN_TRIM_SECONDS));
                    const trimEnd = clamp(Number(c.trimEnd) || sourceDuration, trimStart + MIN_TRIM_SECONDS, sourceDuration);
                    c.trimStart = trimStart;
                    c.trimEnd = trimEnd;
                    const duration = trimEnd - trimStart;
                    clipEl.style.left = (c.start / maxDuration * 100) + '%';
                    clipEl.style.width = (duration / maxDuration * 100) + '%';
                    clipEl.style.background = c.color;
                    clipEl.style.border = `1px solid ${c.borderColor}`;
                    clipEl.onclick = (e) => { e.stopPropagation(); selectClip(c); };
                    if (c.transition && c.transition.type !== 'none') {
                        const badge = document.createElement('span');
                        badge.className = 'transition-badge';
                        badge.textContent = c.transition.type;
                        clipEl.appendChild(badge);
                    }
                    if (track.type === 'audio' || c.type === 'music' || c.type === 'audio') {
                        const waveform = document.createElement('canvas');
                        waveform.className = 'timeline-waveform';
                        waveform.setAttribute('aria-label', 'Audio waveform');
                        clipEl.appendChild(waveform);
                        drawTimelineWaveform(c, waveform);
                        clipEl.title = `Audio • ${Math.round((Number(c.volume) || 1) * 100)}% volume`;
                    }
                    const leftHandle = document.createElement('div');
                    leftHandle.className = 'trim-handle trim-handle-left';
                    leftHandle.title = 'Drag to trim start';
                    leftHandle.onpointerdown = (e) => beginTrim(e, c, 'start', lane);
                    const rightHandle = document.createElement('div');
                    rightHandle.className = 'trim-handle trim-handle-right';
                    rightHandle.title = 'Drag to trim end';
                    rightHandle.onpointerdown = (e) => beginTrim(e, c, 'end', lane);
                    clipEl.append(leftHandle, rightHandle);
                    lane.appendChild(clipEl);
                });

                const lanePlayhead = document.createElement('div');
                lanePlayhead.className = 'lane-playhead';
                const vid = document.getElementById('previewVideo');
                const curProgress = (vid && vid.duration > 0) ? (vid.currentTime / vid.duration) : 0;
                lanePlayhead.style.left = (curProgress * 100) + '%';
                lane.appendChild(lanePlayhead);

                trackEl.appendChild(label);
                trackEl.appendChild(lane);
                fragment.appendChild(trackEl);
            });
            container.replaceChildren(fragment);
        }

        async function drawTimelineWaveform(clip, canvas) {
            const draw = (values) => {
                const width = Math.max(20, canvas.clientWidth || 240);
                const height = Math.max(20, canvas.clientHeight || 44);
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(236,72,153,.85)';
                const step = Math.max(1, Math.floor(values.length / width));
                for (let x = 0; x < width; x++) {
                    const amp = Math.min(1, Math.abs(values[Math.min(values.length - 1, x * step)] || 0));
                    const bar = Math.max(1, amp * (height - 4) * (Number(clip.volume) || 1));
                    ctx.fillRect(x, (height - bar) / 2, 1, bar);
                }
            };
            requestAnimationFrame(async () => {
                try {
                    const projectId = window.currentProject?.id;
                    if (!projectId || !clip.assetId || !window.AssetManager || !window.MusicEngine) return draw(new Float32Array(1));
                    const url = await AssetManager.getUrl(projectId, clip.assetId);
                    const buffer = await MusicEngine.decode_audio(url);
                    draw(MusicEngine.generate_waveform(buffer, Math.max(20, canvas.clientWidth || 240)));
                } catch (_) {
                    draw(new Float32Array(1));
                }
            });
        }

        const toolConfigs = {

                title: 'Trim Video & Clips',
                html: `<div class="prop-section">
                    <div class="prop-section-title">✂️ Trim & Cut Controls</div>
                    <p style="color:var(--text-secondary);font-size:0.78rem;line-height:1.4;margin-bottom:12px;">Drag the white handles on either end of any timeline clip, or use the instant playhead trim buttons below:</p>
                    
                    <div style="display:flex;gap:6px;margin-bottom:10px;">
                        <button class="music-btn" style="flex:1;background:rgba(56,189,248,0.15);border-color:#38bdf8;color:#38bdf8;" onclick="trimClipStartToPlayhead()">⏱ Trim Start @ Playhead (Q)</button>
                        <button class="music-btn" style="flex:1;background:rgba(56,189,248,0.15);border-color:#38bdf8;color:#38bdf8;" onclick="trimClipEndToPlayhead()">⏱ Trim End @ Playhead (W)</button>
                    </div>

                    <div class="prop-row">
                        <span class="prop-label">Trim In (Start)</span>
                        <input class="prop-input" id="guiTrimStart" type="range" min="0" max="60" step="0.1" value="0" oninput="updateActiveClipTrim('trimStart', this.value)"/>
                        <span id="guiTrimStartVal" style="font-size:0.75rem;color:var(--text-secondary);min-width:38px;">0.0s</span>
                    </div>

                    <div class="prop-row" style="margin-top:8px;">
                        <span class="prop-label">Trim Out (End)</span>
                        <input class="prop-input" id="guiTrimEnd" type="range" min="0.1" max="120" step="0.1" value="10" oninput="updateActiveClipTrim('trimEnd', this.value)"/>
                        <span id="guiTrimEndVal" style="font-size:0.75rem;color:var(--text-secondary);min-width:38px;">10.0s</span>
                    </div>

                    <div style="display:flex;justify-content:space-between;margin:12px 0 6px;font-size:0.8rem;color:var(--text-secondary);">
                        <span>Effective Duration:</span>
                        <span id="guiTrimDurationVal" style="font-weight:700;color:#38bdf8;">--</span>
                    </div>

                    <button class="music-btn" style="margin-top:8px;" onclick="resetClipTrim()">↺ Reset Clip to Full Length</button>
                    <button class="music-btn" style="margin-top:6px;background:var(--gradient-main);color:#fff;font-weight:700;" onclick="splitAtPlayhead()">✂ Split Clip at Playhead (S / C)</button>
                </div>`
            },
            split: {
                icon: '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8V5c0-1 1-2 2-2h10c1 0 2 1 2 2v3"/><path d="M19 16v3c0 1-1 2-2 2H7c-1 0-2-1-2-2v-3"/><line x1="4" y1="12" x2="20" y2="12"/></svg>',
                title: 'Split & Cut Clips',
                html: `<div class="prop-section">
                    <div class="prop-section-title">✂️ Precision Blade / Split</div>
                    <p style="color:var(--text-secondary);font-size:0.78rem;line-height:1.4;margin-bottom:12px;">Split clips at the playhead into separate, independently editable segments.</p>
                    
                    <button class="music-btn" style="background:var(--gradient-main);color:#fff;font-weight:700;font-size:0.9rem;padding:12px;" onclick="splitAtPlayhead()">✂ Split at Current Playhead (S / C)</button>

                    <div class="prop-section-title" style="margin-top:16px;">Quick Cut Actions</div>
                    <div style="display:flex;gap:6px;margin-bottom:8px;">
                        <button class="music-btn" style="flex:1;font-size:0.75rem;" onclick="cutAndDeleteLeft()" title="Cut at playhead and delete left side">✂ Cut & Delete Left</button>
                        <button class="music-btn" style="flex:1;font-size:0.75rem;" onclick="cutAndDeleteRight()" title="Cut at playhead and delete right side">✂ Cut & Delete Right</button>
                    </div>

                    <div class="prop-section-title" style="margin-top:14px;">Auto-Split Presets</div>
                    <div class="chip-grid">

        function selectClip(clip) {
            selectedClip = clip;
            updatePreviewVisuals();
            const body = document.getElementById('manualPropsBody');
            // H2 FIX: build inspector panel with DOM APIs — clip.name/id via textContent
            body.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'prop-section';

            const title = document.createElement('div');
            title.className = 'prop-section-title';
            title.textContent = 'Clip: ' + (clip.name || 'Unnamed'); // textContent = safe

            const row = document.createElement('div');
            row.className = 'prop-row';

            const label = document.createElement('span');
            label.className = 'prop-label';
            const curStart = Number.isFinite(clip.start) ? clip.start : 0;
            label.textContent = `Start Position (${curStart.toFixed(2)}s)`;

            const input = document.createElement('input');
            input.type = 'range';
            input.min = '0';
            input.max = '120';
            input.step = '0.05';
            input.className = 'prop-input';
            input.value = curStart;
            const safeClipId = /^[a-zA-Z0-9_-]+$/.test(clip.id) ? clip.id : '';
            input.addEventListener('input', function() {
                label.textContent = `Start Position (${parseFloat(this.value).toFixed(2)}s)`;
                if (safeClipId) updateClipProps(safeClipId, 'start', this.value);
            });

            const srcDur = getClipSourceDuration(clip);
            const curTrimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
            const curTrimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : srcDur;

            // Trim In row
            const trimInRow = document.createElement('div');
            trimInRow.className = 'prop-row';
            trimInRow.style.marginTop = '8px';
            const trimInLabel = document.createElement('span');
            trimInLabel.className = 'prop-label';
            trimInLabel.textContent = `Trim In (${curTrimStart.toFixed(2)}s)`;
            const trimInInput = document.createElement('input');
            trimInInput.type = 'range';
            trimInInput.min = '0';
            trimInInput.max = srcDur;
            trimInInput.step = '0.05';
            trimInInput.className = 'prop-input';
            trimInInput.value = curTrimStart;
            trimInInput.addEventListener('input', function() {
                const val = parseFloat(this.value);
                const oldStart = clip.trimStart || 0;
                clip.trimStart = Math.min(val, (clip.trimEnd || srcDur) - MIN_TRIM_SECONDS);
                clip.start = Math.max(0, (clip.start || 0) + (clip.trimStart - oldStart));
                trimInLabel.textContent = `Trim In (${clip.trimStart.toFixed(2)}s)`;
                durLabel.textContent = `Duration: ${(clip.trimEnd - clip.trimStart).toFixed(2)}s`;
                label.textContent = `Start Position (${(clip.start || 0).toFixed(2)}s)`;
                input.value = clip.start || 0;
                requestTimelineRender();
            });
            trimInRow.append(trimInLabel, trimInInput);

            // Trim Out row
            const trimOutRow = document.createElement('div');
            trimOutRow.className = 'prop-row';
            trimOutRow.style.marginTop = '8px';
            const trimOutLabel = document.createElement('span');
            trimOutLabel.className = 'prop-label';
            trimOutLabel.textContent = `Trim Out (${curTrimEnd.toFixed(2)}s)`;
            const trimOutInput = document.createElement('input');
            trimOutInput.type = 'range';
            trimOutInput.min = '0.1';
            trimOutInput.max = srcDur;
            trimOutInput.step = '0.05';
            trimOutInput.className = 'prop-input';
            trimOutInput.value = curTrimEnd;
            trimOutInput.addEventListener('input', function() {
                const val = parseFloat(this.value);
                clip.trimEnd = Math.max((clip.trimStart || 0) + MIN_TRIM_SECONDS, val);
                trimOutLabel.textContent = `Trim Out (${clip.trimEnd.toFixed(2)}s)`;
                durLabel.textContent = `Duration: ${(clip.trimEnd - clip.trimStart).toFixed(2)}s`;
                requestTimelineRender();
            });
            trimOutRow.append(trimOutLabel, trimOutInput);

            // Duration display
            const durRow = document.createElement('div');
            durRow.style.cssText = 'display:flex;justify-content:space-between;margin:8px 0 4px;font-size:0.78rem;color:var(--text-secondary);';
            const durLabel = document.createElement('span');
            durLabel.style.fontWeight = '700';
            durLabel.style.color = '#38bdf8';
            durLabel.textContent = `Duration: ${(curTrimEnd - curTrimStart).toFixed(2)}s`;
            const resetTrimBtn = document.createElement('a');
            resetTrimBtn.href = '#';
            resetTrimBtn.style.cssText = 'color:var(--purple);text-decoration:none;font-size:0.75rem;';
            resetTrimBtn.textContent = '↺ Reset Trim';
            resetTrimBtn.onclick = (e) => { e.preventDefault(); resetClipTrim(); selectClip(clip); };
            durRow.append(durLabel, resetTrimBtn);

            // Quick playhead trim buttons
            const trimBtnRow = document.createElement('div');
            trimBtnRow.style.cssText = 'display:flex;gap:6px;margin:8px 0;';
            const trimStartBtn = document.createElement('button');
            trimStartBtn.className = 'music-btn';
            trimStartBtn.style.cssText = 'flex:1;font-size:0.75rem;padding:6px;';
            trimStartBtn.textContent = '⏱ Trim In @ Playhead';
            trimStartBtn.onclick = () => { trimClipStartToPlayhead(); selectClip(clip); };
            const trimEndBtn = document.createElement('button');
            trimEndBtn.className = 'music-btn';
            trimEndBtn.style.cssText = 'flex:1;font-size:0.75rem;padding:6px;';
            trimEndBtn.textContent = '⏱ Trim Out @ Playhead';
            trimEndBtn.onclick = () => { trimClipEndToPlayhead(); selectClip(clip); };
            trimBtnRow.append(trimStartBtn, trimEndBtn);

            const splitBtn = document.createElement('button');
            splitBtn.className = 'music-btn';
            splitBtn.style.cssText = 'margin-top:10px;background:var(--gradient-main);color:#fff;font-weight:700;';
            splitBtn.textContent = '✂ Split Clip at Playhead (S)';
            splitBtn.addEventListener('click', splitAtPlayhead);

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'music-btn';
            deleteBtn.style.cssText = 'margin-top:8px;color:#fca5a5;border-color:rgba(239,68,68,.45);';
            deleteBtn.textContent = 'Delete Clip (Del)';
            deleteBtn.addEventListener('click', deleteSelectedClip);

            const fpsRow = document.createElement('div');
            fpsRow.className = 'prop-row';
            fpsRow.style.marginTop = '10px';
            const fpsLabel = document.createElement('span');
            fpsLabel.className = 'prop-label';
            fpsLabel.textContent = 'Source FPS';
            const fpsSelect = document.createElement('select');
            fpsSelect.className = 'prop-input';
            [['', 'Auto / preserve'], ['24', '24 FPS'], ['30', '30 FPS'], ['60', '60 FPS'], ['120', '120 FPS']].forEach(([value, text]) => {
                const option = document.createElement('option');
                option.value = value;
                option.textContent = text;
                option.selected = String(clip.sourceFps || '') === value;
                fpsSelect.appendChild(option);
            });
            fpsSelect.addEventListener('change', () => {
                recordEdit();
                if (fpsSelect.value) clip.sourceFps = Number(fpsSelect.value);
                else delete clip.sourceFps;
            });
            fpsRow.append(fpsLabel, fpsSelect);

            const clipTrack = projectState.tracks.find(track => track.clips?.includes(clip));
            if (clipTrack?.type === 'audio' || clip.type === 'audio' || clip.type === 'music') {
                const audioSection = document.createElement('div');
                audioSection.className = 'prop-section';
                audioSection.style.marginTop = '12px';

                fadeOutInput.addEventListener('input', e => { recordEdit(); clip.fadeOut = clamp(Number(e.target.value) || 0, 0, 10); fadeOutVal.textContent = parseFloat(e.target.value).toFixed(1) + 's'; });

        function seekFromTimeline(event) {
            if (event.target.closest('.track-clip') || event.target.closest('.trim-handle')) return;
            const lane = event.currentTarget.querySelector('.track-lane');
            const video = document.getElementById('previewVideo');
            if (!lane || !video) return;
            const rect = lane.getBoundingClientRect();
            const fraction = clamp((event.clientX - rect.left) / Math.max(rect.width, 1), 0, 1);
            const timelineTime = fraction * MAX_TIMELINE_SECONDS;
            
            const videoTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            if (videoTrack && videoTrack.clips.length) {
                let targetClip = videoTrack.clips.find(c => {
                    const dur = (c.trimEnd || c.duration || 1) - (c.trimStart || 0);
                    return timelineTime >= (c.start || 0) && timelineTime <= (c.start || 0) + dur;
                });
                if (targetClip) {
                    const rel = Math.max(0, timelineTime - (targetClip.start || 0));
                    video.currentTime = (targetClip.trimStart || 0) + rel;
                    return;
                }
            }
            if (Number.isFinite(video.duration) && video.duration > 0) {
                video.currentTime = fraction * video.duration;
            }
        }

        function addTrack(type) {
            recordEdit();
            const count = projectState.tracks.filter(track => track.type === type).length + 1;
            projectState.tracks.push({
                id: `track-${type}-${Date.now()}`,
                type,
                name: `${type === 'video' ? 'Video' : 'Audio'} ${count}`,
                clips: []
            });
            requestTimelineRender();
        }

        function beginMove(event, clip, track, lane) {
            if (event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            selectClip(clip);
            const startX = event.clientX;
            const initialStart = Number(clip.start) || 0;
            const initialState = cloneState(projectState);
            const laneWidth = Math.max(lane.clientWidth, 1);
            const clipDuration = Math.max(MIN_TRIM_SECONDS, (Number(clip.trimEnd) || 0) - (Number(clip.trimStart) || 0));
            const clipEl = document.getElementById(`clip-${clip.id}`);
            clipEl?.classList.add('clip-dragging');

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - startX) / laneWidth) * MAX_TIMELINE_SECONDS;
                const maxStart = Math.max(0, MAX_TIMELINE_SECONDS - clipDuration);
                clip.start = clamp(snapTime(initialStart + delta), 0, maxStart);
                if (clipEl) clipEl.style.left = `${(clip.start / MAX_TIMELINE_SECONDS) * 100}%`;
            };
            const onEnd = () => {
                clipEl?.classList.remove('clip-dragging');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.start !== initialStart) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                }
            };
            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        function deleteSelectedClip() {
            if (!selectedClip) return;
            const clipId = selectedClip.id;
            const track = projectState.tracks.find(item => item.clips?.some(clip => clip.id === clipId));
            if (!track) return;
            recordEdit();
            track.clips = track.clips.filter(clip => clip.id !== clipId);
            selectedClip = null;
            requestTimelineRender();
        }

        document.addEventListener('keydown', (event) => {
            const tag = document.activeElement?.tagName;
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            const modifier = event.ctrlKey || event.metaKey;
            if (modifier && event.key.toLowerCase() === 'z') {
                event.preventDefault();
                event.shiftKey ? redoEdit() : undoEdit();
            } else if (modifier && event.key.toLowerCase() === 'y') {
                event.preventDefault();
                redoEdit();
            } else if (event.key === 'Delete' || event.key === 'Backspace') {
                event.preventDefault();
                deleteSelectedClip();
            } else if (event.key.toLowerCase() === 's' || event.key.toLowerCase() === 'c') {
                event.preventDefault();
                splitAtPlayhead();
            } else if (event.key.toLowerCase() === 'q') {
                event.preventDefault();
                trimClipStartToPlayhead();
            } else if (event.key.toLowerCase() === 'w') {
                event.preventDefault();
                trimClipEndToPlayhead();
            } else if (event.code === 'Space') {
                event.preventDefault();
                togglePlay();
            }
        });

        function beginTrim(event, clip, edge, lane) {
            event.preventDefault();
            event.stopPropagation();
            const laneRect = lane.getBoundingClientRect();
            const sourceDuration = getClipSourceDuration(clip);
            const initialTrimStart = Number(clip.trimStart) || 0;
            const initialTrimEnd = Number(clip.trimEnd) || sourceDuration;
            const initialStart = Number(clip.start) || 0;
            const initialState = cloneState(projectState);
            const clipEl = event.currentTarget.parentElement;
            clipEl.classList.add('clip-trimming');
            event.currentTarget.setPointerCapture?.(event.pointerId);

            const onMove = (moveEvent) => {
                const delta = ((moveEvent.clientX - event.clientX) / Math.max(laneRect.width, 1)) * MAX_TIMELINE_SECONDS;
                if (edge === 'start') {
                    const newTrimStart = clamp(initialTrimStart + delta, 0, initialTrimEnd - MIN_TRIM_SECONDS);
                    const trimDelta = newTrimStart - initialTrimStart;
                    clip.trimStart = newTrimStart;
                    clip.start = Math.max(0, initialStart + trimDelta);
                    clipEl.style.left = `${(clip.start / MAX_TIMELINE_SECONDS) * 100}%`;
                } else {
                    clip.trimEnd = clamp(initialTrimEnd + delta, (clip.trimStart || 0) + MIN_TRIM_SECONDS, sourceDuration);
                }
                selectedClip = clip;
                const dur = clip.trimEnd - (clip.trimStart || 0);
                clipEl.style.width = `${(dur / MAX_TIMELINE_SECONDS) * 100}%`;
            };

            const onEnd = () => {
                clipEl.classList.remove('clip-trimming');
                window.removeEventListener('pointermove', onMove);
                window.removeEventListener('pointerup', onEnd);
                if (clip.trimStart !== initialTrimStart || clip.trimEnd !== initialTrimEnd) {
                    undoStack.push(initialState);
                    if (undoStack.length > 50) undoStack.shift();
                    redoStack.length = 0;
                    updateHistoryButtons();
                    requestTimelineRender();
                    updateTrimInspectors(clip);
                }
            };

            window.addEventListener('pointermove', onMove);
            window.addEventListener('pointerup', onEnd, { once: true });
        }

        function getClipUnderPlayhead() {
            const vid = document.getElementById('previewVideo');
            const time = vid ? vid.currentTime : 0;
            if (selectedClip) {
                const tr = projectState.tracks.find(t => t.clips.includes(selectedClip));
                if (tr) return { clip: selectedClip, track: tr };
            }
            for (const track of projectState.tracks) {
                for (const clip of track.clips) {
                    if (time >= (clip.trimStart || 0) - 0.05 && time <= (clip.trimEnd || clip.duration || 9999)) {
                        return { clip, track };
                    }
                }
            }
            const defaultTrack = projectState.tracks.find(t => t.type === 'video') || projectState.tracks[0];
            const defaultClip = defaultTrack?.clips[0] || null;
            return { clip: defaultClip, track: defaultTrack };
        }

        function splitAtPlayhead() {
            const vid = document.getElementById('previewVideo');
            if (!vid || !vid.src) return showToast('Please load a video first!', '⚠️');
            
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('No clip found at playhead to split.', '⚠️');

            const time = vid.currentTime;
            const sourceDuration = getClipSourceDuration(clip);
            const trimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
            const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : sourceDuration;
            
            let splitPoint = time;
            if (splitPoint <= trimStart + MIN_TRIM_SECONDS || splitPoint >= trimEnd - MIN_TRIM_SECONDS) {
                const relativeSplit = (time - (clip.start || 0)) + trimStart;
                if (relativeSplit > trimStart + MIN_TRIM_SECONDS && relativeSplit < trimEnd - MIN_TRIM_SECONDS) {
                    splitPoint = relativeSplit;
                } else {
                    return showToast('Move playhead inside the clip to split.', '⚠️');
                }
            }

            recordEdit();
            const originalTrimEnd = trimEnd;
            const newClip = JSON.parse(JSON.stringify(clip));
            newClip.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            
            clip.trimEnd = splitPoint;
            
            newClip.trimStart = splitPoint;
            newClip.trimEnd = originalTrimEnd;
            newClip.start = (clip.start || 0) + (splitPoint - trimStart);
            
            const clipIdx = track.clips.indexOf(clip);
            if (clipIdx !== -1) {
                track.clips.splice(clipIdx + 1, 0, newClip);
            } else {
                track.clips.push(newClip);
            }
            
            selectedClip = newClip;
            requestTimelineRender();
            selectClip(newClip);
            showToast('✂ Clip successfully split into two!', '✂️', 'success');
        }

        function trimClipStartToPlayhead() {
            const { clip } = getClipUnderPlayhead();
            if (!clip) return showToast('No clip selected to trim.', '⚠️');
            const vid = document.getElementById('previewVideo');
            const time = vid ? vid.currentTime : 0;
            const sourceDuration = getClipSourceDuration(clip);
            const trimEnd = Number.isFinite(clip.trimEnd) ? clip.trimEnd : sourceDuration;
            
            if (time >= trimEnd - MIN_TRIM_SECONDS) {
                return showToast('Playhead must be before the end of the clip.', '⚠️');
            }
            recordEdit();
            const oldTrimStart = clip.trimStart || 0;
            clip.trimStart = Math.max(0, time);
            clip.start = Math.max(0, (clip.start || 0) + (clip.trimStart - oldTrimStart));
            requestTimelineRender();
            updateTrimInspectors(clip);
            showToast(`Trim In set to ${clip.trimStart.toFixed(2)}s`, '✂️', 'success');
        }

        function trimClipEndToPlayhead() {
            const { clip } = getClipUnderPlayhead();
            if (!clip) return showToast('No clip selected to trim.', '⚠️');
            const vid = document.getElementById('previewVideo');
            const time = vid ? vid.currentTime : 0;
            const trimStart = Number.isFinite(clip.trimStart) ? clip.trimStart : 0;
            
            if (time <= trimStart + MIN_TRIM_SECONDS) {
                return showToast('Playhead must be after the start of the clip.', '⚠️');
            }
            recordEdit();
            clip.trimEnd = time;

            updateTrimInspectors(clip);

        function resetClipTrim() {

            recordEdit();
            const sourceDuration = getClipSourceDuration(clip);
            clip.trimStart = 0;
            clip.trimEnd = sourceDuration;
            requestTimelineRender();
            updateTrimInspectors(clip);
            showToast('Trim reset to full video length.', '↺', 'info');
        }

        function updateActiveClipTrim(prop, val) {
            const { clip } = getClipUnderPlayhead();
            if (!clip) return;
            const num = parseFloat(val);
            if (!Number.isFinite(num)) return;
            recordEdit();
            const srcDur = getClipSourceDuration(clip);
            if (prop === 'trimStart') {
                const oldTrimStart = clip.trimStart || 0;
                clip.trimStart = Math.max(0, Math.min(num, (clip.trimEnd || srcDur) - MIN_TRIM_SECONDS));
                clip.start = Math.max(0, (clip.start || 0) + (clip.trimStart - oldTrimStart));
            } else if (prop === 'trimEnd') {
                clip.trimEnd = Math.max((clip.trimStart || 0) + MIN_TRIM_SECONDS, Math.min(num, srcDur));
            }
            requestTimelineRender();
            updateTrimInspectors(clip);
        }

        function updateTrimInspectors(clip) {
            if (!clip) return;
            const srcDur = getClipSourceDuration(clip);
            const ts = document.getElementById('guiTrimStart');
            const te = document.getElementById('guiTrimEnd');
            const tsVal = document.getElementById('guiTrimStartVal');
            const teVal = document.getElementById('guiTrimEndVal');
            const durVal = document.getElementById('guiTrimDurationVal');
            if (ts) { ts.max = srcDur; ts.value = (clip.trimStart || 0).toFixed(2); }
            if (te) { te.max = srcDur; te.value = (clip.trimEnd || srcDur).toFixed(2); }
            if (tsVal) tsVal.textContent = (clip.trimStart || 0).toFixed(1) + 's';
            if (teVal) teVal.textContent = (clip.trimEnd || srcDur).toFixed(1) + 's';

        function splitClipHalves() {
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('No clip found.', '⚠️');
            const srcDur = getClipSourceDuration(clip);
            const start = clip.trimStart || 0;
            const end = clip.trimEnd || srcDur;
            const mid = start + (end - start) / 2;
            
            recordEdit();
            const originalTrimEnd = end;
            const newClip = JSON.parse(JSON.stringify(clip));
            newClip.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            clip.trimEnd = mid;
            newClip.trimStart = mid;
            newClip.trimEnd = originalTrimEnd;
            newClip.start = (clip.start || 0) + (mid - start);
            
            const idx = track.clips.indexOf(clip);
            if (idx !== -1) track.clips.splice(idx + 1, 0, newClip);
            else track.clips.push(newClip);
            
            selectedClip = newClip;
            requestTimelineRender();
            selectClip(newClip);
            showToast('Clip split into 2 equal halves!', '✂️', 'success');

        function splitEveryNSeconds(n) {
            const { clip, track } = getClipUnderPlayhead();
            if (!clip || !track) return showToast('No clip found.', '⚠️');
            const srcDur = getClipSourceDuration(clip);
            const start = clip.trimStart || 0;
            const end = clip.trimEnd || srcDur;
            const total = end - start;
            if (total <= n) return showToast(`Clip is shorter than ${n}s.`, '⚠️');
            
            recordEdit();
            const originalIndex = track.clips.indexOf(clip);
            const newClips = [];
            let current = start;
            let currentTimeline = clip.start || 0;
            
            while (current < end) {
                const next = Math.min(end, current + n);
                const c = JSON.parse(JSON.stringify(clip));
                c.id = 'clip-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
                c.trimStart = current;
                c.trimEnd = next;
                c.start = currentTimeline;
                newClips.push(c);
                currentTimeline += (next - current);
                current = next;
            }
            
            if (originalIndex !== -1) {
                track.clips.splice(originalIndex, 1, ...newClips);
            }
            requestTimelineRender();
            showToast(`Split clip into ${newClips.length} pieces of ${n}s!`, '✂️', 'success');
        }

        function currentClipTime(clip = getActiveClip()) {

        function addKeyframe() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please load a video clip first.', '⚠️');
            recordEdit();
            clip.keyframes ||= [];
            const time = currentClipTime(clip);
            clip.keyframes = clip.keyframes.filter(item => Math.abs(item.time - time) > 0.01);
            clip.keyframes.push({
                time,
                x: clamp(Number(document.getElementById('keyframeX')?.value) || 0, -100, 100),
                y: clamp(Number(document.getElementById('keyframeY')?.value) || 0, -100, 100),
                scale: clamp(Number(document.getElementById('keyframeScale')?.value) || 100, 10, 300),
                rotation: clamp(Number(document.getElementById('keyframeRotation')?.value) || 0, -360, 360),
                opacity: clamp(Number(document.getElementById('keyframeOpacity')?.value) || 100, 0, 100)
            });

        function addSpeedPoint() {
            const clip = getActiveClip();
            if (!clip) return showToast('Please load a video clip first.', '⚠️');
            recordEdit();
            clip.speedSegments ||= [];
            const time = currentClipTime(clip);
            const speed = clamp(Number(document.getElementById('speedValue')?.value) || 1, 0.1, 8);
            clip.speedSegments = clip.speedSegments.filter(item => Math.abs(item.time - time) > 0.01);
            clip.speedSegments.push({ time, speed });

            updatePreviewVisuals();
            showToast(`${speed}× speed point added.`, '⏩', 'success');
        }

        function interpolateKeyframes(clip, time) {
            const frames = (clip?.keyframes || []).slice().sort((a, b) => a.time - b.time);
            const normalized = frames.map(frame => ({ x: 0, y: 0, scale: 100, rotation: 0, opacity: 100, ...frame }));
            if (!normalized.length) return { x: 0, y: 0, scale: 100, rotation: 0, opacity: 100 };
            if (time <= normalized[0].time) return normalized[0];
            if (time >= normalized[normalized.length - 1].time) return normalized[normalized.length - 1];
            const nextIndex = normalized.findIndex(frame => frame.time >= time);
            const a = normalized[nextIndex - 1];
            const b = normalized[nextIndex];
            const ratio = (time - a.time) / Math.max(b.time - a.time, 0.001);
            return ['x', 'y', 'scale', 'rotation', 'opacity'].reduce((result, key) => {
                result[key] = a[key] + (b[key] - a[key]) * ratio;
                return result;
            }, {});
        }

        function speedAtTime(clip, time) {
            const points = (clip?.speedSegments || []).filter(item => Number.isFinite(item.time)).sort((a, b) => a.time - b.time);
            let speed = 1;
            for (const point of points) {
                if (point.time > time) break;
                speed = clamp(Number(point.speed) || 1, 0.1, 8);
            }
            return speed;
        }

        function updatePreviewVisuals() {
            const screen = document.getElementById('previewScreen');
            const video = document.getElementById('previewVideo');
            if (!screen) return;
            const activeClip = getActiveClip();
            screen.className = screen.className.replace(/\bfilter-\S+/g, '').trim();
            if (activeClip?.filter) screen.classList.add(`filter-${activeClip.filter}`);
            if (video && activeClip) {
                const time = currentClipTime(activeClip);
                const props = interpolateKeyframes(activeClip, time);
                video.style.transform = `translate(${props.x}%, ${props.y}%) scale(${props.scale / 100}) rotate(${props.rotation}deg)`;
                video.style.opacity = String(props.opacity / 100);
                video.playbackRate = speedAtTime(activeClip, time);
                const vfx = activeClip.vfx || {};
                const level = clamp(Number(vfx.intensity) || 0, 0, 100) / 100;
                video.classList.remove('vfx-glitch', 'vfx-blur', 'vfx-shake');
                video.style.setProperty('--vfx-intensity', `${Math.max(1, level * 10)}`);
                const baseFilter = getBasePreviewFilter(activeClip.filter);
                const gradeFilter = getGradePreviewFilter(activeClip.colorGrade);
                const glitchFilter = vfx.preset === 'glitch' ? `contrast(${1 + level}) saturate(${1 + level * 1.5}) hue-rotate(${level * 18}deg)` : '';
                const blurFilter = vfx.preset === 'blur' ? `blur(${level * 8}px)` : '';
                video.style.filter = `${baseFilter} ${gradeFilter} ${glitchFilter} ${blurFilter}`.trim();
                if (vfx.preset === 'shake') video.classList.add('vfx-shake');
                if (vfx.preset === 'glitch') video.classList.add('vfx-glitch');
                if (vfx.preset === 'blur') video.classList.add('vfx-blur');
            }
            renderPipOverlays();
            renderTextOverlays();
        }

        function getBasePreviewFilter(filter) {
            return ({
                vivid: 'saturate(1.8) contrast(1.15) brightness(1.05)',
                cinematic: 'contrast(1.25) saturate(0.75) sepia(0.2)',
                bw: 'grayscale(1) contrast(1.2) brightness(0.95)',
                warm: 'saturate(1.3) sepia(0.3) hue-rotate(-10deg)',
                cool: 'saturate(1.1) hue-rotate(18deg) brightness(1.05)'
            })[filter] || '';
        }

        function getGradePreviewFilter(grade = {}) {
            const preset = grade.preset || 'none';
            const presets = {
                'teal-orange': 'contrast(1.18) saturate(1.35) sepia(.1) hue-rotate(-10deg)',
                film: 'contrast(1.1) saturate(.85) sepia(.2)',
                bleach: 'contrast(1.4) saturate(.4)',
                noir: 'grayscale(1) contrast(1.35)',
                sunset: 'saturate(1.45) sepia(.32) hue-rotate(-15deg)'
            };
            const exposure = Math.pow(2, Number(grade.exposure) || 0);
            const contrast = Number(grade.contrast) || 1;
            const saturation = Number(grade.saturation) || 1;
            return `${presets[preset] || ''} brightness(${exposure}) contrast(${contrast}) saturate(${saturation})`.trim();
        }

        const pipVideoCache = new Map();
        async function renderPipOverlays() {
            const screen = document.getElementById('previewScreen');
            const mainVideo = document.getElementById('previewVideo');
            if (!screen || !mainVideo) return;
            const now = mainVideo.currentTime || 0;
            const activeIds = new Set();
            for (const track of projectState.tracks.filter(item => item.type === 'video').slice(1)) {
                for (const clip of track.clips || []) {
                    const duration = Math.max(0.01, (Number(clip.trimEnd) || Number(clip.duration) || 1) - (Number(clip.trimStart) || 0));
                    if (now < (Number(clip.start) || 0) || now > (Number(clip.start) || 0) + duration) continue;
                    activeIds.add(clip.id);
                    let pip = pipVideoCache.get(clip.id);
                    if (!pip) {
                        if (!window.currentProject?.id || !clip.assetId) continue;
                        pip = document.createElement('video');
                        pip.className = 'pip-video';
                        pip.muted = true;
                        pip.playsInline = true;
                        pip.src = await AssetManager.getUrl(window.currentProject?.id, clip.assetId);
                        screen.appendChild(pip);
                        pipVideoCache.set(clip.id, pip);
                    }
                    const settings = clip.pip || { position: 'bottom-right', size: 32, opacity: 100 };
                    const margin = 3;
                    pip.style.width = `${settings.size}%`;
                    pip.style.height = `${settings.size * .5625}%`;
                    pip.style.opacity = `${settings.opacity / 100}`;
                    pip.style.top = settings.position.startsWith('top') ? `${margin}%` : 'auto';
                    pip.style.bottom = settings.position.startsWith('bottom') ? `${margin}%` : 'auto';
                    pip.style.left = settings.position.endsWith('left') ? `${margin}%` : 'auto';
                    pip.style.right = settings.position.endsWith('right') ? `${margin}%` : 'auto';
                    pip.currentTime = (Number(clip.trimStart) || 0) + now - (Number(clip.start) || 0);
                    if (!mainVideo.paused) pip.play().catch(() => {});
                }
            }
            for (const [id, pip] of pipVideoCache) if (!activeIds.has(id)) pip.style.display = 'none'; else pip.style.display = 'block';
        }

        let activeTextDrag = null;

        function syncTextOverlayPositionControls(item) {
            const x = clamp(Number(item.x) || 50, 5, 95);
            const y = clamp(Number(item.y) || 76, 5, 95);
            const xInput = document.getElementById('overlayX');
            const yInput = document.getElementById('overlayY');
            if (xInput) xInput.value = String(Math.round(x));
            if (yInput) yInput.value = String(Math.round(y));

            const yValue = document.getElementById('overlayYValue');

        function beginTextOverlayDrag(event, item, element) {
            if (event.button !== undefined && event.button !== 0) return;
            event.preventDefault();
            event.stopPropagation();
            recordEdit();
            activeTextDrag = {
                item,
                element,
                pointerId: event.pointerId,
                startX: event.clientX,
                startY: event.clientY,
                startItemX: Number(item.x) || 50,
                startItemY: Number(item.y) || 76,
                rect: document.getElementById('previewScreen')?.getBoundingClientRect()
            };
            element.classList.add('dragging');
            try { element.setPointerCapture?.(event.pointerId); } catch (_) { /* window listeners still track the drag */ }
            window.addEventListener('pointermove', moveTextOverlayDrag);
            window.addEventListener('pointerup', endTextOverlayDrag, { once: true });
            window.addEventListener('pointercancel', endTextOverlayDrag, { once: true });
        }

        function moveTextOverlayDrag(event) {
            const drag = activeTextDrag;
            if (!drag || (drag.pointerId !== undefined && event.pointerId !== drag.pointerId)) return;
            const rect = drag.rect || document.getElementById('previewScreen')?.getBoundingClientRect();
            if (!rect || !rect.width || !rect.height) return;
            drag.item.x = clamp(drag.startItemX + ((event.clientX - drag.startX) / rect.width) * 100, 5, 95);
            drag.item.y = clamp(drag.startItemY + ((event.clientY - drag.startY) / rect.height) * 100, 5, 95);
            drag.element.style.left = `${drag.item.x}%`;
            drag.element.style.top = `${drag.item.y}%`;
            syncTextOverlayPositionControls(drag.item);
        }

        function endTextOverlayDrag(event) {
            const drag = activeTextDrag;
            if (!drag) return;
            if (event?.pointerId !== undefined && drag.pointerId !== undefined && event.pointerId !== drag.pointerId) return;
            drag.element.classList.remove('dragging');
            try { drag.element.releasePointerCapture?.(drag.pointerId); } catch (_) { /* capture may already be released */ }
            activeTextDrag = null;
            window.removeEventListener('pointermove', moveTextOverlayDrag);
            window.removeEventListener('pointercancel', endTextOverlayDrag);
            requestTimelineRender();
            showToast('Text position updated.', '↕', 'success');
        }

        function renderTextOverlays() {
            const layer = document.getElementById('textOverlayLayer');
            if (!layer) return;
            layer.replaceChildren();
            const now = document.getElementById('previewVideo')?.currentTime || 0;
            const activeOverlays = (projectState.textOverlays || []).filter(item => now >= Number(item.start || 0) && now <= Number(item.end || 0));
            
            activeOverlays.forEach(item => {
                const el = document.createElement('div');
                const style = item.style || (item.kind === 'caption' ? 'solid' : 'gradient');
                const animation = item.animation || 'word-by-word';
                const textFilter = item.textFilter || 'none';
                el.className = `text-overlay ${item.kind === 'caption' ? 'caption-overlay' : ''} lyric-${style} lyric-${animation} lyric-${textFilter}`.trim();
                el.style.left = `${clamp(Number(item.x) || 50, 5, 95)}%`;
                el.style.top = `${clamp(Number(item.y) || (item.kind === 'caption' ? 84 : 76), 5, 95)}%`;
                el.style.fontSize = `${clamp(Number(item.size) || 32, 14, 96)}px`;
                el.style.setProperty('--lyric-a', item.colorA || item.color || '#f472b6');
                el.style.setProperty('--lyric-b', item.colorB || item.color || '#60a5fa');
                el.title = 'Drag to position text';
                el.onpointerdown = (event) => beginTextOverlayDrag(event, item, el);

                const rawText = String(item.text || '').trim();
                const words = rawText.split(/\s+/).filter(Boolean);
                const start = Number(item.start || 0);
                const end = Number(item.end || start + 3);
                const duration = Math.max(0.1, end - start);
                const elapsed = Math.max(0, now - start);
                const progress = Math.min(1, elapsed / duration);
                const activeWordIndex = Math.min(words.length - 1, Math.floor(progress * words.length));

                if (animation === 'word-by-word' || animation === 'pop' || animation === 'slide-up' || animation === 'pulse' || item.kind === 'caption') {
                    words.forEach((word, index) => {
                        const span = document.createElement('span');
                        let stateClass = 'upcoming';
                        if (index < activeWordIndex) stateClass = 'sung';
                        else if (index === activeWordIndex) stateClass = 'active-word';
                        
                        span.className = `lyric-word ${stateClass}`;
                        span.style.setProperty('--word-index', index);
                        span.textContent = word + (index < words.length - 1 ? ' ' : '');
                        el.appendChild(span);
                    });
                } else {
                    el.textContent = rawText;
                }
                layer.appendChild(el);
            });
        }
